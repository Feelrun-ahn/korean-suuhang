<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고전소설 연습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfbf9;
  --ink:#16191d;
  --ink-2:#5c6169;
  --ink-3:#9aa0a8;
  --rule:#e4e4de;
  --rule-2:#f0f0ea;
  --mark:#b03a2b;
  --mark-bg:#faefec;
  --ok-bg:#eef1ee;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  font-size:15px;line-height:1.62;letter-spacing:-.1px;
}
.serif{font-family:"Noto Serif KR",serif}
.wrap{max-width:620px;margin:0 auto;padding:0 20px 56px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px}

/* top ------------------------------------------------ */
.top{padding:26px 0 14px}
.top h1{font-family:"Noto Serif KR",serif;font-weight:600;font-size:21px;margin:0;letter-spacing:-.6px}
.top .sub{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.top .by{font-size:10.5px;color:var(--ink-3);margin-top:6px;letter-spacing:.2px}

.judge{margin-top:18px;padding:13px 0 0;border-top:1px solid var(--rule-2)}
.judge .ask{font-size:12.5px;color:var(--ink-2);margin:0 0 9px}
.judge .set{display:flex;gap:8px;flex-wrap:wrap}
.flip{
  padding:8px 13px;border:1px solid var(--rule);border-radius:20px;background:#fff;
  font-size:12.5px;color:var(--ink-2);transition:border-color .15s,color .15s;
}
.flip:hover{border-color:var(--ink-3)}
.flip.on{border-color:var(--ink);color:var(--ink);font-weight:500}
.flip.warn.on{border-color:var(--mark);color:var(--mark)}
.flip.small{font-size:12px;padding:7px 11px}

.ed label{display:block;font-size:11.5px;color:var(--ink-3);margin:16px 0 5px}
.ed textarea{min-height:auto}
.ed textarea.a{min-height:110px}
.ed textarea.k{min-height:130px;font-size:14px;line-height:1.75}
.ed textarea.x{min-height:56px;font-size:14px}
.ed .note{font-size:11.5px;color:var(--ink-3);line-height:1.6;margin:5px 0 0}
.dump{width:100%;min-height:120px;font-size:11px;font-family:ui-monospace,monospace;margin-top:10px;
      border:1px solid var(--rule);border-radius:7px;padding:10px;background:#fff;color:var(--ink-2)}
.hr{height:1px;background:var(--rule);margin:0}

.tally{display:flex;align-items:baseline;gap:6px;padding:14px 0 4px}
.tally .big{font-family:"Noto Serif KR",serif;font-size:26px;font-weight:600;line-height:1}
.tally .of{font-size:13px;color:var(--ink-3)}

/* work rows ------------------------------------------ */
.rows{margin-top:8px}
.row{border-top:1px solid var(--rule-2);position:relative}
.row:first-child{border-top:1px solid var(--rule)}
.rowhead{
  width:100%;background:none;border:0;padding:15px 0 15px;
  display:flex;align-items:center;gap:14px;text-align:left;
}
.rowhead .nm{flex:1;min-width:0}
.rowhead .nm b{font-family:"Noto Serif KR",serif;font-size:17px;font-weight:600;display:block;letter-spacing:-.3px}
.rowhead .nm span{font-size:11.5px;color:var(--ink-3)}
.frac{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.done .frac{color:var(--ink)}
.mark{
  flex:none;width:26px;height:26px;border:1.5px solid var(--mark);border-radius:4px;
  display:grid;place-items:center;color:var(--mark);
  font-family:"Noto Serif KR",serif;font-size:14px;font-weight:600;
}
.track{position:absolute;left:0;bottom:0;height:1.5px;width:100%;background:transparent}
.track i{display:block;height:100%;background:var(--ink);width:0;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* accordion ------------------------------------------ */
.panel{overflow:hidden;max-height:0;transition:max-height .28s cubic-bezier(.4,0,.2,1)}
.panel.open{max-height:200px}
.panel-in{padding:2px 0 16px;display:flex;gap:8px}
.pill{
  flex:1;border:1px solid var(--rule);background:#fff;border-radius:7px;
  padding:10px 12px;text-align:left;transition:border-color .15s;
}
.pill:hover{border-color:var(--ink-3)}
.pill b{display:block;font-size:13.5px;font-weight:500}
.pill span{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pill.full{border-color:var(--rule);background:var(--ok-bg)}

/* quiz ----------------------------------------------- */
.qtop{display:flex;align-items:center;gap:10px;padding:20px 0 12px}
.back{background:none;border:0;padding:4px 8px 4px 0;color:var(--ink-2);font-size:19px;line-height:1}
.qtop .where{flex:1;font-size:12.5px;color:var(--ink-3)}
.qtop .count{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pbar{height:2px;background:var(--rule-2)}
.pbar i{display:block;height:100%;background:var(--ink);transition:width .4s cubic-bezier(.4,0,.2,1)}

.fade{animation:fade .22s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}

.q{
  font-family:"Noto Serif KR",serif;font-size:19px;font-weight:400;line-height:1.62;
  margin:26px 0 20px;letter-spacing:-.3px;
}
textarea{
  width:100%;min-height:170px;padding:14px;font:inherit;font-size:15.5px;line-height:1.7;
  border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink);resize:vertical;
  transition:border-color .15s;
}
textarea::placeholder,input.fill::placeholder{color:var(--ink-3)}
input.fill{
  width:100%;padding:14px;font:inherit;font-size:18px;font-family:"Noto Serif KR",serif;
  border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink);
  transition:border-color .15s;
}
input.fill:focus{outline:none;border-color:var(--ink)}
.model .alt{font-family:"Noto Sans KR",sans-serif;font-size:12.5px;color:var(--ink-3)}
textarea:focus{outline:none;border-color:var(--ink)}
.actions{margin-top:12px;display:flex;gap:8px}
.btn{
  flex:1;padding:13px;border:1px solid var(--ink);border-radius:8px;
  background:var(--ink);color:#fff;font-size:15px;font-weight:500;
  transition:opacity .15s;
}
.btn:active{opacity:.8}
.btn.line{background:transparent;color:var(--ink-2);border-color:var(--rule);font-weight:400}
.hint{font-size:11.5px;color:var(--ink-3);text-align:center;margin-top:10px}

/* result --------------------------------------------- */
.verdict{display:flex;align-items:baseline;gap:9px;margin:22px 0 4px}
.verdict h2{font-family:"Noto Serif KR",serif;font-size:22px;font-weight:600;margin:0;letter-spacing:-.5px}
.verdict.no h2{color:var(--mark)}
.verdict p{margin:0;font-size:12.5px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:14px 0 0}
.chip{font-size:12px;padding:3.5px 9px;border-radius:13px;border:1px solid var(--rule);color:var(--ink-2)}
.chip.miss{border-color:var(--mark);background:var(--mark-bg);color:var(--mark);font-weight:500}
.sect{font-size:11.5px;color:var(--ink-3);margin:22px 0 6px}
.model{
  font-family:"Noto Serif KR",serif;font-size:15.5px;line-height:1.78;
  border-left:2px solid var(--ink);padding:2px 0 2px 14px;
}
.mine{font-size:14px;color:var(--ink-2);white-space:pre-wrap;padding:2px 0 2px 14px;border-left:2px solid var(--rule)}

/* notebook ------------------------------------------- */
.nb{margin-top:34px}
.nb h3{font-family:"Noto Serif KR",serif;font-size:15px;font-weight:600;margin:0 0 2px}
.nb .cap{font-size:12px;color:var(--ink-3);margin:0 0 8px}
.miss{display:flex;gap:11px;padding:10px 0;border-top:1px solid var(--rule-2);font-size:13.5px;line-height:1.5}
.miss .n{flex:none;font-size:11.5px;color:var(--mark);font-variant-numeric:tabular-nums;padding-top:2px;min-width:26px}
.miss em{display:block;font-style:normal;font-size:11px;color:var(--ink-3)}
.none{font-size:13px;color:var(--ink-3);padding:8px 0}

.foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tinybtn{background:none;border:0;padding:4px 0;font-size:12.5px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
.tinybtn.danger{color:var(--mark)}
select{
  font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--rule);
  border-radius:6px;background:#fff;color:var(--ink-2);
}

/* seal ----------------------------------------------- */
.veil{position:fixed;inset:0;background:rgba(22,25,29,.5);display:grid;place-items:center;padding:26px;z-index:40;animation:fade .2s ease both}
.card{background:var(--bg);border-radius:12px;padding:32px 26px 24px;text-align:center;max-width:320px;width:100%}
.seal{
  width:104px;height:104px;margin:0 auto 18px;border:5px solid var(--mark);border-radius:10px;
  display:grid;place-items:center;color:var(--mark);
  font-family:"Noto Serif KR",serif;font-weight:600;font-size:50px;
  animation:stamp .42s cubic-bezier(.2,1.5,.45,1) both;
}
@keyframes stamp{
  0%{transform:scale(1.7) rotate(-12deg);opacity:0}
  55%{transform:scale(.95) rotate(2deg);opacity:1}
  100%{transform:scale(1) rotate(-2.5deg);opacity:1}
}
.card h3{font-family:"Noto Serif KR",serif;font-size:19px;font-weight:600;margin:0 0 5px}
.card p{font-size:13px;color:var(--ink-3);margin:0 0 20px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const DATA = {"works":[{"id":"bari","name":"바리데기","sub":"서사 무가 · 무속 서사시","story":[{"n":1,"q":"바리데기가 태어나자마자 버려지게 된 원인과 그 과정","a":"불라국의 오구대왕과 길대부인은 슬하에 딸만 여섯을 두고 있었는데, 일곱 번째로 태어난 아이도 딸이었다. 그래서 '버려진 아이'라는 뜻의 바리데기라 불린 아이를 내다 버렸고, 이후 석가세존의 부탁을 받은 어느 노부부가 거두어 길렀다.","k":[["불라국"],["오구대왕","길대부인"],["딸","여섯","일곱"],["버","내다"],["노부부","석가세존"]]},{"n":2,"q":"바리데기가 자신을 버린 부모를 위해 목숨을 건 여정을 결심하게 된 계기","a":"오구대왕과 길대부인이 중병에 걸렸는데 서천 서역국에서만 구할 수 있는 약려수가 특효약이었으나, 여섯 공주 중 아무도 구하러 가겠다고 나서지 않았다. 길대부인이 꿈을 통해 계시를 받고 신하를 보내 바리데기를 찾아오게 했고, 부모와 만난 바리데기는 자청해서 약려수를 구하러 길을 떠난다.","k":[["중병","병"],["약려수","서천","서역국"],["여섯","공주","아무도"],["자청","스스로","자원"]]},{"n":3,"q":"바리데기가 서천서역국으로 가는 길에 겪은 시련과 이를 극복하는 과정","a":"바리데기는 이승과 저승의 경계를 넘는 멀고 험한 길을 홀로 걸으며 온갖 고난을 겪는다. 그동안 신령의 도움을 받았고 중간에 석가세존이 나타나 도와주기도 하여, 우여곡절 끝에 서역국에 도착한다.","k":[["험","멀","고난","시련"],["신령","도움"],["석가세존"],["서역국","도착"]]},{"n":4,"q":"바리데기가 생명수(약려수)를 얻기 위해 무상신선에게 제시받은 조건과 이를 수행한 내용","a":"약려수를 지키던 무상신선은 3년 동안 물을 길어다 줄 것, 3년 동안 불을 때 줄 것, 3년 동안 나무를 베어다 줄 것을 요구한다. 그동안 바리데기는 무상신선과 결혼해 일곱 아들을 낳으며 힘든 노동에 시달린 끝에, 겨우 약려수와 신비한 꽃을 얻어 불라국으로 돌아온다.","k":[["무상신선"],["물"],["불"],["나무"],["3년","삼년","9년"],["일곱","아들","결혼"]]},{"n":5,"q":"약려수를 가지고 돌아온 바리데기가 부모를 다시 살려내는 과정","a":"그동안 오구대왕과 길대부인은 이미 죽어 상여에 실려 나가고 있었다. 마침 도착한 바리데기가 두 사람의 입에 약려수를 흘려 넣자 오구대왕과 길대부인이 되살아난다.","k":[["죽","상여"],["약려수","입"],["되살","살아","살려"]]},{"n":6,"q":"부모를 구한 후 바리데기가 왕의 보상을 사양하고 어떤 존재가 되었는지","a":"바리데기는 부모를 살린 공로를 인정받아 죽은 사람을 저승으로 인도하는 오구신이 된다. 무상신선과 일곱 아들들도 함께 신이 된다.","k":[["공로","인정","보상"],["저승","인도","죽은"],["오구신","신"],["무상신선","일곱","아들"]]},{"n":7,"q":"전체 줄거리를 '출생과 버려짐', '서천서역국 여정과 부모 구원', '신으로의 좌정(결말)' 단계가 모두 포함되도록 3문장으로 서술","a":"불라국의 오구대왕과 길대부인은 일곱 번째로 태어난 딸 바리데기를 내다 버렸다. 훗날 부모가 중병에 걸리자 바리데기는 자청해 서천 서역국으로 떠나 무상신선의 9년 노동과 출산을 견디고 약려수를 얻어 부모를 되살렸다. 그 공로로 바리데기는 죽은 사람을 저승으로 인도하는 오구신이 되었다.","k":[["버","내다"],["서천","서역국","약려수"],["부모","되살","살려"],["오구신","신"]]}],"theory":[{"n":1,"q":"설화란 무엇이며 〈바리데기〉는 그중 어디에 해당하는가","a":"설화는 일정한 구조를 갖추고 입에서 입으로 전해지는 꾸며낸 이야기로, 신화·전설·민담으로 나뉜다. 〈바리데기〉는 굿에서 무당이 구연하는 무속 신화에 해당한다.","k":[["구전","입","전승"],["신화","전설","민담"],["무속","굿","무당"]]},{"n":2,"q":"〈바리데기〉의 갈래, 성격, 주제, 출전","a":"갈래는 서사 무가이자 무속 서사시이고, 성격은 주술적·신화적·서사적·무속적·교훈적이다. 주제는 바리데기가 겪는 고난과 소원 성취의 과정이며, 출전은 경상북도 영일 지방의 무가다(김복순 구술, 최정여·서대석 채록).","k":[["서사","무가","무속"],["주술","신화","교훈"],["고난","소원","성취"],["영일","경상북도"]]},{"n":3,"q":"인물 설명 — 오구대왕, 길대부인, 석가세존, 바리데기, 무상신선","a":"오구대왕과 길대부인은 불라국의 임금과 왕비로, 일곱 번째 딸인 바리데기를 버린다. 석가세존은 초월적인 능력을 지닌 존재로 바리데기를 도와주는 조력자이고, 바리데기는 태어나자마자 버림받았으나 부모를 위해 약려수를 구하러 길을 떠난다. 무상신선은 바리데기에게 9년간의 노동과 출산을 요구한 뒤 약려수를 준다.","k":[["오구대왕","길대부인","임금","왕비"],["석가세존","초월","조력"],["바리데기","버림","부모"],["무상신선","노동","출산","약려수"]]},{"n":4,"q":"〈바리데기〉에 나타난 서사 구조의 특징","a":"영웅의 일대기 구조를 따르면서 '결핍 - 시련 - 성취'로 이어지는 순환 구조를 보인다. 버림받음과 구원, 죽음과 재생이 대립적으로 짝을 이루고 유사한 사건과 표현이 반복되어, 굿판에서 구연하기에 알맞게 짜여 있다.","k":[["영웅","일대기"],["시련","성취","결핍"],["반복","대립","순환"],["죽음","재생","구원"]]},{"n":5,"q":"무가의 특징","a":"굿판에서 무당이 신을 향해 구연하는 노래로 신성성과 주술성을 지닌다. 구비 전승되어 지역과 구연자마다 판본이 다르고, 율문체와 반복적 표현이 두드러지며 오락성과 문학성도 함께 지닌다.","k":[["굿","무당","구연"],["신성","주술"],["구비","전승","판본"],["율문","반복","오락"]]},{"n":6,"q":"〈바리데기〉에 나타난 영웅의 일대기 구조","a":"불라국 왕의 딸이라는 고귀한 혈통으로 태어나지만, 딸이라는 이유로 어려서 버려지는 위기를 맞는다. 노부부라는 조력자에게 구출·양육된 뒤 서천 서역국 여정이라는 시련을 겪고, 이를 극복해 오구신이라는 신적 존재로 좌정한다.","k":[["고귀","혈통","왕"],["버려","위기"],["조력","구출","양육","노부부"],["시련","극복"],["오구신","신","좌정"]]},{"n":7,"q":"〈바리데기〉의 노동과 출산의 의미","a":"9년의 노동과 일곱 아들의 출산은 당시 여성이 감당하던 삶 자체를 압축해 보여 준다. 이 고된 일상이 약려수를 얻는 조건이 됨으로써, 평범한 여성의 노동과 출산이 신성한 가치로 격상된다.","k":[["9년","노동","일"],["출산","아들","일곱"],["여성","삶"],["신성","가치","약려수"]]},{"n":8,"q":"〈바리데기〉의 희생에 담긴 의미","a":"가장 버림받은 존재가 오히려 자신을 버린 부모를 구원한다는 역설이 담겨 있다. 이 희생은 단순한 효를 넘어 스스로 신성을 얻는 과정이며, 죽음을 넘어 생명을 회복시키는 힘으로 그려진다.","k":[["버림","역설"],["구원","살"],["효"],["신성","신","생명"]]},{"n":9,"q":"〈바리데기〉의 문학적 성취","a":"우리 무속 신화를 대표하는 작품으로, 여성을 주체적인 영웅으로 내세운 드문 서사다. 죽음과 재생이라는 원형적 주제를 갖추고 구비 서사시로서 완결된 구조와 풍부한 표현을 지녀 후대 문학과 예술에 널리 활용된다.","k":[["무속","신화","대표"],["여성","영웅","주체"],["죽음","재생","원형"],["구비","서사","구조"]]}],"blank":[{"n":1,"q":"갈래 — ( ), 무속 서사시","a":"서사 무가","alt":["서사무가","무가"]},{"n":2,"q":"성격 — 주술적, 신화적, 서사적, ( )적, 교훈적","a":"무속","alt":["무속적"]},{"n":3,"q":"주제 — 바리데기가 겪는 ( )과 소원 성취의 과정","a":"고난","alt":[]},{"n":4,"q":"출전 — 경상북도 ( ) 지방의 무가","a":"영일","alt":[]},{"n":5,"q":"바리데기의 부모가 다스리는 나라 이름은 ( )이다","a":"불라국","alt":[]},{"n":6,"q":"부모의 병을 고칠 수 있는 서천 서역국의 특효약은 ( )이다","a":"약려수","alt":[]},{"n":7,"q":"바리데기를 도와주는 초월적 조력자는 ( )이다","a":"석가세존","alt":["부처","석가"]},{"n":8,"q":"약려수를 지키며 9년간의 노동과 출산을 요구한 인물은 ( )이다","a":"무상신선","alt":["무장승","무장신선"]},{"n":9,"q":"바리데기는 죽은 사람을 저승으로 인도하는 ( )이 된다","a":"오구신","alt":["무조신"]},{"n":10,"q":"무상신선이 요구한 세 가지 — 3년 동안 ( )을 길어다 줄 것, 3년 동안 불을 때 줄 것, 3년 동안 나무를 베어다 줄 것","a":"물","alt":[]},{"n":11,"q":"'바리데기'라는 이름은 ( ) 아이라는 뜻이다","a":"버려진","alt":["버린"]}]},{"id":"guk","name":"국선생전","sub":"이규보 · 가전체","story":[{"n":1,"q":"주인공 '국성(술)'의 가계적 배경과 성품, 그리고 조정에 등용되는 계기","a":"국성의 먼 조상은 원래 온이라는 곳에서 농사를 지으며 살았고, 할아버지 모가 처음으로 주천에 이사 와 살기 시작했다. 아버지 차는 집안사람 가운데 처음으로 벼슬을 하고 사농경 곡씨와 혼인해 국성을 낳았으며, 국성은 어릴 때부터 도량이 넓고 침착해 도잠·유영 등과 사귀며 임금의 총애를 받게 된다.","k":[["온"],["모","할아버지","주천"],["차","아버지","벼슬"],["곡씨","사농경"],["도량","넓","도잠","유영"]]},{"n":2,"q":"국성이 조정에 들어가 임금의 총애를 받으며 행한 역할과 그로 인해 조정에 일어난 변화","a":"국성은 넓은 도량과 뛰어난 재주로 임금의 심복이 되어 정사에 참여하며 큰 공을 세운다. 그러나 임금의 사랑이 극에 달하면서 나라가 어지러워지고, 국성의 세 아들까지 방자한 행태를 보이게 된다.","k":[["심복","정사","공"],["총애","사랑","극"],["어지러","나라"],["세 아들","방자","오만"]]},{"n":3,"q":"국성의 자식들이 일으킨 문제와 이로 인해 국성이 겪게 되는 시련","a":"세 아들이 아버지의 힘을 믿고 오만방자하게 굴어 사방에서 그들을 비방하는 소리가 높아진다. 결국 아들들은 모영의 탄핵을 받아 자결하고, 국성도 벼슬에서 쫓겨난다.","k":[["세 아들","아들"],["오만","방자","비방"],["모영","탄핵"],["자결"],["벼슬","쫓겨","파직"]]},{"n":4,"q":"국성이 관직에서 물러난 후 국가에 찾아온 위기와 임금이 다시 국성을 찾게 된 이유","a":"국성이 벼슬에서 쫓겨난 무렵 도둑 떼가 기승을 부려 나라가 어지러워진다. 이를 다스릴 사람이 마땅치 않자 국성이 조정에 다시 기용된다.","k":[["도둑","도적","기승"],["어지러","나라"],["다시","기용","등용"]]},{"n":5,"q":"다시 등용된 국성이 국가의 위기를 극복하는 과정과 그 공로","a":"다시 조정에 나온 국성은 도둑들을 토벌하는 데 앞장선다. 그 공로를 인정받아 높은 벼슬을 얻는다.","k":[["도둑","도적","토벌"],["공","공로"],["높은","벼슬"]]},{"n":6,"q":"공을 세운 국성이 권력에 연연하지 않고 관직에서 물러나는 과정과 그 의미","a":"국성은 임금의 만류에도 불구하고 스스로 물러나 고향으로 돌아간 뒤 조용히 살다가 죽는다. 이는 나아갈 때와 물러날 때를 스스로 아는 군자의 바람직한 처신을 보여 준다.","k":[["만류","스스로","물러"],["고향","돌아"],["처신","군자","분수","순리"]]},{"n":7,"q":"작품 마지막에 제시된 사신(사관)의 평가를 바탕으로, 작가가 국성이라는 인물을 통해 전달하고자 한 주제","a":"사관은 국성이 스스로 물러난 뒤 천수를 다하고 죽었으니 순리를 잘 알고 현명하게 처신했다고 평가한다. 작가는 술을 의인화한 국성을 통해 위국충절과, 군자가 지녀야 할 처신을 경계하고자 했다.","k":[["사관","사신","평가"],["천수","순리","현명"],["스스로","물러"],["위국충절","군자","처신","경계"]]}],"theory":[{"n":1,"q":"가전체란 무엇인가","a":"사물이나 동식물을 사람처럼 의인화해 그 일생을 전기 형식으로 기록한 갈래다. 가계 - 행적 - 사관의 논평 순서로 서술하며, 사물에 빗대어 교훈을 주려는 목적이 크다.","k":[["의인","사람처럼"],["일생","전기"],["가계","행적","논평","사관"],["교훈","경계"]]},{"n":2,"q":"〈국선생전〉의 작가, 갈래, 성격, 주제, 연대, 출전","a":"이규보가 지은 가전체로 연대는 고려 중엽이며, 『서하선생집』과 『동문선』에 실려 전한다. 성격은 교훈적·전기적·우의적이고, 주제는 위국충절 및 군자의 처신을 경계하는 것이다.","k":[["이규보"],["가전체","가전"],["고려","중엽"],["교훈","전기","우의"],["위국충절","군자","처신"],["동문선","서하선생집"]]},{"n":3,"q":"국성의 가계 — 술이 만들어지는 과정","a":"할아버지 모(보리)와 아버지 차(흰 술), 어머니 곡씨(곡식)라는 계보는 보리와 곡식으로 술을 빚는 과정을 그대로 옮긴 것이다. 조상이 살던 온과 이사 온 주천이라는 지명 역시 술을 데우고 빚는 일과 이어진다.","k":[["모","보리"],["차","흰 술","흰술"],["곡씨","곡식"],["빚","만들","술"],["주천","온"]]},{"n":4,"q":"임금이 국성을 '국선생'으로 예우한 까닭","a":"국성이 넓은 도량과 뛰어난 재주로 임금의 심복이 되어 정사에 참여하고 임금의 마음을 편하게 해 주었기 때문이다. 그릇이 크고 침착한 인물로 여겼기에 이름 대신 '선생'이라 높여 부르며 스승 대하듯 예우했다.","k":[["도량","재주","그릇"],["심복","정사","마음"],["선생","높여","예우","존경"]]},{"n":5,"q":"가전이 등장한 당시의 시대상","a":"고려 중엽 무신정변 이후 새로 등장한 신흥 사대부들이 문학의 주역이 된 시기다. 이들은 사물의 이치를 따지고 현실을 비판적으로 바라보았으며, 세상을 경계하고 사람을 바로잡으려는 의식이 가전 창작으로 이어졌다.","k":[["고려","무신","중엽"],["사대부","신흥"],["이치","비판","현실"],["경계","교훈","계세징인"]]},{"n":6,"q":"〈국선생전〉에 나타난 교술적 요소","a":"인물의 행적을 서술한 뒤 사관의 논평을 덧붙여 교훈을 직접 드러낸다. 사물을 의인화해 그 속성을 설명하는 부분도 지식 전달에 가까워, 서사이면서 동시에 가르침을 전하는 교술적 성격을 지닌다.","k":[["사관","사신","논평"],["교훈","가르침","직접"],["의인","속성","설명"]]},{"n":7,"q":"가전과 소설의 공통점과 차이점","a":"공통점은 둘 다 꾸며낸 인물과 사건을 갖춘 허구적 서사라는 점이다. 차이점은 가전이 사물을 의인화해 가계 - 행적 - 논평이라는 고정된 형식으로 교훈을 전하는 데 비해, 소설은 형식이 자유롭고 인물의 성격과 내면 갈등을 훨씬 풍부하게 그린다는 것이다.","k":[["허구","꾸며","서사"],["의인","사물"],["형식","가계","논평","고정"],["갈등","내면","성격","자유"]]}],"blank":[{"n":1,"q":"작가 — ( )","a":"이규보","alt":[]},{"n":2,"q":"갈래 — ( )","a":"가전체","alt":["가전"]},{"n":3,"q":"성격 — 교훈적, ( )적, 우의적","a":"전기","alt":["전기적"]},{"n":4,"q":"주제 — ( ) 및 군자의 처신을 경계","a":"위국충절","alt":["위국 충절"]},{"n":5,"q":"연대 — 고려 ( )","a":"중엽","alt":["중기"]},{"n":6,"q":"출전 — 『서하선생집』, 『( )』","a":"동문선","alt":[]},{"n":7,"q":"국성의 할아버지 ( )는 보리를, 아버지 차는 흰 술을 뜻한다","a":"모","alt":[]},{"n":8,"q":"국성의 어머니는 사농경 ( )의 딸로, 곡식을 뜻한다","a":"곡씨","alt":["곡"]},{"n":9,"q":"국성의 할아버지가 처음 이사 와 산 곳은 ( )이다","a":"주천","alt":[]},{"n":10,"q":"국성의 세 아들을 탄핵해 자결하게 만든 인물은 ( )이다","a":"모영","alt":[]},{"n":11,"q":"작품 마지막에서 국성의 삶을 평가하는 사람은 ( )이다","a":"사관","alt":["사신"]},{"n":12,"q":"이규보의 호는 ( )이고, 저서로 『동국이상국집』이 있다","a":"백운거사","alt":["백운"]}]},{"id":"lee","name":"이생규장전","sub":"김시습 · 명혼 소설","story":[{"n":1,"q":"이생과 최랑(최 처녀)이 서로 사랑에 빠지게 된 계기와 그 과정","a":"송도에 사는 이생은 국학에 다니다가 담장 너머로 지체 높은 가문의 딸 최랑을 우연히 보고 사랑에 빠진다. 이후 이생은 밤마다 그 집 담을 넘어 다니며 최랑과 사랑을 나눈다.","k":[["송도","국학"],["담","담장"],["최랑"],["밤","넘","사랑"]]},{"n":2,"q":"이생과 최랑의 만남이 발각된 후 두 사람이 겪은 위기와 이를 극복한 과정","a":"이생의 행실을 눈치챈 부모가 이생을 울주로 보내 버리자, 최랑은 상사병 때문에 죽을 지경에 이른다. 최랑의 부모가 중매쟁이를 보내 청혼하고, 이생의 장래를 걱정해 처음에는 거절하던 이생의 부모도 최씨 집의 간절한 청에 결국 승낙한다.","k":[["부모","눈치"],["울주","보내"],["상사병"],["중매","청혼","승낙","허락"]]},{"n":3,"q":"부모의 반대를 극복한 이생과 최랑의 혼인 과정과 혼인 이후의 삶","a":"두 집안의 승낙을 받은 이생과 최랑은 마침내 결혼한다. 다음 해 이생이 과거에 급제해 출세하면서 둘의 행복은 절정에 달한다.","k":[["결혼","혼인"],["과거","급제"],["출세","행복","절정"]]},{"n":4,"q":"행복했던 이생과 최랑에게 찾아온 두 번째 시련인 '홍건적의 난'과 최랑의 비극적 죽음","a":"홍건적의 난이 일어나자 이생과 최랑 모두 가족들과 뿔뿔이 흩어진다. 최랑은 홍건적 무리에게 겁탈을 당하지 않으려고 저항하다 처참하게 죽는다.","k":[["홍건적"],["가족","흩어","뿔뿔이"],["저항","절개"],["죽","처참"]]},{"n":5,"q":"아내를 잃고 슬퍼하던 이생에게 일어난 기이한 일과 두 사람의 재회 과정","a":"난이 수습된 뒤 집으로 돌아온 이생이 슬픔에 잠겨 있는데, 그날 밤 죽은 최랑이 환신해 돌아온다. 두 사람은 난리 통에 겪은 일을 이야기하며 사랑을 확인하고, 부모님의 유골을 거두어 예를 다해 장사를 지낸 뒤 행복한 나날을 보낸다.","k":[["환신","혼령","죽은"],["돌아","나타"],["유골","장사","거두"],["행복","함께"]]},{"n":6,"q":"환귀한 최랑과 이생이 결국 다시 이별하게 된 이유와 이별의 과정","a":"3년이 지난 어느 날, 최랑은 이승에서의 시간이 다 되었음을 알린다. 최랑은 이생의 곁을 영원히 떠나고, 이생은 유언대로 최랑의 시체를 찾아 장사를 지낸다.","k":[["3년","삼년"],["이승","시간","때"],["영원","떠"],["시체","유언","장사"]]},{"n":7,"q":"최랑이 떠난 후 이생의 삶과 이 작품이 전달하고자 하는 핵심 주제","a":"이생은 최랑이 떠난 뒤 얼마 살지 못하고 병들어 죽는다. 이 작품은 죽음마저 갈라놓지 못한 남녀의 사랑을 통해 죽음을 초월한 사랑의 가치를 보여 준다.","k":[["병","얼마","살지"],["죽"],["죽음","초월","넘"],["사랑"]]}],"theory":[{"n":1,"q":"전기소설이란 무엇인가","a":"현실에서 일어나기 어려운 기이하고 신비로운 사건을 다루는 소설 갈래다. 귀신·환신·초현실적 공간이 등장하며, 우리 문학에서는 김시습의 『금오신화』가 그 출발점으로 꼽힌다.","k":[["기이","신비","비현실","초현실"],["귀신","혼령","환신"],["금오신화"]]},{"n":2,"q":"〈이생규장전〉의 작가, 갈래, 성격, 배경, 주제, 연대, 출전","a":"김시습이 지은 한문 소설이자 명혼 소설, 단편 소설이다. 성격은 전기적·환상적·낭만적·비극적이며, 배경은 고려 공민왕 때의 송도(개성)이고 주제는 죽음을 초월한 남녀 간의 사랑이다. 연대는 조선 세조 때이고 출전은 『금오신화』다.","k":[["김시습"],["한문","명혼","단편"],["전기","환상","낭만","비극"],["공민왕","송도","개성"],["세조"],["금오신화"]]},{"n":3,"q":"작품 속 '시'의 역할","a":"인물의 마음을 대신 전하는 매개이자 두 사람을 이어 주는 사랑의 통로다. 산문 서술이 다 담지 못한 정서를 압축해 드러내고 낭만적 분위기를 높이며, 사건이 다음 단계로 넘어가게 하는 구실도 한다.","k":[["마음","정서","심리"],["매개","이어","전달"],["낭만","분위기"],["사건","전개"]]},{"n":4,"q":"세 번의 가약(만남)의 의미","a":"담을 넘어 몰래 맺은 첫 만남, 부모의 반대를 넘어 이룬 혼인, 죽은 뒤 환신으로 이룬 재회로 이어진다. 만남과 이별이 반복되며 장애가 점점 커지는데 그때마다 사랑을 지켜냄으로써, 두 사람의 사랑이 세속의 제약을 넘어 죽음까지 초월하는 것으로 심화된다.","k":[["담","몰래","처음"],["혼인","부모","반대"],["환신","죽은","재회"],["초월","심화","장애","극복"]]},{"n":5,"q":"최랑을 통해 작가가 말하려는 의미","a":"최랑은 먼저 시를 보내고 죽음 앞에서도 절개를 지키는 적극적이고 주체적인 여성이다. 봉건적 규범에 눌리지 않고 스스로 사랑을 선택하는 인물을 내세워, 작가는 인간의 자연스러운 감정과 의지를 긍정한다.","k":[["적극","주체","능동"],["절개","지키"],["봉건","규범","제약"],["감정","의지","긍정","사랑"]]},{"n":6,"q":"김시습의 두 작품(만복사저포기·이생규장전)의 공통점","a":"산 사람과 죽은 여인이 사랑을 나누는 명혼 구조를 공유하고, 전기적·비현실적 요소가 두드러진다. 두 작품 모두 여인이 떠난 뒤 남주인공이 세상에 뜻을 두지 않고 사라지거나 죽는 비극으로 끝나는데, 여기에는 현실에 좌절한 작가 자신의 처지가 투영되어 있다.","k":[["죽은","혼령","명혼"],["전기","비현실","기이"],["비극","죽","떠"],["작가","현실","좌절","김시습"]]}],"blank":[{"n":1,"q":"작가 — ( )","a":"김시습","alt":[]},{"n":2,"q":"갈래 — 한문 소설, ( ) 소설, 단편 소설","a":"명혼","alt":[]},{"n":3,"q":"( )은 죽은 남녀를 함께 묻어 인연을 맺게 하는 것을 뜻한다","a":"명혼","alt":[]},{"n":4,"q":"성격 — ( )적, 환상적, 낭만적, 비극적","a":"전기","alt":["전기적"]},{"n":5,"q":"배경 — 시간: 고려 ( ) 때 / 공간: 송도(개성)","a":"공민왕","alt":[]},{"n":6,"q":"주제 — ( )을 초월한 남녀 간의 사랑","a":"죽음","alt":[]},{"n":7,"q":"연대 — 조선 ( ) 때","a":"세조","alt":[]},{"n":8,"q":"출전 — 『( )』","a":"금오신화","alt":[]},{"n":9,"q":"이생의 부모가 이생을 보내 버린 곳은 ( )이다","a":"울주","alt":[]},{"n":10,"q":"최랑이 죽게 된 사건은 ( )의 난이다","a":"홍건적","alt":[]},{"n":11,"q":"죽은 최랑이 환신해 이생 곁에 머문 기간은 ( )이다","a":"3년","alt":["삼년"]}]},{"id":"hojil","name":"호질","sub":"박지원 · 우화 소설","story":[{"n":1,"q":"작품 도입부에서 호랑이가 어떤 존재로 묘사되며, 먹잇감을 정하기 위해 유자(선비)를 고르는 과정","a":"호랑이는 문무와 지혜, 용맹을 갖춘 위엄 있는 존재로 그려진다. 해가 저물자 호랑이는 자기 몸에 붙은 귀신들과 저녁거리를 무엇으로 할지 의논하는데, 여러 의견을 듣고 난 뒤 선비를 잡아먹기로 결심하고 마을로 내려온다.","k":[["문무","지혜","용맹","위엄"],["귀신","창귀"],["저녁","의논"],["선비","유자","결심"]]},{"n":2,"q":"북곽선생과 동리자가 표면적으로 드러내는 평판과 실제 모습의 가식성","a":"북곽 선생은 학식이 풍부해 사람들에게 존경받는 선비이고, 동리자는 열녀로 소문이 자자한 과부다. 그러나 두 사람은 남몰래 밀회를 즐기고 있었고 동리자에게는 성이 다른 아들이 다섯 명이나 있었으니, 겉으로 드러난 평판과 실제가 완전히 달랐다.","k":[["북곽","학식","존경","선비"],["동리자","열녀","과부"],["아들","다섯","성이 다른"],["밀회","몰래","위선","가식"]]},{"n":3,"q":"동리자의 방에 있던 북곽선생이 아들들에게 들통나 도망치는 과정과 그 해학적 상황","a":"동리자의 다섯 아들은 방 안에서 흘러나오는 북곽 선생의 목소리를 듣고 여우가 둔갑했다고 판단해 다 같이 방으로 쳐들어간다. 당황한 북곽 선생은 도망치다가 똥구덩이에 빠지는데, 존경받던 선비의 추한 몰골이 웃음을 자아낸다.","k":[["여우","둔갑"],["다섯","아들","쳐들어"],["도망","달아"],["똥구덩이","똥"]]},{"n":4,"q":"호랑이가 똥통에 빠진 북곽선생을 보고 지적하며 꾸짖는 '유자(선비)'의 위선적 실체","a":"똥구덩이에서 겨우 빠져나온 북곽 선생은 입을 벌리고 있는 커다란 호랑이와 마주친다. 호랑이는 겉으로만 도덕을 내세우는 북곽 선생의 위선적인 행동을 엄하게 꾸짖는다.","k":[["똥구덩이","빠져나"],["호랑이","마주"],["위선","가식"],["꾸짖","엄하게","설교"]]},{"n":5,"q":"호랑이가 자신의 생태적 특성과 인간의 행태를 비교하며 인간의 탐욕을 비판한 내용","a":"호랑이는 자신은 굶주릴 때만 사냥하고 초목을 해치지 않는다고 말한다. 반면 인간은 인의를 말하면서도 서로 속이고 잡아먹으며, 그물·함정·창칼 같은 도구를 만들어 남을 해치니 짐승보다 못하다고 꾸짖는다.","k":[["굶주","배고","초목","사냥"],["인의","도덕","말"],["그물","함정","창","도구"],["서로","잡아먹","해치","탐욕"]]},{"n":6,"q":"호랑이의 질책을 들은 북곽선생이 자신의 목숨을 구하기 위해 보여준 비굴한 행동","a":"북곽 선생은 땅에 머리를 조아리고 엎드려 목숨을 구걸한다. 성현의 말씀까지 끌어다 호랑이를 높이며 아첨하는데, 존경받던 선비의 체면이 완전히 무너진 모습이다.","k":[["머리","조아","엎드"],["목숨","구걸","살려"],["아첨","성현","비굴"]]},{"n":7,"q":"날이 새자 호랑이가 사라진 후 농부와 만난 북곽선생의 변명과 이 작품이 전달하려는 핵심 주제","a":"날이 밝자 호랑이는 사라지고, 밭에 김매러 가던 농부가 땅바닥에 머리를 조아린 북곽 선생에게 연유를 묻는다. 북곽 선생은 그제야 성현의 말씀을 들먹이며 허세를 부리는데, 이 작품은 양반 계급의 허위적이고 이중적인 도덕관을 비판한다.","k":[["농부","김매"],["성현","말씀","들먹"],["허세","변명"],["양반","허위","이중","도덕관"]]}],"theory":[{"n":1,"q":"우화소설이란 무엇인가","a":"동식물이나 사물을 사람처럼 등장시켜 인간 사회를 빗대어 비판하는 소설이다. 직접 말하기 어려운 내용을 간접적으로 드러내 풍자 효과를 높이고 교훈을 준다.","k":[["동물","사물","의인"],["빗대","간접","우의"],["풍자","비판","교훈"]]},{"n":2,"q":"〈호질〉의 작가, 갈래, 배경, 성격, 주제, 연대, 출전","a":"박지원이 지은 한문 소설이자 풍자 소설, 단편 소설, 우화 소설이다. 배경은 해 질 무렵부터 이튿날 아침까지의 정나라 어느 고을이고, 성격은 우화적·우의적·풍자적·현실 비판적이다. 주제는 양반 계급의 허위적이고 이중적인 도덕관에 대한 비판이며, 18세기 후반 작품으로 『열하일기』의 「관내정사」에 실려 있다.","k":[["박지원"],["한문","풍자","우화","단편"],["정나라","해 질","이튿날"],["우의","현실"],["양반","허위","이중","도덕관"],["열하일기","관내정사"]]},{"n":3,"q":"인물 설명 — 북곽선생, 호랑이","a":"북곽 선생은 사람들에게 존경받는 선비이지만 뒤에서는 위선적인 행동을 하는 인물이다. 호랑이는 인간들의 위선을 참다못한 나머지 엄하게 꾸짖는 존재로, 작가의 비판 의식을 대변한다.","k":[["북곽","존경","선비","위선"],["호랑이","꾸짖","엄하게"],["작가","대변","비판"]]},{"n":4,"q":"다른 우화와의 차이점","a":"보통의 우화가 동물을 통해 일반적인 교훈을 주는 데 그친다면, 〈호질〉은 양반·유학자라는 특정 계층을 겨냥해 당대 현실을 구체적으로 비판한다. 결말에서도 교훈으로 정리해 주지 않고 북곽 선생의 허세로 끝맺어 독자가 스스로 판단하게 한다.","k":[["교훈","일반","단순"],["양반","유학자","계층","현실"],["구체","비판","풍자"],["결말","허세","독자","판단"]]},{"n":5,"q":"북곽선생과 농부의 비교","a":"북곽 선생은 학식과 명성을 갖췄으나 겉과 속이 다른 위선적 지식인이다. 반면 이른 아침 밭에 김매러 나온 농부는 소박하고 정직한 서민으로, 그의 순박한 질문이 북곽 선생의 허세를 이끌어 내어 위선을 한 번 더 드러낸다.","k":[["북곽","위선","지식인","겉"],["농부","소박","정직","서민"],["질문","허세","드러"]]},{"n":6,"q":"작가가 호랑이를 통해 현실을 풍자한 이유","a":"사람이 직접 양반을 꾸짖으면 신분 질서상 설득력도 없고 위험도 크다. 인간 밖의 존재이면서 위엄을 갖춘 호랑이를 내세워야 인간 전체를 객관적으로 내려다보며 비판할 수 있고, 짐승만도 못하다는 대비가 선명해져 풍자의 힘이 커진다.","k":[["신분","직접","위험"],["객관","밖","위엄"],["짐승","대비","못하"],["풍자","효과","비판"]]},{"n":7,"q":"박지원 소설의 공통점","a":"대부분 한문 단편으로 이용후생의 실학사상을 바탕에 두고 있으며, 무능하고 위선적인 양반 계층을 풍자한다. 인물을 생생하고 사실적으로 그리며 해학을 곁들이고, 결말을 딱 떨어지게 맺지 않아 독자에게 여운과 판단을 남긴다.","k":[["한문","단편"],["실학","이용후생","현실"],["양반","풍자","비판"],["해학","사실","여운"]]}],"blank":[{"n":1,"q":"작가 — ( )","a":"박지원","alt":[]},{"n":2,"q":"갈래 — 한문 소설, 풍자 소설, 단편 소설, ( ) 소설","a":"우화","alt":[]},{"n":3,"q":"배경 — 시간: 해 질 무렵부터 이튿날 아침 / 공간: ( ) 어느 고을","a":"정나라","alt":["정"]},{"n":4,"q":"성격 — 우화적, 우의적, 풍자적, ( ) 비판적","a":"현실","alt":[]},{"n":5,"q":"주제 — ( ) 계급의 허위적이고 이중적인 도덕관에 대한 비판","a":"양반","alt":[]},{"n":6,"q":"연대 — ( )세기 후반","a":"18","alt":["18세기"]},{"n":7,"q":"출전 — 『열하일기』 「( )」","a":"관내정사","alt":[]},{"n":8,"q":"열녀로 소문이 자자했지만 성이 다른 아들 다섯을 둔 과부는 ( )이다","a":"동리자","alt":[]},{"n":9,"q":"학식이 풍부해 존경받지만 위선적인 선비는 ( )이다","a":"북곽 선생","alt":["북곽선생","북곽"]},{"n":10,"q":"호랑이 몸에 붙어 저녁거리를 함께 의논하는 존재는 ( )이다","a":"귀신","alt":["귀신들","창귀"]},{"n":11,"q":"도망치던 북곽 선생이 빠진 곳은 ( )이다","a":"똥구덩이","alt":["똥통"]}]},{"id":"chun","name":"이춘풍전","sub":"작자 미상 · 판소리계 소설","story":[{"n":1,"q":"작품 초반에 등장하는 이춘풍의 성격적 결함과 이로 인해 집안에 닥친 위기","a":"부잣집 외동아들로 태어난 춘풍은 인물과 재주가 뛰어났으나, 부모님이 돌아가시자 주색잡기에 미쳐 가산을 탕진한다. 이에 춘풍은 부인에게 집안 살림을 맡기고, 다시는 주색잡기에 빠지지 않겠다는 증서를 써 준 뒤 집안을 일으키길 바란다.","k":[["부잣집","외동아들"],["주색잡기","방탕"],["가산","탕진"],["증서","살림","맡"]]},{"n":2,"q":"춘풍이 가산을 탕진한 후 아내 김 씨가 집안을 다시 일으켜 세운 과정","a":"부인은 남편 대신 집안 살림을 맡아 길쌈을 하며 억척스럽게 돈을 모은다. 그 덕에 살림이 다시 넉넉해진다.","k":[["부인","살림"],["길쌈","일","삯"],["돈","모","넉넉"]]},{"n":3,"q":"집안이 다시 풍족해진 후 춘풍이 호조의 돈을 빌려 평양으로 떠나게 된 계기와 목적","a":"부인이 길쌈을 해 살림이 넉넉해지자 춘풍은 그 가산을 빼앗고 호조 돈까지 빌린다. 그리고 장사를 하겠다며 평양으로 떠난다.","k":[["가산","빼앗"],["호조","돈","빌"],["장사"],["평양"]]},{"n":4,"q":"평양에 도착한 춘풍이 추월에게 속아 재산을 탕진하고 비참하게 전락한 과정","a":"평양에 간 춘풍은 기생 추월에게 홀려 전 재산을 1년 만에 다 날린다. 결국 빈털터리가 되어 추월의 심부름꾼으로 전락한다.","k":[["추월","기생"],["홀","속","1년"],["재산","날","탕진"],["심부름꾼","하인","전락"]]},{"n":5,"q":"남편의 비참한 소식을 들은 김 씨가 춘풍을 구하고 추월을 응징하기 위해 취한 기발한 계책","a":"소식을 들은 부인은 뒷집 참판 댁 자제가 평양 감사로 내정된 것을 알고 참판 부인에게 잘 보여 인심을 얻는다. 참판 댁 자제가 부임하러 가는 날, 부인은 남장을 하고 회계 비장 직을 얻어 내 평양으로 함께 떠난다.","k":[["참판","평양 감사","자제"],["인심","잘 보여"],["남장"],["회계 비장","비장"]]},{"n":6,"q":"남장 비장으로 분한 김 씨가 평양 관아에서 추월과 춘풍을 불러 심문하고 사건을 해결하는 과정","a":"추월이 비장을 유혹하려 하지만 실패한다. 비장은 평양 감사와 함께 춘풍을 잡아낸 뒤 호조 돈을 탕진한 죄로 곤장을 치고, 추월도 잡아들여 이자까지 받아 내 그 돈을 춘풍에게 돌려준 다음 서울로 가라고 명령한다.","k":[["추월","유혹","실패"],["평양 감사","관아","잡아"],["곤장","호조","죄"],["이자","돈","돌려"]]},{"n":7,"q":"서울로 돌아온 후 춘풍이 보여준 허세와, 김 씨가 정체를 밝히며 극이 마무리되는 과정","a":"서울로 돌아온 춘풍은 직접 장사를 해 돈을 번 것처럼 자랑하며 부인을 구박하고, 다시 평양으로 가려 한다. 그러자 부인은 비장 차림으로 다시 나타나 허드렛일을 시키며 골려 주다가 옷을 벗어 정체를 드러내고, 그제야 깨달은 춘풍은 잘못을 깊이 뉘우쳐 개과천선한 뒤 호조 돈을 모두 갚고 부인과 화목하게 산다.","k":[["자랑","허세","구박"],["비장","차림","다시"],["옷","정체","깨달"],["개과천선","뉘우"],["호조","갚","화목"]]}],"theory":[{"n":1,"q":"〈이춘풍전〉의 작가, 갈래, 성격, 배경, 주제","a":"작가는 미상이며 갈래는 판소리계 소설이자 풍자 소설, 세태 소설이다. 성격은 풍자적·해학적·교훈적이고, 배경은 숙종 즉위 초의 서울과 평양이다. 주제는 무능력한 가장에 대한 비판과 진취적인 여성의 활약이다.","k":[["미상","작자"],["판소리","풍자","세태"],["해학","교훈"],["숙종","서울","평양"],["무능력","가장","여성","활약"]]},{"n":2,"q":"인물 설명 — 춘풍, 부인, 추월","a":"춘풍은 방탕하게 사느라 가산을 탕진했고 허세를 잘 부리며 유혹에 약한 인물이다. 부인은 성품이 훌륭하고 행동력이 뛰어나며 남편 춘풍을 깨우쳐 집안을 일으키고, 추월은 평양의 기생으로 춘풍을 유혹해 재산을 가로챈다.","k":[["춘풍","방탕","허세","유혹"],["부인","성품","행동력","깨우"],["추월","기생","가로채"]]},{"n":3,"q":"편집자적 논평이란 무엇인가","a":"서술자가 사건 진행 도중 끼어들어 인물의 행동을 평가하거나 독자에게 말을 건네는 서술 방식이다. 판소리계 소설의 대표적 특징으로, 춘풍의 어리석음을 서술자가 직접 나무라며 웃음과 교훈을 동시에 준다.","k":[["서술자","끼어","개입"],["평가","논평"],["판소리","특징"],["교훈","웃음"]]},{"n":4,"q":"〈이춘풍전〉 창작 무렵 사회의 모습","a":"조선 후기에는 상업이 발달해 돈이 신분보다 중요해지고, 몰락한 양반과 부유한 상인·기생이 함께 등장했다. 여성의 경제적 역할이 커지면서 무능한 남성과 유능한 여성이라는 구도가 가능해졌고, 이런 변화가 작품에 그대로 담겼다.","k":[["상업","화폐","돈","경제"],["신분","몰락","양반"],["여성","역할","지위"],["조선 후기","변화"]]},{"n":5,"q":"춘풍 부인이 보여 주는 의의","a":"남편에게 기대지 않고 길쌈으로 스스로 살림을 일으키며, 남장을 해 회계 비장이 되어 문제를 직접 해결한다. 남성 중심 질서 안에서 여성이 주체적으로 능력을 발휘하는 진취적인 모습을 보여 준다.","k":[["길쌈","스스로","살림"],["남장","비장","해결"],["여성","주체","능력"],["진취","의의"]]},{"n":6,"q":"〈이춘풍전〉이 판소리계 소설인 이유","a":"서술자가 개입해 논평하고, 운문에 가까운 가락과 반복·과장된 표현이 자주 나타난다. 양반의 한문투와 서민의 일상어가 섞여 있고 해학적 장면이 두드러지며, 서민의 시각에서 인물을 웃음거리로 삼는 점도 판소리 사설의 성격을 보여 준다.","k":[["서술자","개입","논평"],["운문","가락","율문"],["한문투","일상어","서민"],["해학","과장","웃음"]]},{"n":7,"q":"소설에 나타난 문제 상황과 해결 양상","a":"문제는 춘풍의 방탕으로 가산이 탕진되고 남편이 평양에서 심부름꾼으로 전락한 것이다. 해결은 무능한 남편이 아니라 부인이 길쌈으로 살림을 일으키고 남장 비장이 되어 이루어지며, 곤장과 응징을 거쳐 춘풍이 개과천선하고 가정이 회복되는 방식으로 마무리된다.","k":[["방탕","탕진","전락"],["부인","아내","해결"],["남장","비장","길쌈"],["개과천선","응징","회복"]]}],"blank":[{"n":1,"q":"작가 — ( )","a":"미상","alt":["작자 미상","작자미상"]},{"n":2,"q":"갈래 — ( ) 소설, 풍자 소설, 세태 소설","a":"판소리계","alt":["판소리"]},{"n":3,"q":"성격 — 풍자적, ( )적, 교훈적","a":"해학","alt":["해학적"]},{"n":4,"q":"배경 — 시간: ( ) 즉위 초 / 공간: 서울, 평양","a":"숙종","alt":[]},{"n":5,"q":"주제 — 무능력한 ( )을 비판, 진취적인 여성의 활약","a":"가장","alt":[]},{"n":6,"q":"춘풍이 장사 자금으로 빌린 나라 돈은 ( ) 돈이다","a":"호조","alt":[]},{"n":7,"q":"춘풍을 유혹해 재산을 가로챈 평양 기생은 ( )이다","a":"추월","alt":[]},{"n":8,"q":"춘풍의 부인이 남장을 하고 얻어 낸 직책은 ( )이다","a":"회계 비장","alt":["비장","회계비장"]},{"n":9,"q":"춘풍의 부인이 살림을 일으키기 위해 한 일은 ( )이다","a":"길쌈","alt":[]},{"n":10,"q":"결말에서 춘풍은 잘못을 뉘우치고 ( )한다","a":"개과천선","alt":[]},{"n":11,"q":"서술자가 사건 도중 끼어들어 인물을 평가하는 것을 ( )이라 한다","a":"편집자적 논평","alt":["편집자적논평","편집자적 개입"]}]},{"id":"woon","name":"운영전","sub":"작자 미상 · 염정 · 액자 소설","story":[{"n":1,"q":"작품의 도입부에서 '유영'이 수성궁에 찾아가 어떠한 계기로 운영과 김 진사의 비극적 이야기를 듣게 되는지","a":"임진왜란이 끝난 뒤인 선조 34년 봄날, 유영이라는 선비가 안평 대군이 살던 수성궁에 놀러 갔다가 술에 취해 잠든 뒤 깨어난다. 그때 눈앞에 궁녀 운영과 소년 선비 김 진사가 나타나 자신들의 슬픈 사랑 이야기를 들려준다.","k":[["유영"],["수성궁","안평 대군","안평대군"],["술","취","잠"],["운영","김 진사","김진사"]]},{"n":2,"q":"안평대군이 운영을 비롯한 궁녀들에게 내린 금기와 궁궐 내 생활의 한계","a":"안평 대군은 미모와 글솜씨가 뛰어난 궁녀들을 뽑아 시문을 가르치되, 궁 밖 출입과 외간 남자와의 접촉을 금했다. 운영도 13세 때 대군의 부름에 따라 입궁했는데, 재능은 길러 주면서 인간적 감정은 억누르게 한 셈이라 궁녀들의 삶은 근본적으로 갇혀 있었다.","k":[["궁녀","시","글","가르"],["금","출입","접촉","남자"],["13세","입궁","부름"],["갇","억눌","한계"]]},{"n":3,"q":"운영과 김 진사가 처음 만나 사랑에 빠지게 된 계기와 이후 사랑의 방식","a":"어느 날 김 진사라는 소년 선비가 대군이 머무는 궁에 찾아와 시를 짓는데, 운영과 김 진사는 처음 본 순간부터 서로 사랑에 빠진다. 이후 김 진사는 하인 특과 다른 궁녀의 도움으로 수성궁의 담을 넘나들며 운영을 만나 사랑을 이어 간다.","k":[["김 진사","김진사","선비"],["시","짓"],["처음","순간","사랑"],["담","넘","특","궁녀"]]},{"n":4,"q":"둘의 애정이 안평대군에게 포착될 위기에 궁녀들의 반응과 역할","a":"궁녀들은 김 진사가 궁을 넘나들 수 있도록 도와주며 두 사람의 사랑을 감싸 준다. 나중에 크게 노한 대군이 운영과 궁녀들을 모두 죽이려 하자, 궁녀들이 나서서 운영을 변호해 대군의 분노를 가라앉힌다.","k":[["도와","도움","감싸"],["대군","노한","죽이려"],["변호","나서","항변"],["분노","가라앉"]]},{"n":5,"q":"운영과 김 진사가 궁궐을 탈출하기 위해 세운 계획과, 노비 '특'의 배신으로 실패하게 된 과정","a":"김 진사의 하인 특은 운영에게 궁궐을 벗어날 수 있는 계책을 알려 주는 동시에, 운영의 재물을 독차지하려는 욕심을 부린다. 결국 특의 배신으로 운영과 김 진사의 밀회가 탄로 난다.","k":[["특","하인","노비"],["계책","탈출","벗어날"],["재물","독차지","욕심"],["배신","탄로","발각"]]},{"n":6,"q":"탈출 사실이 발각된 후 안평대군의 추국과 이에 맞선 운영의 선택 및 결말","a":"크게 노한 대군이 운영과 궁녀들을 모두 죽이려 하자 궁녀들이 나서서 변호했고, 대군은 분노를 가라앉히고 운영을 별궁에 가둔다. 그날 밤 운영은 스스로 목숨을 끊고, 슬픔을 억누르지 못한 김 진사도 식음을 전폐하다가 죽음을 맞는다.","k":[["노한","죽이려","대군"],["변호","궁녀"],["별궁","가"],["스스로","자결","목숨"],["김 진사","김진사","식음"]]},{"n":7,"q":"운영의 죽음을 알게 된 김 진사의 행보와, 이야기를 마친 후 유영이 보여준 결말","a":"김 진사는 슬픔을 억누르지 못하고 식음을 전폐하다가 죽음을 맞는다. 유영이 다시 잠에서 깨고 나니 두 사람은 보이지 않고 귀신이 쓴 책만 한 권 남아 있었는데, 유영은 그 책을 가지고 돌아온 뒤 여러 명산을 다니며 살았고 어떻게 생을 마쳤는지는 알 수 없다.","k":[["식음","전폐","죽"],["책","한 권","귀신"],["유영","명산"],["알 수 없","생을 마"]]}],"theory":[{"n":1,"q":"〈운영전〉의 작가, 갈래, 성격, 배경, 주제, 연대","a":"작가는 미상이며 갈래는 염정 소설이자 애정 소설, 몽유 소설, 액자 소설이다. 성격은 비극적이고, 배경은 조선 초기에서 중기이며 공간은 안평 대군이 궁녀와 함께 있던 수성궁과 천상계다. 주제는 남녀 간의 지고한 사랑과 궁녀의 비극적인 삶이고, 연대는 조선 숙종 때(17세기)다.","k":[["미상","작자"],["염정","애정","몽유","액자"],["비극"],["수성궁","안평","천상계"],["지고","사랑","궁녀"],["숙종","17세기"]]},{"n":2,"q":"인물 설명 — 유영, 운영, 김 진사","a":"유영은 학문이 깊지만 가난한 선비로, 환상을 통해 운영과 김 진사의 이야기를 듣는다. 운영은 아름답고 글을 잘 짓는 궁녀이지만 김 진사와의 밀회가 드러나자 자결하고, 김 진사는 사랑하는 운영이 자결하자 슬퍼하며 식음을 전폐하다가 죽는다.","k":[["유영","학문","가난","선비"],["운영","궁녀","글","자결"],["김 진사","김진사","식음","전폐"]]},{"n":3,"q":"일반적인 몽유록계 소설과의 차이점","a":"보통의 몽유록은 몽유자가 꿈에서 인물들을 만나 이야기를 듣고 깨어나며 현실을 비판하는 틀을 갖는다. 〈운영전〉은 꿈과 현실의 경계가 뚜렷하지 않고 당사자인 운영과 김 진사가 직접 자기 사연을 서술하며, 교훈이나 각성 대신 비극적 정서로 끝난다는 점이 다르다.","k":[["몽유자","꿈","깨"],["경계","모호","뚜렷"],["당사자","직접","서술"],["비극","정서","교훈"]]},{"n":4,"q":"안평대군의 이중성","a":"그는 궁녀들에게 시문을 가르치며 재능을 아끼는 후원자이지만, 동시에 그들의 사랑과 자유를 금지하는 억압자이기도 하다. 크게 노해 죽이려 하다가도 궁녀들의 변호를 듣고 분노를 가라앉히는 인간적인 면을 보이지만, 끝내 궁이라는 울타리를 풀어 주지는 못한다.","k":[["재능","가르","후원"],["금지","억압","가두"],["분노","가라앉","용서"],["이중","모순"]]},{"n":5,"q":"〈운영전〉의 비장미","a":"비장미는 인물이 뜻을 이루지 못하고 좌절하거나 죽음에 이를 때 느껴지는 슬프고도 숭고한 아름다움이다. 운영이 목숨으로 사랑을 지키고 김 진사가 뒤따르는 결말에서, 현실의 벽 앞에서도 뜻을 굽히지 않은 인물들의 비극이 숭고하게 그려진다.","k":[["좌절","죽음","이루지 못"],["슬프","숭고","아름"],["사랑","지키","굽히지"]]},{"n":6,"q":"〈운영전〉의 표면적 주제와 이면적 주제","a":"표면적으로는 궁녀 운영과 김 진사의 이루어질 수 없는 사랑을 그린 애정담이다. 이면에는 궁이라는 폐쇄된 공간과 신분 질서, 인간의 자연스러운 욕망을 억누르는 봉건적 규범에 대한 비판이 담겨 있다.","k":[["사랑","애정","이루어질 수 없"],["신분","봉건","규범"],["억압","욕망","비판","자유"]]},{"n":7,"q":"〈운영전〉의 액자식 구성","a":"유영이 수성궁에서 두 사람을 만나는 부분이 바깥 이야기(외화)이고, 운영과 김 진사가 들려주는 사랑 이야기가 안 이야기(내화)다. 내화를 당사자가 직접 서술해 사실감과 절실함을 높이고, 외화가 이를 감싸며 이야기에 신빙성을 준다.","k":[["외화","바깥","유영"],["내화","안","운영"],["당사자","직접","서술"],["사실감","신빙","효과"]]},{"n":8,"q":"다른 몽유록 소설과의 비교","a":"「원생몽유록」 같은 작품은 역사적 인물을 등장시켜 정치적 울분을 드러내는 데 무게를 두지만, 〈운영전〉은 개인의 애정과 내면 심리에 집중한다. 또 다른 몽유록이 꿈에서 깨어나며 각성으로 마무리되는 것과 달리 〈운영전〉은 끝까지 비극적 여운을 남긴다.","k":[["역사","정치","원생","울분"],["애정","개인","심리","내면"],["각성","깨","비극","여운"]]},{"n":9,"q":"여성 작가(추정)가 쓴 작품이라는 근거와 그 특징","a":"여성 인물의 감정과 심리가 섬세하게 그려지고, 운영이 자기 목소리로 직접 사연을 서술한다. 궁녀들이 서로를 감싸고 변호하는 연대가 두드러지며, 여성을 억누르는 제도에 대한 비판적 시선이 뚜렷하다는 점도 근거로 꼽힌다.","k":[["섬세","심리","감정","내면"],["목소리","직접","서술"],["궁녀","연대","변호"],["제도","억압","비판"]]}],"blank":[{"n":1,"q":"작가 — ( )","a":"미상","alt":["작자 미상","작자미상"]},{"n":2,"q":"갈래 — 염정 소설, 애정 소설, 몽유 소설, ( ) 소설","a":"액자","alt":["액자식"]},{"n":3,"q":"성격 — ( )적","a":"비극","alt":["비극적"]},{"n":4,"q":"배경 — 공간: 안평 대군이 궁녀와 함께 있던 ( ), 천상계","a":"수성궁","alt":[]},{"n":5,"q":"주제 — 남녀 간의 ( ) 사랑, 궁녀의 비극적인 삶","a":"지고한","alt":["지고","지고지순한"]},{"n":6,"q":"연대 — 조선 ( ) 때(17세기)","a":"숙종","alt":[]},{"n":7,"q":"유영이 수성궁에 놀러 간 때는 임진왜란이 끝난 뒤인 선조 ( )년 봄날이다","a":"34","alt":["34년"]},{"n":8,"q":"운영이 대군의 부름에 따라 입궁한 나이는 ( )세이다","a":"13","alt":["13세","열세"]},{"n":9,"q":"운영의 재물을 독차지하려다 배신한 김 진사의 하인은 ( )이다","a":"특","alt":[]},{"n":10,"q":"대군이 분노를 가라앉히고 운영을 가둔 곳은 ( )이다","a":"별궁","alt":[]},{"n":11,"q":"바깥 이야기를 ( ), 안 이야기를 내화라고 한다","a":"외화","alt":[]}]},{"id":"gu","name":"구운몽","sub":"김만중 · 몽자류 소설","story":[{"n":1,"q":"형산 연화봉에서 불도를 닦던 '성진'이 세속적 번뇌를 품게 된 계기","a":"육관 대사의 제자 중 가장 뛰어난 성진은 대사의 심부름으로 용궁에 가 용왕의 융숭한 환대를 받는다. 마침 선녀 위진군이 보낸 팔선녀를 돌아오는 길에 만나 즐거운 시간을 보내고, 절로 돌아온 뒤로 팔선녀를 그리워하며 속세의 부귀영화를 떠올리게 된다.","k":[["육관 대사","육관대사"],["용궁","용왕","심부름"],["팔선녀"],["부귀영화","속세","그리워"]]},{"n":2,"q":"성진의 마음속 번뇌를 알아채고 육관대사가 내린 벌과 이로 인해 성진이 겪게 된 변화","a":"성진은 지옥에 떨어져 인간 세상으로 환생하는 꿈을 꾸게 된다. 꿈속에서 성진은 양소유가 되어 인간의 삶을 살게 된다.","k":[["지옥"],["인간","세상","환생"],["꿈"],["양소유"]]},{"n":3,"q":"인간 세상에 태어난 양소유가 유교적 입신양명을 이루어가는 과정","a":"꿈속에서 양소유가 된 성진은 환생한 팔선녀와 결혼한다. 그리고 승상이라는 벼슬에 올라 온갖 부귀영화를 누린다.","k":[["양소유"],["팔선녀","결혼","환생"],["승상","벼슬"],["부귀영화"]]},{"n":4,"q":"양소유가 속세에서 여덟 여인(팔선녀의 후신)과 만나는 과정과 그들과의 관계","a":"양소유가 만나는 여덟 여인은 모두 인간 세상으로 환생한 팔선녀다. 양소유는 이들과 모두 인연을 맺어 결혼하고, 서로 다투지 않고 화목하게 지내며 부귀영화를 누린다.","k":[["팔선녀","후신","환생","여덟"],["결혼","인연"],["화목","함께","부귀영화"]]},{"n":5,"q":"승상이 되어 인생의 부귀영화를 누린 양소유가 만년에 느끼게 된 회한과 사유","a":"벼슬에서 물러난 양소유는 폐허가 된 궁궐터를 보게 된다. 그 순간 문득 인생의 허무함을 느낀다.","k":[["벼슬","물러"],["폐허","궁궐터"],["허무","덧없","인생"]]},{"n":6,"q":"양소유가 세속의 허무함을 느끼던 순간 나타난 노승과의 대화 및 꿈에서 깨어나는 과정","a":"이때 양소유는 한 노승을 만나는데, 노승이 지팡이로 난간을 두드리자 꿈에서 깨어난다. 모든 것이 온데간데없이 사라지고 양소유는 다시 성진으로 돌아온다.","k":[["노승"],["지팡이","난간","두드"],["꿈","깨"],["성진","돌아"]]},{"n":7,"q":"꿈에서 깨어난 성진이 깨달은 진리와 이후 팔선녀와 함께 이룬 마지막 행보","a":"육관 대사는 세속적인 욕망이 하룻밤 꿈에 불과하다는 가르침을 주고, 꿈에서 깬 성진과 팔선녀는 대사 앞에 엎드려 제자가 되기를 청한다. 육관 대사가 금강경을 통해 인생무상의 진리를 설법하자, 큰 깨달음을 얻은 성진과 팔선녀는 이후 극락세계로 간다.","k":[["육관 대사","육관대사"],["욕망","하룻밤","꿈"],["제자","엎드"],["금강경"],["인생무상","극락세계","깨달"]]}],"theory":[{"n":1,"q":"〈구운몽〉의 작가, 갈래, 성격, 배경, 주제, 연대, 출전","a":"김만중이 지은 국문 소설로 양반 소설, 몽자류 소설, 영웅 소설, 염정 소설로 분류된다. 성격은 불교적·구도적·전기적이며, 배경은 중국 당나라 때로 현실은 남악 형산의 연화봉 선계, 꿈은 당나라의 수도와 변방이다. 주제는 인생무상과 부귀영화의 덧없음이고, 조선 숙종 15년(1689) 작품으로 완판본 『구운몽』이 출전이다.","k":[["김만중"],["국문","양반","몽자류","영웅","염정"],["불교","구도","전기"],["당나라","형산","연화봉"],["인생무상","부귀영화","덧없"],["숙종","1689","완판"]]},{"n":2,"q":"'성진'과 '소유' 이름의 의미","a":"성진(性眞)은 '참된 본성'이라는 뜻으로, 수행자가 되찾아야 할 본래의 자리를 가리킨다. 소유(少游)는 '잠시 노닌다'는 뜻으로, 인간 세상의 삶이 잠깐 스쳐 가는 유람에 지나지 않음을 이름에 미리 담아 둔 것이다.","k":[["성진","참","본성"],["소유","잠시","노","유람"],["인간","삶","덧없","꿈"]]},{"n":4,"q":"〈구운몽〉에 담겨 있는 사상적 배경","a":"유교·불교·도교가 함께 녹아 있다. 양소유의 입신양명은 유교적 가치를, 용궁과 선녀가 등장하는 대목은 도교적 상상력을, 모든 것이 꿈이었다는 결말과 금강경의 공(空) 사상은 불교를 보여 주며 그중 불교가 중심을 이룬다.","k":[["유교","입신양명"],["도교","선녀","용궁"],["불교","금강경","공"],["중심","조화"]]},{"n":5,"q":"제목 '구운몽'의 의미","a":"'구(九)'는 성진과 팔선녀 아홉 사람을, '운(雲)'은 구름처럼 덧없이 흩어지는 인생을, '몽(夢)'은 그 모든 것이 꿈이었음을 뜻한다. 제목 자체가 작품의 인물 구성과 주제를 한꺼번에 담고 있다.","k":[["구","아홉","성진","팔선녀"],["운","구름","덧없"],["몽","꿈"],["주제","인물","담"]]},{"n":6,"q":"육관대사의 가르침","a":"육관 대사는 세속적인 욕망이 하룻밤 꿈에 불과하다는 가르침을 준다. 꿈을 직접 겪게 해 스스로 깨닫게 한 뒤 금강경을 통해 인생무상의 진리를 설법함으로써, 집착을 버리고 참된 본성으로 돌아가야 함을 일깨운다.","k":[["세속","욕망","하룻밤","꿈"],["스스로","깨닫","경험"],["금강경","설법"],["인생무상","본성","집착"]]},{"n":7,"q":"몽자류 소설과 몽유록계 소설의 차이","a":"몽자류 소설은 주인공이 꿈속에서 다른 인물로 다시 태어나 일생을 살고, 깨어난 뒤 인생의 덧없음을 깨닫는 구조다. 몽유록계는 몽유자가 자기 모습 그대로 꿈에 들어가 인물들을 만나 이야기를 듣고 돌아오며, 주로 현실 비판이나 울분을 드러내는 데 목적이 있다.","k":[["몽자류","다시 태어","환생","일생"],["깨달","덧없","각성"],["몽유록","그대로","만나","듣"],["비판","울분","현실"]]}],"blank":[{"n":1,"q":"작가 — ( )","a":"김만중","alt":[]},{"n":2,"q":"갈래 — 국문 소설, 양반 소설, ( ) 소설, 영웅 소설, 염정 소설","a":"몽자류","alt":[]},{"n":3,"q":"성격 — 불교적, ( )적, 전기적","a":"구도","alt":["구도적"]},{"n":4,"q":"배경 — 공간: 중국 남악 형산의 ( ) 선계(현실), 당나라의 수도와 변방(꿈)","a":"연화봉","alt":[]},{"n":5,"q":"주제 — ( )과 부귀영화의 덧없음","a":"인생무상","alt":["인생 무상"]},{"n":6,"q":"연대 — 조선 숙종 15년(( ))","a":"1689","alt":["1689년"]},{"n":7,"q":"출전 — ( )본 『구운몽』","a":"완판","alt":["완판본"]},{"n":8,"q":"성진의 스승은 ( )이다","a":"육관 대사","alt":["육관대사","육관"]},{"n":9,"q":"꿈속에서 성진이 환생한 인물의 이름은 ( )이다","a":"양소유","alt":[]},{"n":10,"q":"육관 대사가 인생무상의 진리를 설법할 때 사용한 불경은 ( )이다","a":"금강경","alt":[]},{"n":11,"q":"성진(性眞)은 '( )'이라는 뜻이다","a":"참된 본성","alt":["참된본성","본성"]},{"n":12,"q":"김만중의 호는 ( )이며, 문집으로 『서포만필』이 있다","a":"서포","alt":[]}]},{"id":"sa","name":"사씨남정기","sub":"김만중 · 가정 소설","story":[{"n":1,"q":"명나라 사대부 유연수와 사씨의 혼인 과정과, 후사를 얻지 못해 일어난 상황","a":"개국 공신 유기의 손자인 유연수는 인물이 출중하고 학식이 깊어 어린 나이에 장원 급제한 뒤, 현명하다고 소문난 사 소저와 혼인한다. 부부는 금실이 좋았으나 후사가 없어 고민하던 중 교씨를 첩으로 맞아들인다.","k":[["유연수","유기","개국 공신"],["장원","급제"],["사 소저","사씨","혼인"],["후사","자식","없"],["교씨","첩"]]},{"n":2,"q":"첩으로 들어온 교씨의 성품과 그녀가 사씨를 모함하기 위해 꾸민 음모","a":"교씨는 아들을 낳은 뒤 시기심이 많아 갖은 음해로 사씨를 모략한다. 남몰래 동청과 정을 통하며 함께 사씨를 몰아낼 계략을 꾸민다.","k":[["교씨"],["아들","낳"],["시기심","음해","모략"],["동청","정을 통","결탁"]]},{"n":3,"q":"교씨의 간계에 속은 유연수가 내린 결정과, 이로 인해 사씨가 겪게 된 시련","a":"유연수는 교씨의 음해에 넘어가 사씨를 내쫓고 교씨를 정실로 삼는다. 집에서 쫓겨난 사씨는 길을 헤매다가 동정호 장군사에서 머물게 된다.","k":[["음해","속","넘어가"],["내쫓","쫓"],["교씨","정실"],["동정호","장군사","헤매"]]},{"n":4,"q":"사씨가 쫓겨난 후 교씨와 동청이 저지른 악행과 이로 인해 유연수가 겪게 된 비극","a":"유연수가 사씨를 내쫓은 일을 후회하자, 이를 눈치챈 교씨는 동청과 합심해 유연수의 편지를 훔친 뒤 거짓으로 꾸며 엄 승상에게 밀고한다. 유연수는 귀양을 가고 동청은 엄 승상의 도움으로 벼슬을 얻으며, 교씨는 재산을 챙겨 유연수의 집에서 나간다.","k":[["편지","훔","거짓","꾸며"],["엄 승상","엄승상","밀고"],["귀양","유배"],["동청","벼슬"],["재산","챙","나간"]]},{"n":5,"q":"유연수가 유배에서 풀려나게 된 계기와, 사씨의 억울함을 깨닫고 그녀를 찾아 나서는 과정","a":"동정호 장군사에 머물던 사씨는 죽을 위기에 처한 유연수를 극적으로 구한다. 엄 승상은 부정을 저지른 일로 숙청되고 동청 또한 죽음을 맞으면서, 누명을 벗은 유연수는 복권되어 다시 벼슬길에 오른다.","k":[["사씨","구","위기"],["동정호","장군사"],["엄 승상","엄승상","숙청"],["동청","죽음"],["복권","누명","벼슬"]]},{"n":6,"q":"유연수와 사씨가 재회하는 과정과 악인인 교씨 및 동청이 받게 된 처벌","a":"집으로 돌아온 유연수와 사씨는 집안사람들과 재회하고, 교씨에 의해 죽은 줄로만 알았던 아들 인아까지 되찾는다. 동청은 이미 죽음을 맞았고, 교활한 교씨도 결국 유연수에게 붙잡혀 죽음을 맞는다.","k":[["재회","돌아","집안사람"],["인아","아들","되찾"],["동청"],["교씨","붙잡","죽음","처벌"]]},{"n":7,"q":"사씨가 정실로 복위한 후 가문의 결말과, 작가 김만중이 작품을 통해 전달하고자 한 정치적 메시지","a":"교씨가 죽은 뒤 유연수와 사씨는 백년해로하며 가문이 다시 번성한다. 김만중은 인현왕후를 폐위하고 장희빈을 총애한 숙종의 잘못을 완곡하게 빗대어 깨우치려 했다.","k":[["백년해로","복위","재회"],["가문","번성"],["인현왕후","장희빈","숙종"],["풍간","완곡","깨우","빗대"]]}],"theory":[{"n":1,"q":"〈사씨남정기〉의 작가, 갈래, 성격, 배경, 주제, 연대","a":"김만중이 지은 국문 소설이자 가정 소설, 목적 소설이다. 성격은 풍간적이고 가정적이며, 배경은 중국 명나라 초기의 북경 인근 금릉 순천부다. 주제는 처첩 간의 갈등과 사씨의 고행이고, 연대는 조선 숙종 15~18년(1689~1692)이다.","k":[["김만중"],["국문","가정","목적"],["풍간","가정적"],["명나라","금릉","순천부","북경"],["처첩","갈등","고행"],["숙종","1689"]]},{"n":2,"q":"인물 설명 — 사씨, 교씨, 유연수","a":"사씨는 아름답고 현명한 여인으로, 교씨의 모함 때문에 집에서 쫓겨난다. 교씨는 사씨와 유연수를 모함해 쫓아내고 재산을 차지하며, 유연수는 교씨의 모함에 빠져 사씨를 버리지만 곧 사씨와 재회한다.","k":[["사씨","현명","쫓겨"],["교씨","모함","재산"],["유연수","버리","재회"]]},{"n":3,"q":"〈사씨남정기〉의 창작 배경","a":"숙종이 인현왕후를 폐위하고 장희빈을 총애하던 시기에, 이에 반대하다 남해로 유배 간 김만중이 지었다. 임금을 직접 비판할 수 없으니 명나라 가정의 이야기로 옮겨 놓고 깨우침을 주려 한 것이다.","k":[["숙종","인현왕후","장희빈"],["폐위","총애"],["유배","남해","김만중"],["빗대","깨우","풍간","직접"]]},{"n":4,"q":"〈사씨남정기〉의 문학사적 의의","a":"우리 문학에서 본격적인 가정 소설의 출발점으로 꼽히며, 처첩 갈등이라는 소재를 소설의 중심 갈등으로 끌어올렸다. 국문 소설의 문장과 짜임을 한 단계 높였고 「장화홍련전」 등 후대 가정 소설에 큰 영향을 주었다.","k":[["가정","최초","출발","본격"],["처첩","갈등"],["국문","한글","수준"],["영향","후대","장화홍련"]]},{"n":5,"q":"풍간소설이란 무엇인가","a":"풍간이란 완곡한 표현으로 잘못을 고치도록 하는 것을 뜻한다. 임금이나 권력자의 잘못을 직접 지적하지 않고 이야기에 빗대어 넌지시 깨우치는 소설로, 〈사씨남정기〉가 대표적이다.","k":[["완곡","빗대","넌지시"],["잘못","고치","깨우"],["임금","권력"],["직접","지적","않"]]},{"n":6,"q":"작품에 반영된 당대 사회상","a":"축첩이 허용되던 가부장제 아래에서 처와 첩의 갈등이 흔했고, 여성은 아들을 낳지 못하면 지위가 흔들렸다. 여성에게 덕과 인내를 요구하는 유교적 규범이 강했으며, 궁중의 권력 다툼이 가정의 갈등과 겹쳐 보이던 시대였다.","k":[["축첩","처첩","가부장"],["아들","후사","지위"],["유교","덕","인내","규범"],["궁중","권력","다툼"]]}],"blank":[{"n":1,"q":"작가 — ( )","a":"김만중","alt":[]},{"n":2,"q":"갈래 — 국문 소설, ( ) 소설, 목적 소설","a":"가정","alt":[]},{"n":3,"q":"성격 — ( )적, 가정적","a":"풍간","alt":["풍간적"]},{"n":4,"q":"( )이란 완곡한 표현으로 잘못을 고치도록 하는 것을 뜻한다","a":"풍간","alt":[]},{"n":5,"q":"배경 — 시간: 중국 ( ) 초기 / 공간: 북경 인근의 금릉 순천부","a":"명나라","alt":["명"]},{"n":6,"q":"주제 — ( ) 간의 갈등과 사씨의 고행","a":"처첩","alt":["처와 첩"]},{"n":7,"q":"연대 — 조선 숙종 15~18년(( )~1692)","a":"1689","alt":["1689년"]},{"n":8,"q":"교씨와 정을 통하며 유연수를 모함한 인물은 ( )이다","a":"동청","alt":[]},{"n":9,"q":"동청이 유연수를 밀고한 권력자는 ( )이다","a":"엄 승상","alt":["엄승상","엄"]},{"n":10,"q":"쫓겨난 사씨가 머물게 된 곳은 동정호 ( )이다","a":"장군사","alt":[]},{"n":11,"q":"교씨에 의해 죽은 줄 알았다가 되찾은 유연수의 아들은 ( )이다","a":"인아","alt":[]}]},{"id":"chung","name":"유충렬전","sub":"작자 미상 · 군담 소설","story":[{"n":1,"q":"주인공 '유충렬'의 출생 배경과 그의 집안이 갖는 내력","a":"중국 명나라 영종 황제 즉위 초, 자식이 없어 고민하던 유심 부부는 정성껏 치성을 드린 후 사내아이를 얻고 이름을 충렬이라 짓는다. 유충렬은 문무를 겸비한 훌륭한 청년으로 성장한다.","k":[["명나라","영종"],["유심","부부"],["자식","없","치성"],["충렬","문무","겸비"]]},{"n":2,"q":"간신 정한담 일파의 모함으로 유충렬의 집안이 겪게 된 시련과 이로 인한 충렬의 이별","a":"반란의 기회를 엿보던 정한담과 최일귀는 유심을 모함해 귀양 보낸다. 유심의 가족은 뿔뿔이 흩어지고, 유충렬은 하늘의 도움으로 목숨을 건진다.","k":[["정한담","최일귀"],["반란","기회","엿보"],["모함","귀양"],["흩어","뿔뿔이"],["하늘","도움","목숨"]]},{"n":3,"q":"유랑하던 충렬이 도승지 강희주를 만나 구원받는 과정과, 다시 닥쳐온 시련","a":"목숨을 건진 유충렬은 부친의 친구인 강희주의 사위가 된다. 그러나 강희주는 유심의 누명을 벗기려고 상소했다가 귀양을 가고, 강희주의 가족 역시 사방으로 흩어진다.","k":[["강희주","부친","친구"],["사위","혼인"],["누명","상소"],["귀양","흩어"]]},{"n":4,"q":"깊은 산속으로 피신한 유충렬이 어떤 조력자를 만나 영웅으로 성장하는지","a":"유충렬은 하늘의 도움으로 목숨을 건진 뒤 도술과 뛰어난 무예를 익혀 영웅으로 성장한다. 이러한 초월적 조력 덕분에 뒷날 적장의 목을 베고 오랑캐를 소탕할 수 있는 능력을 갖추게 된다.","k":[["하늘","도움","조력"],["도술","무예"],["영웅","성장"],["적장","오랑캐","소탕"]]},{"n":5,"q":"정한담 일파가 외적과 결탁하여 일으킨 반란과 명나라 조정이 처한 위기","a":"국력이 약해지자 사방에서 오랑캐가 들고일어나고, 그중 남적·북적·가달 등이 남경으로 쳐들어온다. 정한담과 최일귀는 오랑캐에 대적하러 나갔다가 오히려 항복한 뒤 반란군의 우두머리가 되어 명나라를 공격한다.","k":[["오랑캐","남적","북적","가달"],["남경","쳐들어"],["항복","대적"],["반란군","우두머리","공격"]]},{"n":6,"q":"유충렬이 출전하여 위기에 빠진 천자(황제)를 구하고 원수를 갚는 과정","a":"황제가 오랑캐에 항복하기 직전, 유충렬이 나타나 도술로 적장의 목을 벤다. 뛰어난 무예로 오랑캐를 소탕하고 호왕에게 잡혀간 황실 사람들을 구출했으며, 아버지 유심과 장인 강희주까지 함께 구출한다.","k":[["황제","항복","직전"],["도술","적장","목"],["오랑캐","소탕","무예"],["호왕","황실","구출"],["유심","강희주"]]},{"n":7,"q":"전쟁을 승리로 이끈 유충렬이 헤어졌던 가족과 재회하고 이루게 된 최종 결말","a":"전쟁이 끝나고 나라는 평화를 되찾는다. 유충렬은 헤어졌던 어머니와 아내까지 되찾고 높은 벼슬에 올라 오랫동안 부귀영화를 누린다.","k":[["전쟁","평화","되찾"],["어머니","아내","가족"],["높은","벼슬"],["부귀영화"]]}],"theory":[{"n":1,"q":"군담소설이란 무엇인가","a":"전쟁과 영웅의 활약을 중심으로 하는 소설 갈래다. 주인공이 위기에 빠진 나라를 구하고 적을 물리치는 과정을 그리며, 조선 후기 전란을 겪은 민중의 심리를 반영해 크게 유행했다.","k":[["전쟁","전란","싸움"],["영웅","활약","공"],["나라","구","위기"],["조선 후기","민중","유행"]]},{"n":2,"q":"〈유충렬전〉의 작가, 갈래, 성격, 배경, 주제, 출전","a":"작가는 미상이며 갈래는 군담 소설이자 국문 소설, 영웅 소설이다. 성격은 비현실적·우연적이고, 배경은 중국 명나라 때의 명나라 조정과 중국 대륙이다. 주제는 가문을 일으키고 나라를 구한 영웅의 충정이며, 출전은 완판본 『유충렬전』이다.","k":[["미상","작자"],["군담","국문","영웅"],["비현실","우연"],["명나라","조정","대륙"],["가문","나라","충정"],["완판"]]},{"n":3,"q":"인물 설명 — 유충렬, 정한담, 최일귀","a":"유충렬은 능력이 뛰어나고 정의로우며 나라와 가문을 부흥시키는 주인공이다. 정한담과 최일귀는 악인이자 간신으로 유심을 모함하고 반란을 일으켰다가, 훗날 유충렬에 의해 처단된다.","k":[["유충렬","능력","정의","가문"],["정한담","최일귀","간신","악인"],["모함","반란"],["처단"]]},{"n":4,"q":"배경을 중국으로 설정한 이유","a":"조선을 무대로 삼아 지배층을 비판하면 화를 입을 수 있으므로 중국으로 옮겨 검열을 피했다. 명나라를 배경으로 삼는 것이 당시의 숭명 의식에도 맞았고, 황제를 구한다는 큰 규모의 이야기를 펼치기에도 적합했다.","k":[["검열","비판","피","화"],["명나라","숭명"],["규모","황제","웅장"]]},{"n":5,"q":"병자호란 패전과 민중의식의 반영","a":"실제 역사에서는 청에게 굴욕적으로 패했지만 작품에서는 오랑캐를 통쾌하게 소탕하고 황제를 구해 낸다. 현실에서 이루지 못한 승리를 소설에서 이루어 좌절감을 달래고, 나라를 지키지 못한 무능한 집권층에 대한 불만도 함께 담았다.","k":[["병자호란","청","오랑캐","패"],["승리","소탕","통쾌"],["좌절","보상","위안","대리"],["집권층","무능","불만"]]},{"n":6,"q":"시대적 상황과 복수극","a":"전란을 겪은 백성들에게는 침략자와 무능한 관리에 대한 응어리가 남아 있었다. 충렬이 아버지를 모함하고 나라를 배신한 정한담을 직접 처단하는 복수극은 그 응어리를 대신 풀어 주는 역할을 한다.","k":[["전란","백성","응어리","한"],["정한담","원수","복수","처단"],["대신","풀","대리"]]},{"n":7,"q":"가족들과의 이별과 재회의 의미","a":"이별은 주인공을 시련에 빠뜨려 영웅으로 성장하게 만드는 계기이자, 전란으로 가족이 흩어진 당대 백성의 경험을 그대로 보여 준다. 마지막의 재회는 흩어진 가족이 다시 모이기를 바라는 민중의 소망을 이루어 주는 행복한 결말이다.","k":[["이별","시련","성장","계기"],["전란","백성","경험","흩어"],["재회","소망","행복","결말"]]},{"n":8,"q":"작품에 나타난 주술적 상상력","a":"치성을 드려 자식을 얻는 대목, 하늘의 도움으로 목숨을 건지는 장면, 도술로 적장의 목을 베는 활약 등 초현실적 요소가 곳곳에 나타난다. 천상계가 주인공을 돕는 설정은 영웅의 비범함을 강조하고 어려움이 반드시 극복되리라는 믿음을 준다.","k":[["치성","하늘","천상"],["도술","적장"],["초현실","비현실","신이"],["비범","영웅","강조"]]},{"n":9,"q":"〈유충렬전〉에 나타난 영웅의 일대기 구조","a":"충신 유심의 아들이라는 고귀한 혈통, 치성을 드려 얻은 비정상적 출생, 정한담의 모함으로 가족과 헤어지는 위기로 이어진다. 이후 하늘의 도움과 강희주라는 조력자를 만나 성장하고, 반란이라는 시련을 물리쳐 높은 벼슬에 오르는 승리로 마무리된다.","k":[["고귀","혈통","유심"],["치성","출생"],["위기","헤어","모함"],["하늘","강희주","조력"],["시련","극복","승리"]]}],"blank":[{"n":1,"q":"작가 — ( )","a":"미상","alt":["작자 미상","작자미상"]},{"n":2,"q":"갈래 — ( ) 소설, 국문 소설, 영웅 소설","a":"군담","alt":[]},{"n":3,"q":"성격 — 비현실적, ( )적","a":"우연","alt":["우연적"]},{"n":4,"q":"배경 — 시간: 중국 ( ) 때 / 공간: 명나라 조정과 중국 대륙","a":"명나라","alt":["명"]},{"n":5,"q":"주제 — 가문을 일으키고 나라를 구한 영웅의 ( )","a":"충정","alt":[]},{"n":6,"q":"출전 — ( )본 『유충렬전』","a":"완판","alt":["완판본"]},{"n":7,"q":"유충렬의 아버지는 ( )이다","a":"유심","alt":[]},{"n":8,"q":"유심을 모함해 귀양 보낸 두 간신은 정한담과 ( )이다","a":"최일귀","alt":[]},{"n":9,"q":"유충렬을 사위로 삼은, 부친의 친구는 ( )이다","a":"강희주","alt":[]},{"n":10,"q":"남경으로 쳐들어온 오랑캐는 남적, ( ), 가달 등이다","a":"북적","alt":[]},{"n":11,"q":"황실 사람들을 잡아간 오랑캐 왕은 ( )이다","a":"호왕","alt":[]},{"n":12,"q":"작품의 시대적 배경은 중국 명나라 ( ) 황제 즉위 초이다","a":"영종","alt":[]}]},{"id":"heo","name":"허생전","sub":"박지원 · 한문 소설","story":[{"n":1,"q":"허생이 7년 동안 글읽기만 하다가 집을 나서게 된 직접적인 계기와 그 과정","a":"남산 묵적골에서 7년째 글만 읽던 허생에게, 굶주림을 참다못한 아내가 과거도 보지 않으면서 글은 읽어 무엇하냐며 차라리 도둑질이라도 하라고 힐난한다. 허생은 10년 기한을 채우지 못한 것을 아쉬워하며 책을 덮고 집을 나선다.","k":[["7년","칠년","글"],["아내"],["도둑","굶","힐난"],["집","나","떠"]]},{"n":2,"q":"허생이 부자 변씨를 찾아가 자금을 마련하는 과정과 두 사람의 태도","a":"한양 제일 부자 변씨를 찾아가 대뜸 만 냥을 빌려 달라 요구한다. 허생은 이름조차 밝히지 않을 만큼 당당했고, 변씨는 그 비범함을 알아보고 아무것도 묻지 않은 채 선뜻 내준다.","k":[["변씨"],["만 냥","만냥"],["당당","대뜸"],["선뜻","묻지","빌려"]]},{"n":3,"q":"허생이 안성과 제주도 등에서 행한 경제 활동과 이를 통해 돈을 번 원리","a":"안성에서 제사에 쓰이는 과일을 모조리 사들였다가 열 배 값에 되팔고, 제주도에서는 말총을 매점해 망건값이 치솟자 큰 이익을 남긴다. 이는 매점매석 방식으로, 한 사람의 돈만으로도 시장이 흔들릴 만큼 조선 경제 구조가 취약함을 드러낸다.","k":[["안성","과일"],["제주","말총","망건"],["매점","독점","사들"],["열 배","이익","취약"]]},{"n":4,"q":"허생이 변산의 도적들을 교화하여 섬으로 데리고 가 이상향을 건설하는 과정","a":"변산의 도적들에게 돈을 나눠 주고 소와 여자를 데려오게 한 뒤 무인도로 데려가 농사를 짓게 한다. 몇 해 뒤 남은 곡식을 팔아 큰돈을 얻고, 글 아는 자들을 데리고 나오며 화근을 없앤다는 말과 함께 섬을 떠난다.","k":[["변산","도적"],["섬","무인도"],["농사","곡식","소"],["화근","글","떠나"]]},{"n":5,"q":"허생이 빌린 돈을 갚는 방식과, 어영대장 이완이 허생을 찾아오게 된 계기","a":"변씨에게 빌린 돈의 열 배인 십만 냥을 갚고, 변씨가 사양해도 끝내 받지 않는다. 이후 변씨가 그의 인물됨을 어영대장 이완에게 알렸고, 인재를 구하던 이완이 직접 찾아온다.","k":[["십만","10만","열 배"],["갚"],["변씨"],["이완","어영대장","인재"]]},{"n":6,"q":"허생이 이완 대장에게 제시한 세 가지 계책(시무책)과 이완의 반응","a":"와룡선생 같은 인재를 천거할 테니 삼고초려하라, 명나라 유민의 후손을 후대하고 권세가의 재물과 집을 나누어 주라, 자제들을 청에 보내 유학하고 장사시켜 실정을 파악하라고 제안한다. 이완은 세 가지 모두 어렵다며 난색을 표한다.","k":[["삼고초려","와룡","인재"],["명나라","종실","권세","재물"],["청","유학","장사"],["어렵","난색","거절"]]},{"n":7,"q":"이완 대장이 도망친 후 허생의 행방과, 작가가 작품을 통해 전달하고자 한 주제","a":"분노한 허생이 칼을 찾자 이완은 달아났고, 이튿날 다시 가 보니 허생은 자취를 감춘 뒤였다. 작가는 북벌을 외치면서도 아무것도 실천하지 못하는 지배층의 무능과 허위를 비판하며 이용후생의 실학 정신을 강조한다.","k":[["칼","분노"],["도망","달아"],["자취","사라","감춘"],["북벌","지배층","무능","실학"]]}],"theory":[{"n":1,"q":"〈허생전〉의 작가, 갈래, 성격, 배경","a":"박지원이 지은 한문 소설이자 단편 소설, 풍자 소설이다. 성격은 풍자적·비판적·실학적이며, 배경은 조선 효종 무렵의 한양과 안성·제주·변산 등이고 『열하일기』에 실려 있다.","k":[["박지원"],["한문","단편","풍자"],["실학","비판"],["조선","한양","효종"],["열하일기"]]},{"n":2,"q":"작품에 나타난 신분제의 동요","a":"양반인 허생은 가난해 아내에게 핀잔을 듣고 장사에 나서고, 상인인 변씨는 큰 재산으로 사회적 힘을 지닌다. 신분보다 경제력이 사람의 처지를 좌우하기 시작한 조선 후기의 변화가 그대로 드러난다.","k":[["양반","허생","가난"],["변씨","상인","부자"],["경제력","돈","신분"],["조선 후기","변화","동요"]]},{"n":3,"q":"매점매석의 숨겨진 의미","a":"한 사람이 만 냥으로 나라 전체의 과일과 말총을 좌우할 수 있다는 것은 조선의 경제 규모가 그만큼 작고 유통 구조가 허술했음을 뜻한다. 허생은 돈을 벌려는 것이 아니라 이 취약함을 직접 보여 주어 당대 경제의 문제를 고발한 것이다.","k":[["규모","작","취약","허술"],["유통","경제","시장"],["고발","비판","드러"],["돈","목적","아니"]]},{"n":4,"q":"이용후생의 실학사상","a":"이용후생은 기구와 물자 async function load(){
  // Claude 앱 안에서 열었을 때
  try{
    if(window.storage){
      const r = await window.storage.get(KEY);
      if(r && r.value){ ST = Object.assign(ST, JSON.parse(r.value)); return; }
    }
  }catch(e){}
  // 일반 브라우저(깃허브 페이지 등)에서 열었을 때
  try{
    const v = localStorage.getItem(KEY);
    if(v) ST = Object.assign(ST, JSON.parse(v));
  }catch(e){}
}
function save(){
  const v = JSON.stringify(ST);
  try{ if(window.storage) window.storage.set(KEY, v); }catch(e){}
  try{ localStorage.setItem(KEY, v); }catch(e){}
}

}
function norm(s){ return String(s||"").toLowerCase().replace(/[\s,.\u00b7'"`~!?()\[\]{}<>:;\-–—…·「」『』〈〉]/g,""); }
function gradeBlank(text,q){
  const t = norm(text);
  const ok = t.length>0 && [q.a].concat(q.alt||[]).some(x=>norm(x)===t);
  return {hit: ok?[q.a]:[], miss: ok?[]:[q.a], bad:[], allowed:0, tooShort:false, blank:true, ok};
}
function grade(text,q){
  if(q.a!==undefined && q.k===undefined) return gradeBlank(text,q);
  const t = norm(text), hit=[], miss=[];
  q.k.forEach(g=>{ (g.some(w=>t.includes(norm(w))) ? hit : miss).push(g[0]); });
  const bad = (q.x||[]).filter(w=>w && t.includes(norm(w)));
  const allowed = ST.mode==="strict" ? 0 : (q.k.length>=4 ? 1 : 0);
  const isShort = t.length < 20;
  return {hit,miss,bad,allowed,tooShort:isShort,
          ok: !isShort && !bad.length && miss.length<=allowed};
}

/* ---------- 홈 ---------- */
function home(){
  cur = null;
  const worksDone = WORKS.filter(w=>nDoneAll(w)===nAll(w)).length;
  const qDone = WORKS.reduce((s,w)=>s+nDoneAll(w),0);
  const qAll  = WORKS.reduce((s,w)=>s+nAll(w),0);
  const nEdit = Object.keys(ST.edits||{}).length;

  const rows = WORKS.map(w=>{
    const d = nDoneAll(w), a = nAll(w), full = d===a;
    const open = openId===w.id;
    return '<div class="row'+(full?" done":"")+'">'
      + '<button class="rowhead" data-open="'+w.id+'">'
      +   '<span class="nm"><b>'+w.name+'</b><span>'+w.sub+'</span></span>'
      +   '<span class="frac">'+d+' / '+a+'</span>'
      +   (full?'<span class="mark">通</span>':'')
      + '</button>'
      + '<div class="panel'+(open?" open":"")+'" id="p-'+w.id+'"><div class="panel-in">'
      +   sets().map(x=>setBtn(w,x)).join("")
      + '</div></div>'
      + '<span class="track"><i data-fill="'+(d/a*100)+'"></i></span>'
      + '</div>';
  }).join("");

  const missList = Object.entries(ST.miss).map(([k,v])=>{
    const [wid,set,idx]=k.split(":"); const w=WORKS.find(x=>x.id===wid);
    if(!w||!w[set]||!w[set][+idx]) return null;
    return {w:w.name,set:SETS[set],q:w[set][+idx].q,n:w[set][+idx].n,c:v};
  }).filter(Boolean).sort((a,b)=>b.c-a.c).slice(0,6);

  el("app").innerHTML =
    '<div class="top"><h1>고전소설 연습장</h1>'
    + '<div class="sub">9월 8일 수행평가 · 10작품 · '+qAll+'문항 랜덤</div>'
    + '<div class="by">만든 사람 · 안태현</div></div>'
    + '<div class="hr"></div>'
    + '<div class="tally"><span class="big">'+worksDone+'</span><span class="of">/ '+WORKS.length+' 작품 통과</span>'
    + '<span class="of" style="margin-left:auto">'+qDone+' / '+qAll+' 문항</span></div>'
    + '<div class="rows">'+rows+'</div>'
    + '<div class="nb"><h3>오답 노트</h3><p class="cap">틀린 횟수가 많은 순서예요.</p>'
    + (missList.length
        ? missList.map(m=>'<div class="miss"><span class="n">'+m.c+'회</span><div>'
            +'<em>'+m.w+' · '+m.set+' '+m.n+'번</em>'+esc(m.q)+'</div></div>').join("")
        : '<p class="none">아직 없어요. 작품을 골라 시작해 보세요.</p>')
    + '</div>'
    + '<div class="foot">'
    +   '<select id="style"><option value="essay"'+(ST.style==="essay"?" selected":"")+'>서술형 연습</option>'
    +   '<option value="blank"'+(ST.style==="blank"?" selected":"")+'>빈칸 넣기</option></select>'
    +   '<select id="mode"><option value="normal"'+(ST.mode==="normal"?" selected":"")+'>보통 채점</option>'
    +   '<option value="strict"'+(ST.mode==="strict"?" selected":"")+'>엄격 채점</option></select>'
    +   '<span style="font-size:12px;color:var(--ink-3)">'+(ST.style==="blank"?"빈칸은 정확히 맞아야 통과":(ST.mode==="strict"?"핵심어가 모두 있어야 통과":"핵심어 1개까지 빠져도 통과"))+'</span>'
    +   (nEdit?'<button class="tinybtn" id="dump">고친 답안 '+nEdit+'개 내보내기</button>':'')
    +   '<button class="tinybtn'+(armed?" danger":"")+'" id="wipe" style="margin-left:auto">'
    +   (armed?"정말 지울까요? 한 번 더 누르기":"기록 지우기")+'</button>'
    +   '<div id="dumpbox" style="width:100%"></div>'
    + '</div>';

  requestAnimationFrame(()=>document.querySelectorAll("[data-fill]").forEach(b=>b.style.width=b.dataset.fill+"%"));
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
    openId = openId===b.dataset.open ? null : b.dataset.open; home();
  });
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    const [wid,set]=b.dataset.go.split(":"); start(wid,set);
  });
  el("style").onchange = e=>{ ST.style=e.target.value; openId=null; save(); home(); };
  el("mode").onchange = e=>{ ST.mode=e.target.value; save(); home(); };
  el("wipe").onclick = ()=>{
    if(!armed){ armed=true; home(); setTimeout(()=>{armed=false;},4000); return; }
    ST.passed={}; ST.miss={}; armed=false; save(); home();
  };
  if(el("dump")) el("dump").onclick = ()=>{
    el("dumpbox").innerHTML = '<textarea class="dump" readonly>'
      + esc(JSON.stringify(ST.edits,null,1)) + '</textarea>';
    el("dumpbox").querySelector("textarea").select();
  };
}
function setBtn(w,set){
  const d=nDone(w,set), a=w[set].length;
  return '<button class="pill'+(d===a?" full":"")+'" data-go="'+w.id+':'+set+'">'
    + '<b>'+SETS[set]+'</b><span>'+d+' / '+a+' 통과</span></button>';
}

/* ---------- 풀이 ---------- */
function start(wid,set){
  const w = WORKS.find(x=>x.id===wid);
  let todo = w[set].map((_,i)=>i).filter(i=>!ST.passed[key(w,set,i)]);
  if(!todo.length){ w[set].forEach((_,i)=>delete ST.passed[key(w,set,i)]); todo = w[set].map((_,i)=>i); }
  cur = {w,set,queue:shuffle(todo),total:todo.length,cleared:0};
  ask();
}

function shell(inner){
  const {w,set} = cur;
  const pct = cur.total ? cur.cleared/cur.total*100 : 0;
  el("app").innerHTML =
    '<div class="qtop"><button class="back" id="back">←</button>'
    + '<span class="where">'+w.name+' · '+SETS[set]+'</span>'
    + '<span class="count">'+cur.cleared+' / '+cur.total+'</span></div>'
    + '<div class="pbar"><i style="width:'+pct+'%"></i></div>'
    + '<div class="fade">'+inner+'</div>';
  el("back").onclick = ()=>{ openId=cur.w.id; home(); };
}

function ask(){
  if(!cur.queue.length) return finish();
  const {w,set} = cur, i = cur.queue[0], q = getQ(w,set,i);
  const isB = set==="blank";
  shell(
    '<p class="q">'+esc(q.q)+'</p>'
    + (isB
        ? '<input id="ans" class="fill" placeholder="빈칸에 들어갈 말" autocomplete="off">'
        : '<textarea id="ans" placeholder="두 문장 정도로 써 보세요."></textarea>')
    + '<div class="actions"><button class="btn" id="go">채점하기</button></div>'
    + '<p class="hint">'+SETS[set]+' '+q.n+'번 · 남은 문제 '+cur.queue.length+'개</p>'
  );
  const t = el("ans"); t.focus();
  el("go").onclick = check;
  t.onkeydown = e=>{
    if(e.key==="Enter" && (isB || e.metaKey || e.ctrlKey)){ e.preventDefault(); check(); }
  };
}

function check(){
  const i = cur.queue[0];
  cur.last = {i, mine: el("ans").value};
  apply(grade(cur.last.mine, getQ(cur.w,cur.set,i)).ok, true);
}

/* ok=통과 여부, auto=자동 채점 결과인지 */
function apply(ok, auto){
  const {w,set} = cur, i = cur.last.i, q = getQ(w,set,i), k = key(w,set,i), mine = cur.last.mine;
  const r = grade(mine,q);

  // 이전 판정 되돌리기 (직접 고쳐 누른 경우)
  if(!auto){
    if(cur.last.ok && !ok){ delete ST.passed[k]; cur.cleared=Math.max(0,cur.cleared-1);
      ST.miss[k]=(ST.miss[k]||0)+1; if(!cur.queue.includes(i)) cur.queue=cur.queue.concat([i]); }
    if(!cur.last.ok && ok){ ST.passed[k]=true; cur.cleared++;
      if(ST.miss[k]){ ST.miss[k]--; if(!ST.miss[k]) delete ST.miss[k]; }
      cur.queue=cur.queue.filter(x=>x!==i); }
  }else{
    if(ok){ ST.passed[k]=true; cur.queue=cur.queue.slice(1); cur.cleared++; }
    else{ ST.miss[k]=(ST.miss[k]||0)+1; cur.queue=cur.queue.slice(1).concat([i]); }
  }
  cur.last.ok = ok;
  save();

  const isB = set==="blank";
  const chips = isB ? "" :
      (r.hit.map(x=>'<span class="chip">'+esc(x)+'</span>').join("")
     + r.miss.map(x=>'<span class="chip miss">'+esc(x)+'</span>').join(""));
  let why;
  if(!auto) why = ok ? '직접 맞은 걸로 표시함' : '직접 틀린 걸로 표시함';
  else if(isB) why = ok ? '정확히 맞혔어요' : '뒤에서 다시 나와요';
  else if(ok) why = '핵심어 '+r.hit.length+' / '+q.k.length+'개';
  else if(r.bad.length) why = '틀린 표현: ' + r.bad.join(", ");
  else if(r.tooShort) why = '답이 너무 짧아요';
  else why = '빠진 핵심어 '+r.miss.length+'개 · 뒤에서 다시 나와요';

  shell(
    '<div class="verdict'+(ok?"":" no")+'"><h2>'+(ok?"통과":"다시")+'</h2><p>'+why+'</p></div>'
    + '<p class="q" style="font-size:16.5px;margin:16px 0 0">'+esc(q.q)+'</p>'
    + '<div class="chips">'+chips+'</div>'
    + '<p class="sect">내가 쓴 답</p><div class="mine">'+esc(mine||"(빈칸)")+'</div>'
    + '<p class="sect">'+(isB?"정답":"예시 답안")+'</p><div class="model">'+esc(q.a)
    +   (isB && (q.alt||[]).length ? '<span class="alt"> (허용: '+esc(q.alt.join(", "))+')</span>' : '')
    + '</div>'
    + '<div class="judge"><p class="ask">핵심어만 보고 매긴 점수예요. 예시 답안과 뜻이 같은지 직접 확인해 주세요.</p>'
    +   '<div class="set">'
    +     '<button class="flip'+(ok?" on":"")+'" data-flip="1">맞은 걸로 하기</button>'
    +     '<button class="flip warn'+(ok?"":" on")+'" data-flip="0">틀린 걸로 하기</button>'
    +     '<button class="flip small" id="edit">답안 고치기</button>'
    +   '</div></div>'
    + '<div class="actions"><button class="btn" id="next">'+(cur.queue.length?"다음 문제":"마치기")+'</button></div>'
  );
  document.querySelectorAll("[data-flip]").forEach(b=>b.onclick=()=>{
    const v = b.dataset.flip==="1";
    if(v!==cur.last.ok) apply(v,false);
  });
  if(el("edit")) el("edit").onclick = ()=>editor(i);
  el("next").onclick = ask;
  window.scrollTo(0,0);
}

/* ---------- 답안 고치기 ---------- */
function editor(i){
  const {w,set} = cur, q = getQ(w,set,i), k = key(w,set,i), edited = !!ST.edits[k];
  shell(
    '<div class="ed">'
    + '<p class="q" style="font-size:16.5px;margin:8px 0 0">'+esc(q.q)+'</p>'
    + '<label>예시 답안</label><textarea class="a" id="e-a">'+esc(q.a)+'</textarea>'
    + '<label>핵심어 — 한 줄에 한 개. 같은 뜻으로 인정할 말은 쉼표로 나열</label>'
    + '<textarea class="k" id="e-k">'+esc(q.k.map(g=>g.join(", ")).join("\n"))+'</textarea>'
    + '<label>이 말이 있으면 무조건 오답 — 쉼표로 나열 (비워도 됨)</label>'
    + '<textarea class="x" id="e-x">'+esc((q.x||[]).join(", "))+'</textarea>'
    + '<p class="note">예: 나무를 해 오는 조건인데 “숲을 베어”라고 쓰면 틀리게 하고 싶다면 여기에 <b>숲을 베어</b>를 넣으세요.</p>'
    + '<div class="actions"><button class="btn" id="e-save">저장</button>'
    +   '<button class="btn line" id="e-cancel">취소</button></div>'
    + (edited?'<div class="actions" style="margin-top:8px"><button class="btn line" id="e-undo">원래 답안으로 되돌리기</button></div>':'')
    + '</div>'
  );
  el("e-save").onclick = ()=>{
    const a = el("e-a").value.trim();
    const ks = el("e-k").value.split("\n").map(l=>l.split(",").map(s=>s.trim()).filter(Boolean)).filter(g=>g.length);
    const xs = el("e-x").value.split(",").map(s=>s.trim()).filter(Boolean);
    if(!a || !ks.length){ el("e-a").focus(); return; }
    ST.edits[k] = {a, k:ks, x:xs};
    save();
    if(cur.last && cur.last.i===i) apply(grade(cur.last.mine,getQ(w,set,i)).ok, true); else ask();
  };
  el("e-cancel").onclick = ()=>{ if(cur.last && cur.last.i===i) apply(cur.last.ok,false); else ask(); };
  if(edited) el("e-undo").onclick = ()=>{ delete ST.edits[k]; save();
    if(cur.last && cur.last.i===i) apply(grade(cur.last.mine,getQ(w,set,i)).ok, true); else ask(); };
}

function finish(){
  const {w,set} = cur;
  const whole = nDoneAll(w)===nAll(w);
  openId = w.id;
  home();
  const v = document.createElement("div");
  v.className = "veil";
  v.innerHTML = '<div class="card"><div class="seal">'+(whole?"通":"半")+'</div>'
    + '<h3>'+w.name+(whole?" 통과":" · "+SETS[set]+" 완료")+'</h3>'
    + '<p>'+(whole?"줄거리와 이론을 모두 맞혔어요.":"남은 "+SETS[set==="story"?"theory":"story"]+" 문제도 풀어 보세요.")+'</p>'
    + '<button class="btn" id="ok">목록으로</button></div>';
  document.body.appendChild(v);
  v.querySelector("#ok").onclick = ()=>v.remove();
}

load().then(home);
</script>
</body>
