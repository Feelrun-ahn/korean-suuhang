<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고전소설 연습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfbf9; --ink:#16191d; --ink-2:#5c6169; --ink-3:#9aa0a8;
  --rule:#e4e4de; --rule-2:#f0f0ea; --mark:#b03a2b; --mark-bg:#faefec; --ok-bg:#eef1ee;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  font-size:15px;line-height:1.62;letter-spacing:-.1px}
.wrap{max-width:620px;margin:0 auto;padding:0 20px 56px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px}

.top{padding:26px 0 14px}
.top h1{font-family:"Noto Serif KR",serif;font-weight:600;font-size:21px;margin:0;letter-spacing:-.6px}
.top .sub{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.top .by{font-size:10.5px;color:var(--ink-3);margin-top:6px}
.hr{height:1px;background:var(--rule)}
.tally{display:flex;align-items:baseline;gap:6px;padding:14px 0 4px}
.tally .big{font-family:"Noto Serif KR",serif;font-size:26px;font-weight:600;line-height:1}
.tally .of{font-size:13px;color:var(--ink-3)}

.allbox{display:flex;gap:8px;margin:14px 0 4px}
.allbtn{flex:1;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;
  padding:12px 13px;text-align:left;transition:opacity .15s}
.allbtn:active{opacity:.85}
.allbtn b{display:block;font-size:13.5px;font-weight:500}
.allbtn span{font-size:11.5px;opacity:.7;font-variant-numeric:tabular-nums}
.rows{margin-top:8px}
.row{border-top:1px solid var(--rule-2);position:relative}
.row:first-child{border-top:1px solid var(--rule)}
.rowhead{width:100%;background:none;border:0;padding:15px 0;display:flex;align-items:center;gap:14px;text-align:left}
.rowhead .nm{flex:1;min-width:0}
.rowhead .nm b{font-family:"Noto Serif KR",serif;font-size:17px;font-weight:600;display:block;letter-spacing:-.3px}
.rowhead .nm span{font-size:11.5px;color:var(--ink-3)}
.frac{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.done .frac{color:var(--ink)}
.mark{flex:none;width:26px;height:26px;border:1.5px solid var(--mark);border-radius:4px;
  display:grid;place-items:center;color:var(--mark);font-family:"Noto Serif KR",serif;font-size:14px;font-weight:600}
.track{position:absolute;left:0;bottom:0;height:1.5px;width:100%}
.track i{display:block;height:100%;background:var(--ink);width:0;transition:width .5s cubic-bezier(.4,0,.2,1)}

.panel{overflow:hidden;max-height:0;transition:max-height .28s cubic-bezier(.4,0,.2,1)}
.panel.open{max-height:200px}
.panel-in{padding:2px 0 16px;display:flex;gap:8px}
.pill{flex:1;border:1px solid var(--rule);background:#fff;border-radius:7px;padding:10px 12px;text-align:left;transition:border-color .15s}
.pill:hover{border-color:var(--ink-3)}
.pill.full{background:var(--ok-bg)}
.pill b{display:block;font-size:13.5px;font-weight:500}
.pill span{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.qtop{display:flex;align-items:center;gap:10px;padding:20px 0 12px}
.back{background:none;border:0;padding:4px 8px 4px 0;color:var(--ink-2);font-size:19px;line-height:1}
.qtop .where{flex:1;font-size:12.5px;color:var(--ink-3)}
.qtop .count{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pbar{height:2px;background:var(--rule-2)}
.pbar i{display:block;height:100%;background:var(--ink);transition:width .4s cubic-bezier(.4,0,.2,1)}
.fade{animation:fade .22s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}

.q{font-family:"Noto Serif KR",serif;font-size:19px;line-height:1.62;margin:26px 0 20px;letter-spacing:-.3px}
.q.small{font-size:16.5px;line-height:1.7}
.q .gap{color:var(--mark);font-weight:600}
textarea{width:100%;min-height:170px;padding:14px;font:inherit;font-size:15.5px;line-height:1.7;
  border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink);resize:vertical;transition:border-color .15s}
input.fill{width:100%;padding:14px;font:inherit;font-size:18px;font-family:"Noto Serif KR",serif;
  border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink);transition:border-color .15s}
textarea::placeholder,input.fill::placeholder{color:var(--ink-3)}
textarea:focus,input.fill:focus{outline:none;border-color:var(--ink)}
.actions{margin-top:12px;display:flex;gap:8px}
.btn{flex:1;padding:13px;border:1px solid var(--ink);border-radius:8px;background:var(--ink);color:#fff;font-size:15px;font-weight:500;transition:opacity .15s}
.btn:active{opacity:.8}
.btn.line{background:transparent;color:var(--ink-2);border-color:var(--rule);font-weight:400}
.hint{font-size:11.5px;color:var(--ink-3);text-align:center;margin-top:10px}

.verdict{display:flex;align-items:baseline;gap:9px;margin:22px 0 4px}
.verdict h2{font-family:"Noto Serif KR",serif;font-size:22px;font-weight:600;margin:0;letter-spacing:-.5px}
.verdict.no h2{color:var(--mark)}
.verdict p{margin:0;font-size:12.5px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.chip{font-size:12px;padding:3.5px 9px;border-radius:13px;border:1px solid var(--rule);color:var(--ink-2)}
.chip.miss{border-color:var(--mark);background:var(--mark-bg);color:var(--mark);font-weight:500}
.sect{font-size:11.5px;color:var(--ink-3);margin:22px 0 6px}
.model{font-family:"Noto Serif KR",serif;font-size:15.5px;line-height:1.78;border-left:2px solid var(--ink);padding:2px 0 2px 14px}
.model .alt{font-family:"Noto Sans KR",sans-serif;font-size:12.5px;color:var(--ink-3)}
.mine{font-size:14px;color:var(--ink-2);white-space:pre-wrap;padding:2px 0 2px 14px;border-left:2px solid var(--rule)}

.judge{margin-top:18px;padding-top:13px;border-top:1px solid var(--rule-2)}
.judge .ask{font-size:12.5px;color:var(--ink-2);margin:0 0 9px}
.judge .set{display:flex;gap:8px;flex-wrap:wrap}
.flip{padding:8px 13px;border:1px solid var(--rule);border-radius:20px;background:#fff;font-size:12.5px;color:var(--ink-2);transition:border-color .15s,color .15s}
.flip.on{border-color:var(--ink);color:var(--ink);font-weight:500}
.flip.warn.on{border-color:var(--mark);color:var(--mark)}
.flip.small{font-size:12px;padding:7px 11px}

.ed label{display:block;font-size:11.5px;color:var(--ink-3);margin:16px 0 5px}
.ed textarea.a{min-height:110px}
.ed textarea.k{min-height:130px;font-size:14px;line-height:1.75}
.ed textarea.x{min-height:56px;font-size:14px}
.ed .note{font-size:11.5px;color:var(--ink-3);line-height:1.6;margin:5px 0 0}
.dump{width:100%;min-height:120px;font-size:11px;font-family:ui-monospace,monospace;margin-top:10px;
  border:1px solid var(--rule);border-radius:7px;padding:10px;background:#fff;color:var(--ink-2)}

.nb{margin-top:34px}
.nb h3{font-family:"Noto Serif KR",serif;font-size:15px;font-weight:600;margin:0 0 2px}
.nb .cap{font-size:12px;color:var(--ink-3);margin:0 0 8px}
.miss{display:flex;gap:11px;padding:10px 0;border-top:1px solid var(--rule-2);font-size:13.5px;line-height:1.5}
.miss .n{flex:none;font-size:11.5px;color:var(--mark);font-variant-numeric:tabular-nums;padding-top:2px;min-width:26px}
.miss em{display:block;font-style:normal;font-size:11px;color:var(--ink-3)}
.none{font-size:13px;color:var(--ink-3);padding:8px 0}
.foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tinybtn{background:none;border:0;padding:4px 0;font-size:12.5px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
.tinybtn.danger{color:var(--mark)}
select{font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink-2)}

.veil{position:fixed;inset:0;background:rgba(22,25,29,.5);display:grid;place-items:center;padding:26px;z-index:40;animation:fade .2s ease both}
.card{background:var(--bg);border-radius:12px;padding:32px 26px 24px;text-align:center;max-width:320px;width:100%}
.seal{width:104px;height:104px;margin:0 auto 18px;border:5px solid var(--mark);border-radius:10px;
  display:grid;place-items:center;color:var(--mark);font-family:"Noto Serif KR",serif;font-weight:600;font-size:50px;
  animation:stamp .42s cubic-bezier(.2,1.5,.45,1) both}
@keyframes stamp{0%{transform:scale(1.7) rotate(-12deg);opacity:0}55%{transform:scale(.95) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(-2.5deg);opacity:1}}
.card h3{font-family:"Noto Serif KR",serif;font-size:19px;font-weight:600;margin:0 0 5px}
.card p{font-size:13px;color:var(--ink-3);margin:0 0 20px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DATA = {"works":[{"id":"bari","name":"바리데기","story":[{"n":1,"q":"바리데기가 태어나자마자 버려지게 된 원인과 구해지는 과정을 쓰시오.","a":"오구대왕과 길대부인은 아들을 원했으나 일곱째로 또 다시 딸(바리데기)를 낳는다. 분노한 오구대왕은 일곱째 딸을 강물에 버린다. 이후 바리데기는 노부부(바리공덕할미와 바리공덕할아비)에게 발견되어 목숨을 건지고 이들에게 양육된다.","k":[["아들"],["일곱째","일곱 째"],["강물","버"],["노부부","바리공덕"],["양육","목숨"]]},{"n":2,"q":"바리데기가 서천서역국으로 목숨을 건 여정을 떠나게 된 계기를 쓰시오.","a":"오구대왕과 길대부인은 바리데기를 버린 죄로 중병에 걸린다. 꿈에 청의동자가 나타나 신선세계의 약려수를 마셔야 병이 고쳐질 수 있다고 알린다. 여섯 언니는 위험하다며 거절하지만 바리데기는 자신을 버린 부모임에도 불구하고 효심으로 약수를 구하러 가겠다고 자원한다.","k":[["중병","병"],["청의동자","꿈"],["약려수"],["여섯","언니","거절"],["효심","자원"]]},{"n":3,"q":"바리데기가 서천서역국으로 가는 길에서 겪은 일을 두 가지 이상 쓰시오.","a":"바리데기는 지옥과 저승의 온갖 난관을 헤치고 나아가던 중 석가세존을 만난다. 석가세존은 남장을 한 바리데기가 여자임을 알아챈다. 바리데기의 효심에 감동한 석가세존은 약려수가 있는 서천서역국으로 가는 길을 알려주고 나화(비단꽃)를 선물로 준다. 바리데기는 지옥에서 고통받는 억울한 중생들을 구원하며 나아간다.","k":[["지옥","저승"],["석가세존"],["남장","여자"],["나화","비단꽃"],["중생","구원"]]},{"n":4,"q":"바리데기가 약려수를 얻기 위해 무장신선에게 제시받은 조건과 수행한 내용.","a":"서천서역국에 도착한 바리데기는 약수를 지키는 무장신선을 만나고 약려수를 받기 위해 나무하기 3년, 불 때기 3년, 물 긷기 3년의 노동을 한다. 바리데기는 무장신선과 결혼하고 아들 일곱을 낳아 약려수를 얻는다.","k":[["무장신선"],["나무"],["불"],["물"],["3년","삼년","9년"],["일곱","아들","결혼"]]},{"n":5,"q":"약려수를 가지고 돌아온 바리데기가 부모를 다시 살려내는 과정을 쓰시오.","a":"오구대왕과 길대부인은 이미 죽어 상여가 나가고 있다. 바리데기가 상여를 멈추고 약려수로 살려낸다. (약려수와 살살이꽃, 피살이꽃, 숨살이꽃을 가지고 돌아온 바리데기는 이미 부모의 상여를 멈추게 하고 부모의 시신의 뼈와 살, 피를 살려낸다. 마지막으로 약려수를 입에 넣자 오구대왕다시 살아난다.)","k":[["상여"],["약려수"],["멈추"],["살려","살아"]]},{"n":6,"q":"부모를 구한 후 바리데기가 왕의 보상을 사양하고 어떤 존재가 되었는지 쓰시오.","a":"바리데기는 죽은 사람을 저승으로 인도하는 오구신이 된다.","k":[["죽은"],["저승","인도"],["오구신"]]},{"n":7,"q":"전체적인 줄거리를 '출생과 버려짐', '서천서역국 여정과 부모 구원', '신으로의 좌정(결말)' 단계로 각각 한 문장씩 서술하시오.","a":"오구대왕의 일곱째 딸로 태어난 바리데기는 딸이라는 이유로 버려졌으나, 부모가 병에 걸리자 약을 구하기 위해 길을 떠난다. 온갖 시련을 극복하고 서천서역국에서 약려수를 얻어와 죽은 부모를 살려낸다. 바리데기는 죽은 영혼을 저승으로 인도하는 오구신이 된다.","k":[["일곱째","버려"],["서천서역국","약려수"],["부모","살려"],["오구신"]]}],"blank":[{"n":"1-①","disp":"설화는 오랫동안 (   )되어 온 이야기를 말하며 신화, 전설, 민담으로 나눌 수 있다. 추후 설화가 문자로 정착되어 문학적 형태를 가지면서 설화문학이라고 일컫기 시작했다.","a":"구전","alt":[]},{"n":"1-②","disp":"설화는 오랫동안 구전되어 온 이야기를 말하며 ,{"n":"7-③","disp":"〈바리데기〉가 겪은 9년의 노동과 자식 일곱명의 (   )은 여성이 겪어야 했던 과중한 가사 노동, 또는 여성의 출산의 고통을 상징한다.","a":"출산","alt":[]}]},{"id":"guk","name":"국선생전","story":[{"n":1,"q":"'국성(술)'의 가계와 조정에 등용되는 계기","a":"국성의 증조는 역사에 이름을 남긴 적이 없고, 조부 '모'는 주천으로 옮겨 가 그곳 사람이 되었다. 아버지 '차'에 이르러 비로소 벼슬길에 올랐고, 사농경 곡 씨의 딸과 결혼해 '국성'을 낳는다. 이후 삼정승과 육판서가 국성을 천거했고, 임금은 국성에게 여러 벼슬을 겸직하게 했다.","k":[["모","조부"],["주천"],["차","아버지"],["곡","사농경"],["삼정승","육판서","천거"]]},{"n":2,"q":"국성이 조정에 들어가 임금의 총애를 받으며 행한 역할은","a":"궁에는 교자를 타고 출입하며 이름 대신 국 선생으로 불리었으며, 임금을 알현하는 예식이나 제사, 천식, 진작을 담당하고 승정원 재상으로 승진한다.","k":[["교자"],["국 선생","국선생"],["제사","천식","진작"],["승정원","재상"]]},{"n":3,"q":"국성의 자식들이 일으킨 문제와 이로 인해 국성이 겪게 되는 시련","a":"국성의 자식은 혹(독한 술), 폭(진한 술), 역(쓴 술)으로 아버지를 믿고 오만방자하게 굴다가 중서령 모영(붓)이 임금에게 상소를 올렸고, 결국 아들 셋은 스스로 독약을 마셨다. 국성도 벌을 받아 서인으로 강등된다.","k":[["혹","폭","역"],["오만방자","방자"],["모영"],["상소"],["독약"],["서인"]]},{"n":4,"q":"국성이 관직에서 물러난 후 임금이 다시 국성을 찾게 된 이유","a":"국성이 벼슬을 그만두자 제(배꼽) 고을과 격(가슴) 고을에 도둑이 떼 지어 일어난다. 임금이 도둑을 토벌하라는 어명을 내리나 적임자를 쉽게 찾지 못했다. 결국 다시 국성을 기용한다.","k":[["제","격"],["도둑","도적"],["적임자"],["기용","다시"]]},{"n":5,"q":"국성이 국가의 위기를 극복하는 과정과 그 공로","a":"국성은 군사들을 엄하게 통솔하고 모든 고생을 군사들과 함께한다. 수성(근심)에 물을 대어 한판 싸움으로 이를 함락한다. 임금은 그 공로로 성을 상동후에 봉한다.","k":[["군사","통솔"],["수성"],["함락"],["상동후"]]},{"n":6,"q":"국성이 권력에 연연하지 않고 관직에서 물러나는 과정과 그 의미","a":"때가 되면 넘어진다는 것은 만물의 이치로, 목숨이 소갈증으로 위태로우니 물러나 여생을 보내고자 함. 임금은 사람을 보내 국성의 병을 돌보게 하지만 성은 끝내 사양하고 마침내 고향에 돌아가 천수를 다한다.","k":[["만물","이치"],["소갈증"],["사양"],["고향","천수"]]},{"n":7,"q":"국성에 대한 사신의 평가","a":"국성은 유독 덕이 많고 재주가 맑아 임금의 국정을 돕고 마음을 흐뭇하게 함. 하지만 임금의 총애가 지나쳐 나라의 기강을 어지럽혔으니 결국 그 화가 자손에까지 미쳤다. 그러나 만년에는 자기 분수를 알고 스스로 물러나 천수를 다했다.며 대체로 긍정적으로 평가함.","k":[["덕","재주"],["총애","기강"],["자손","화"],["분수","물러"],["긍정"]]}],"blank":[{"n":"1-①","disp":"가전은 사물을 화자로 내세운 설화 문학의 한 형태로, 고려 때 (   )들에 의해 발달했다. 가전은 독자에게 교훈이나 경계심을 주기 위해 창작된 경우가 많다. 주인공의 행적을 따라 읽다 보면 이야기 속에 숨겨진 진짜 주제를 알 수 있기 때문에 풍자적인 성격을 지닌 갈래라고도 말할 수 있다.","a":"신진 사대부","alt":["신진사대부","사대부"]},{"n":"1-②","disp":"가전은 사물을 화자로 내세운 설화 문학의 한 형태로, 고려 때 신진 사대부들에 의해 발달했다. 가전은 독자에게 (   )이나 경계심을 주기 위해 창작된 경우가 많다. 주인공의 행적을 따라 읽다 보면 이야기 속에 숨겨진 진짜 주제를 알 수 있기 때문에 풍자적인 성격을 지닌 갈래라고도 말할 수 있다.","a":"교훈","alt":[]},{"n":"1-③","disp":"가전은 사물을 화자로 내세운 설화 문학의 한 형태로, 고려 때 신진 사대부들에 의해 발달했다. 가전은 독자에게 교훈이나 경계심을 주기 위해 창작된 경우가 많다. 주인공의 행적을 따라 읽다 보면 이야기 속에 숨겨진 진짜 주제를 알 수 있기 때문에 (   )인 성격을 지닌 갈래라고도 말할 수 있다.","a":"풍자적","alt":["풍자"]},{"n":"2","disp":"〈국선생전〉의 작가는 고려 시대 동지공거, 수태보 문하시랑평장사 등을 역임한 문신이자 학자인 (   )이다.","a":"이규보","alt":[]},{"n":"3-①","disp":"국성의 가계를 설명하는 부분은 (   )(모)가 술(차)로 변화하는 과정을 표현한 것이다. 또한, 국성의 성이 누룩을 뜻하는 국 씨임을 고려하면, 발효의 매개체인 누룩이 곡식(곡)을 만나 술이 되는 과정을 나타냈다고 볼 수 있다.","a":"보리","alt":[]},{"n":"3-②","disp":"국성의 가계를 설명하는 부분은 보리(모)가 술(차)로 변화하는 과정을 표현한 것이다. 또한, 국성의 성이 (   )을 뜻하는 국 씨임을 고려하면, 발효의 매개체인 누룩이 곡식(곡)을 만나 술이 되는 과정을 나타냈다고 볼 수 있다.","a":"누룩","alt":[]},{"n":"3-③","disp":"국성의 가계를 설명하는 부분은 보리(모)가 술(차)로 변화하는 과정을 표현한 것이다. 또한, 국성의 성이 누룩을 뜻하는 국 씨임을 고려하면, 발효의 매개체인 누룩이 (   )(곡)을 만나 술이 되는 과정을 나타냈다고 볼 수 있다.","a":"곡식","alt":[]},{"n":"4-①","disp":"임금이 국성을 국 선생으로 예우한 까닭은 (   )이 매우 깊은 국성은 신하로서 충직한 모범을 보였기 때문에 임금이 그를 '국 선생'이라고 불렀다.","a":"도량","alt":[]},{"n":"4-②","disp":"임금이 국성을 국 선생으로 예우한 까닭은 도량이 매우 깊은 국성은 신하로서 (   )한 모범을 보였기 때문에 임금이 그를 '국 선생'이라고 불렀다.","a":"충직","alt":[]},{"n":"5-①","disp":"가전이 등장한 당시의 시대상은 사회적으로 혼란이 가중되었던 (   )에 등장했다. 당시 고려는 무신 정변 이후 몽골의 침입까지 겹치자 나라 안팎으로 몹시 혼란스러웠다. 이로 인해 도덕의식의 부재가 사회 문제로 떠올랐다.","a":"고려 중엽","alt":["중엽"]},{"n":"5-②","disp":"가전이 등장한 당시의 시대상은 사회적으로 혼란이 가중되었던 고려 중엽에 등장했다. 당시 고려는 (   ) 이후 몽골의 침입까지 겹치자 나라 안팎으로 몹시 혼란스러웠다. 이로 인해 도덕의식의 부재가 사회 문제로 떠올랐다.","a":"무신 정변","alt":["무신정변"]},{"n":"5-③","disp":"가전이 등장한 당시의 시대상은 사회적으로 혼란이 가중되었던 고려 중엽에 등장했다. 당시 고려는 무신 정변 이후 (   )의 침입까지 겹치자 나라 안팎으로 몹시 혼란스러웠다. 이로 인해 도덕의식의 부재가 사회 문제로 떠올랐다.","a":"몽골","alt":[]},{"n":"5-④","disp":"가전이 등장한 당시의 시대상은 사회적으로 혼란이 가중되었던 고려 중엽에 등장했다. 당시 고려는 무신 정변 이후 몽골의 침입까지 겹치자 나라 안팎으로 몹시 혼란스러웠다. 이로 인해 (   )의 부재가 사회 문제로 떠올랐다.","a":"도덕의식","alt":["도덕 의식"]},{"n":"6-①","disp":"〈국선생〉에 나타난 (   ) 요소는 첫째, 술이라는 실제 사물에 관해 이야기한다. 둘째, 술의 양면성을 통해 교훈을 전달한다. 이때 작가와 서술자는 같은데, 작가의 주장이 사신의 입을 통해 우회적으로 드러난다.","a":"교술적","alt":["교술"]},{"n":"6-②","disp":"〈국선생〉에 나타난 교술적 요소는 첫째, 술이라는 실제 사물에 관해 이야기한다. 둘째, 술의 (   )을 통해 교훈을 전달한다. 이때 작가와 서술자는 같은데, 작가의 주장이 사신의 입을 통해 우회적으로 드러난다.","a":"양면성","alt":[]},{"n":"6-③","disp":"〈국선생〉에 나타난 교술적 요소는 첫째, 술이라는 실제 사물에 관해 이야기한다. 둘째, 술의 양면성을 통해 교훈을 전달한다. 이때 작가와 서술자는 같은데, 작가의 주장이 (   )의 입을 통해 우회적으로 드러난다.","a":"사신","alt":[]},{"n":"6-④","disp":"〈국선생〉에 나타난 교술적 요소는 첫째, 술이라는 실제 사물에 관해 이야기한다. 둘째, 술의 양면성을 통해 교훈을 전달한다. 이때 작가와 서술자는 같은데, 작가의 주장이 사신의 입을 통해 (   )으로 드러난다.","a":"우회적","alt":["우회"]},{"n":"7-①","disp":"가전과 소설은 모두 작가가 창의력을 발휘해 쓴 (   )의 이야기이다. 산문 문학 형식이며, 인물들이 사건을 통해 갈등을 빚는 내용으로 이루어진다. 가전의 주인공이 의인화된 동식물이나 사물인 반면, 소설의 주인공은 주로 사람이다. 가전은 교술적 성격이 더 강하지만 소설은 서사적 성격이 더 강하다. 또한 가전은 전기처럼 일대기적인 형식이 대부분이고, 소설은 있는 그대로를 나열하는 것이 아니라 문학적 형상화를 통해 내용을 전개한다. 가전은 소설에 비해 전개나 구성이 유기적이지 못하다. 가전에서는 사건이 서로 맞물리며 전개되기보다는 의인화된 인물의 내력, 속성, 가치 등에 초점을 두고 이야기가 펼쳐진다. 한편 소설에서는 다양한 사건이 유기적으로 연결되며 이야기가 흘러간다.","a":"허구","alt":[]},{"n":"7-②","disp":"가전과 소설은 모두 작가가 창의력을 발휘해 쓴 허구의 이야기이다. 산문 문학 형식이며, 인물들이 사건을 통해 갈등을 빚는 내용으로 이루어진다. 가전의 주인공이 (   ) 동식물이나 사물인 반면, 소설의 주인공은 주로 사람이다. 가전은 교술적 성격이 더 강하지만 소설은 서사적 성격이 더 강하다. 또한 가전은 전기처럼 일대기적인 형식이 대부분이고, 소설은 있는 그대로를 나열하는 것이 아니라 문학적 형상화를 통해 내용을 전개한다. 가전은 소설에 비해 전개나 구성이 유기적이지 못하다. 가전에서는 사건이 서로 맞물리며 전개되기보다는 의인화된 인물의 내력, 속성, 가치 등에 초점을 두고 이야기가 펼쳐진다. 한편 소설에서는 다양한 사건이 유기적으로 연결되며 이야기가 흘러간다.","a":"의인화된","alt":["의인화"]},{"n":"7-③","disp":"가전과 소설은 모두 작가가 창의력을 발휘해 쓴 허구의 이야기이다. 산문 문학 형식이며, 인물들이 사건을 통해 갈등을 빚는 내용으로 이루어진다. 가전의 주인공이 의인화된 동식물이나 사물인 반면, 소설의 주인공은 주로 사람이다. 가전은 (   ) 성격이 더 강하지만 소설은 서사적 성격이 더 강하다. 또한 가전은 전기처럼 일대기적인 형식이 대부분이고, 소설은 있는 그대로를 나열하는 것이 아니라 문학적 형상화를 통해 내용을 전개한다. 가전은 소설에 비해 전개나 구성이 유기적이지 못하다. 가전에서는 사건이 서로 맞물리며 전개되기보다는 의인화된 인물의 내력, 속성, 가치 등에 초점을 두고 이야기가 펼쳐진다. 한편 소설에서는 다양한 사건이 유기적으로 연결되며 이야기가 흘러간다.","a":"교술적","alt":["교술"]},{"n":"7-④","disp":"가전과 소설은 모두 작가가 창의력을 발휘해 쓴 허구의 이야기이다. 산문 문학 형식이며, 인물들이 사건을 통해 갈등을 빚는 내용으로 이루어진다. 가전의 주인공이 의인화된 동식물이나 사물인 반면, 소설의 주인공은 주로 사람이다. 가전은 교술적 성격이 더 강하지만 소설은 (   ) 성격이 더 강하다. 또한 가전은 전기처럼 일대기적인 형식이 대부분이고, 소설은 있는 그대로를 나열하는 것이 아니라 문학 가 부모의 유골을 거두어 합장해 드리고, 최랑이 알려준 장소에서 묻혀 있던 재물을 찾아 조상의 제사를 정성껏 지낸다.","k":[["환신","귀신"],["함께","살"],["유골","합장"],["재물","제사"]]},{"n":6,"q":"환귀한 최랑과 이생이 결국 다시 이별하게 된 이유와 이별의 과정을 서술하시오.","a":"이생과 최랑은 수년간 행복한 시간을 보내지만, 더 이상 이승에 머무를 수 없는 순간이 찾아온다. 최랑은 자신이 이미 죽은 사람이기 때문에 명부의 법도를 어길 수 없어 저승으로 돌아가야 한다며 이별을 고한다. 최랑은 이생에게 자신의 유골을 거두어 장사 지내 달라는 부탁을 남기고 눈물을 흘리며 사라진다.","k":[["이승","머무"],["명부","법도"],["이별"],["유골","장사"],["사라"]]},{"n":7,"q":"최랑이 떠난 후 이생의 삶과 이 작품이 전달하고자 하는 핵심 주제를 서술하시오.","a":"최랑이 떠난 후 이생은 아내를 향한 그리움으로 병을 얻어, 몇 달 만에 세상을 떠나게 된다. 이 작품은 죽음을 초월한 남녀 간의 숭고한 사랑을 다루고 있다. 작가는 전쟁이라는 사회적 폭력에 짓밟힌 인간의 비극과 이에 저항하는 순수한 사랑의 의지를 보여준다.","k":[["그리움","병"],["세상을 떠","죽"],["죽음","초월"],["전쟁","폭력","비극"]]}],"blank":[{"n":"1-①","disp":"(   )은 기이한 것을 기록해 전한다는 당나라 소설집에서 유래했으며, 주로 비현실적이거나 비과학적인 환상의 세계를 다룬다. 중국 명나라 구우가 지은 〈전등신화〉의 영향을 받아 김시습이 창작한 한국 최초의 한문 소설집 〈금오신화〉에 수록된 대표적 작품이 바로 〈이생규장전〉이다.","a":"전기 소설","alt":["전기소설"]},{"n":"1-②","disp":"전기 소설은 기이한 것을 기록해 전한다는 당나라 소설집에서 유래했으며, 주로 비현실적이거나 비과학적인 환상의 세계를 다룬다. 중국 명나라 (   )가 지은 〈전등신화〉의 영향을 받아 김시습이 창작한 한국 최초의 한문 소설집 〈금오신화〉에 수록된 대표적 작품이 바로 〈이생규장전〉이다.","a":"구우","alt":[]},{"n":"1-③","disp":"전기 소설은 기이한 것을 기록해 전한다는 당나라 소설집에서 유래했으며, 주로 비현실적이거나 비과학적인 환상의 세계를 다룬다. 중국 명나라 구우가 지은 〈(   )〉의 영향을 받아 김시습이 창작한 한국 최초의 한문 소설집 〈금오신화〉에 수록된 대표적 작품이 바로 〈이생규장전〉이다.","a":"전등신화","alt":[]},{"n":"1-④","disp":"전기 소설은 기이한 것을 기록해 전한다는 당나라 소설집에서 유래했으며, 주로 비현실적이거나 비과학적인 환상의 세계를 다룬다. 중국 명나라 구우가 지은 〈전등신화〉의 영향을 받아 김시습이 창작한 한국 최초의 한문 소설집 〈(   )〉에 수록된 대표적 작품이 바로 〈이생규장전〉이다.","a":"금오신화","alt":[]},{"n":"2-①","disp":"전기 소설은 주로 신선 세계, 천상 세계, 저승 세계, 용궁 세계 등 (   ) 공간을 배경으로 활용한다. 작가가 이러한 세계를 차용한 것은 단순히 흥미 때문이 아니라, 현실의 문제를 간접적으로 비판하거나 작가 자신의 개성을 효과적으로 드러내기 위함이다.","a":"초현실적","alt":["초현실"]},{"n":"2-②","disp":"전기 소설은 주로 신선 세계, 천상 세계, 저승 세계, 용궁 세계 등 초현실적 공간을 배경으로 활용한다. 작가가 이러한 세계를 차용한 것은 단순히 흥미 때문이 아니라, 현실의 문제를 (   )으로 비판하거나 작가 자신의 개성을 효과적으로 드러내기 위함이다.","a":"간접적","alt":["간접"]},{"n":"3-①","disp":"전기 소설의 발달 과정을 살펴보면, (   ) 소설에서 시작하여 명나라의 〈전등신화〉로 이어졌고, 이것이 조선 초기에 유입되어 김시습의 〈금오신화〉 창작에 큰 영향을 미쳤다. 이 중 〈이생규장전〉은 죽은 인물이 등장한다는 점에서 명혼 소설의 전형을 보여준다.","a":"당나라","alt":[]},{"n":"3-②","disp":"전기 소설의 발달 과정을 살펴보면, 당나라 소설에서 시작하여 명나라의 〈전등신화〉로 이어졌고, 이것이 조선 초기에 유입되어 김시습의 〈금오신화〉 창작에 큰 영향을 미쳤다. 이 중 〈이생규장전〉은 죽은 인물이 등장한다는 점에서 (   )의 전형을 보여준다.","a":"명혼 소설","alt":["명혼소설","명혼"]},{"n":"4-①","disp":"고려 (   ) 때 송도(개성)를 배경으로 하는 〈이생규장전〉은 죽은 사람과 인연을 맺는 명혼 소설의 성격을 띤다. 작가 김시습은 작품 속에 시를 자주 삽입하였는데, 이는 인물의 심리를 비유적으로 드러내고 작품 전체에 서정적인 분위기를 자아내는 문학적 효과를 거둔다.","a":"공민왕","alt":[]},{"n":"4-②","disp":"고려 공민왕 때 (   )(개성)를 배경으로 하는 〈이생규장전〉은 죽은 사람과 인연을 맺는 명혼 소설의 성격을 띤다. 작가 김시습은 작품 속에 시를 자주 삽입하였는데, 이는 인물의 심리를 비유적으로 드러내고 작품 전체에 서정적인 분위기를 자아내는 문학적 효과를 거둔다.","a":"송도","alt":["송도(개성)"]},{"n":"4-③","disp":"고려 공민왕 때 송도(개성)를 배경으로 하는 〈이생규장전〉은 죽은 사람과 인연을 맺는 명혼 소설의 성격을 띤다. 작가 김시습은 작품 속에 시를 자주 삽입하였는데, 이는 인물의 (   )를 비유적으로 드러내고 작품 전체에 서정적인 분위기를 자아내는 문학적 효과를 거둔다.","a":"심리","alt":[]},{"n":"4-④","disp":"고려 공민왕 때 송도(개성)를 배경으로 하는 〈이생규장전〉은 죽은 사람과 인연을 맺는 명혼 소설의 성격을 띤다. 작가 김시습은 작품 속에 시를 자주 삽입하였는데, 이는 인물의 심리를 비유적으로 드러내고 작품 전체에 (   )인 분위기를 자아내는 문학적 효과를 거둔다.","a":"서정적","alt":["서정"]},{"n":"5-①","disp":"〈이생규장전〉은 현실적 사건을 다루는 전반부와 비현실적 사건을 다루는 후반부로 나뉜다. 산 자인 이생과 죽은 자인 최랑이 생사를 초월해 함께 지내는 것은 이생과 최랑의 세 번의 가약 중 (   )에 해당하며, 이 작품의 특징인 전기성을 가장 극명하게 보여준다.","a":"세 번째 가약","alt":["세번째 가약","세 번째"]},{"n":"5-②","disp":"〈이생규장전〉은 현실적 사건을 다루는 전반부와 비현실적 사건을 다루는 후반부로 나뉜다. 산 자인 이생과 죽은 자인 최랑이 생사를 초월해 함께 지내는 것은 이생과 최랑의 세 번의 가약 중 세 번째 가약에 해당하며, 이 작품의 특징인 (   )을 가장 극명하게 보여준다.","a":"전기성","alt":[]},{"n":"6-①","disp":"이생과 최랑의 만남은 세 번의 가약으로 이어진다. (   )을 사이에 두고 두 사람이 처음 인연을 맺은 첫 번째 가약과, 양가 부모의 반대를 극복하고 성례를 올린 두 번째 가약, 그리고 홍건적의 난으로 죽은 최랑이 환생하여 인연을 이어간 세 번째 가약을 통해 작품의 서사가 전개된다.","a":"담장","alt":[]},{"n":"6-②","disp":"이생과 최랑의 만남은 세 번의 가약으로 이어진다. 담장을 사이에 두고 두 사람이 처음 인연을 맺은 첫 번째 가약과, 양가 부모의 반대를 극복하고 (   )를 올린 두 번째 가약, 그리고 홍건적의 난으로 죽은 최랑이 환생하여 인연을 이어간 세 번째 가약을 통해 작품의 서사가 전개된다.","a":"성례","alt":[]},{"n":"6-③","disp":"이생과 최랑의 만남은 세 번의 가약으로 이어진다. 담장을 사이에 두고 두 사람이 처음 인연을 맺은 첫 번째 가약과, 양가 부모의 반대를 극복하고 성례를 올린 두 번째 가약, 그리고 홍건적의 난으로 죽은 최랑이 (   )하여 인연을 이어간 세 번째 가약을 통해 작품의 서사가 전개된다.","a":"환생","alt":[]},{"n":"7-①","disp":"최랑이 이생에게 \"저는 이미 (   )에 실려 있어 명부의 법도를 어길 수 없다\"고 말하며 이별을 고하는 대목은 죽음을 초월한 사랑을 나누었음에도 결국 삶과 죽음의 경계는 갈라질 수밖에 없다는 작가의 불교적인 관념을 잘 보여준다.","a":"귀록","alt":[]},{"n":"7-②","disp":"최랑이 이생에게 \"저는 이미 귀록에 실려 있어 (   )의 법도를 어길 수 없다\"고 말하며 이별을 고하는 대목은 죽음을 초월한 사랑을 나누었음에도 결국 삶과 죽음의 경계는 갈라질 수밖에 없다는 작가의 불교적인 관념을 잘 보여준다.","a":"명부","alt":[]},{"n":"7-③","disp":"최랑이 이생에게 \"저는 이미 귀록에 실려 있어 명부의 법도를 어길 수 없다\"고 말하며 이별을 고하는 대목은 죽음을 초월한 사랑을 나누었음에도 결국 삶과 죽음의 경계는 갈라질 수밖에 없다는 작가의 (   )인 관념을 잘 보여준다.","a":"불교적","alt":["불교"]},{"n":"8-①","disp":"부모의 반대에 부딪혔을 때 시골로 내려가 버린 (   ) 이생과 달리, 최랑은 부모를 설득하고 만남과 혼인을 주도하는 적극적인 인물로 그려진다. 작가는 최랑을 통해 당대의 유교적 규율에 얽매이지 않는 진보적인 여성관을 드러내고자 했다. 아울러 시대를 앞서가는 근대적 자유연애 사상도 엿볼 수 있다.","a":"유약한","alt":["유약"]},{"n":"8-②","disp":"부모의 반대에 부딪혔을 때 시골로 내려가 버린 유약한 이생과 달리, 최랑은 부모를 설득하고 만남과 혼인을 주도하는 (   ) 인물로 그려진다. 작가는 최랑을 통해 당대의 유교적 규율에 얽매이지 않는 진보적인 여성관을 드러내고자 했다. 아울러 시대를 앞서가는 근대적 자유연애 사상도 엿볼 수 있다.","a":"적극적인","alt":["적극적"]},{"n":"8-③","disp":"부모의 반대에 부딪혔을 때 시골로 내려가 버린 유약한 이생과 달리, 최랑은 부모를 설득하고 만남과 혼인을 주도하는 적극적인 인물로 그려진다. 작가는 최랑을 통해 당대의 유교적 규율에 얽매이지 않는 진보적인 (   )을 드러내고자 했다. 아울러 시대를 앞서가는 근대적 자유연애 사상도 엿볼 수 있다.","a":"여성관","alt":[]},{"n":"8-④","disp":"부모의 반대에 부딪혔을 때 시골로 내려가 버린 유약한 이생과 달리, 최랑은 부모를 설득하고 만남과 혼인을 주도하는 적극적인 인물로 그려진다. 작가는 최랑을 통해 당대의 유교적 규율에 얽매이지 않는 진보적인 여성관을 드러내고자 했다. 아울러 시대를 앞서가는 근대적 (   ) 사상도 엿볼 수 있다.","a":"자유연애","alt":["자유 연애"]}]},{"id":"hojil","name":"호질","story":[{"n":1,"q":"작품의 도입부에서 호랑이가 어떤 존재로 묘사되며, 먹잇감을 정하기 위해 유자(선비)를 고르는 과정에 대해 서술하시오.","a":"작품 속 호랑이는 지혜롭고 용맹하며 위엄을 갖춘 존재, 인격체처럼 사유하고 판단하는 존재로 의인화되어 나타난다. 호랑이는 저녁거리를 고르며, 의사는 여러 사람에게 시험하여 많은 사람을 죽이고, 무당은 신과 백성을 현혹하여 사람을 많이 죽이니 사람들의 원한 때문에 독이 있다며 제외한다. 선비 역시 억지 이치와 가식 때문에 고기가 잡스럽고 딱딱해 체하거나 토할지도 모른다며 비판한다.","k":[["지혜","용맹","위엄"],["의인화"],["의사","의원"],["무당","현혹"],["선비","가식"]]},{"n":2,"q":"작품에 등장하는 북곽선생과 동리자가 표면적으로 드러내는 평판과 실제 모습의 가식성을 서술하시오.","a":"북곽선생은 학식이 높고 어진 학자로 존경받았으나, 실상은 밤중에 몰래 과부인 동리자의 방을 찾아가는 위선적인 인물이다. 동리자는 현숙하며 절개를 잘 지키는 열녀로 칭송받지만, 성이 다른 다섯 아들을 둘 정도로 정조를 지키지 못하고 문란한 삶을 사는 인물이다.","k":[["북곽","학식","존경"],["동리자","과부","열녀"],["다섯","아들"],["위선","문란"]]},{"n":3,"q":"동리자의 방에 있던 북곽선생이 동리자의 아들들에게 들통나 도망치는 과정과 그 해학적 상황을 서술하시오.","a":"동리자의 아들들은 어머니의 방에서 나는 소리를 듣고 훌륭한 북곽선생일 리가 없으며 여우가 사람으로 둔갑한 것이라 짐작한다. 여우를 죽여 나눠가지려는 다섯 아들이 방으로 쳐들어가자, 북곽선생은 도깨비처럼 춤추고 귀신 웃음소리를 내며 황급히 도망치다가 똥구덩이에 빠지는 우스꽝스러운 꼴을 당한다.","k":[["여우","둔갑"],["다섯","아들","쳐들어"],["도깨비","춤","귀신"],["똥구덩이","똥"]]},{"n":4,"q":"호랑이가 똥통에 빠진 북곽선생을 보고 호랑이와 인간의 행태를 비교하며 인간을 비판한 내용을 3개 이상 쓰시오.","a":"호랑이는 인간이 ①형구(형벌 도구)를 매일 쓰기에 바쁠 정도로 죄를 지으면서도 죄악을 그치지 못하며 ②호랑이가 말·소를 먹으면 원수로 대하며 자신들의 이익에 따라 행동하는 철저한 이기주의를 보이고 ③범은 동족을 해치지 않으나 인간은 동족을 잔인하게 살상하고, ④범은 배가 부르면 탐욕을 부리지 않으나 인간은 다른 생물의 먹이와 옷까지 빼앗는 탐욕을 부린다고 비판한다.","k":[["형구","형벌"],["이기주의","이익"],["동족","살상"],["탐욕"]]},{"n":5,"q":"북곽선생이 자신의 목숨을 구하기 위해 보여준 비굴한 행동을 서술하시오.","a":"겁에 질린 북곽선생은 목숨을 구하기 위해 머리를 조아리며 세 번 절하고 호랑이의 비위를 맞추며 온갖 간사한 말로 아부하며 목숨을 구걸하는 비굴한 태도를 보인다. 호랑이를 \"호랑이님\"이라고 칭하고 자신은 \"궁벽한 땅의 천한 신민은 저 아래 밑바닥에 있다\"며 구차한 아부를 일삼는다.","k":[["머리","조아","세 번","절"],["비위","아부"],["구걸","목숨"],["호랑이님","천한 신민"]]},{"n":6,"q":"날이 새자 호랑이가 사라진 후 농부와 만난 북곽선생의 변명과 이 작품이 전달하려는 핵심 주제를 서술하시오.","a":"날이 새자 호랑이는 이미 떠났으나, 북곽선생은 이를 모른 채 계속 머리를 조아리다가 지나가던 농부와 마주친다. 북곽선생은 자신을 발견한 농부에게 하늘과 땅 앞에 스스로를 낮추고 늘 조심하며 살아야 한다는 성인의 가르침을 실천하는 중이라고 뻔뻔하게 둘러대며 위선을 떤다. 이 작품은 조선 양반 계급의 겉과 속이 다른 허위적이고 이중적인 도덕관을 통렬하게 비판하고 풍자하고 있다.","k":[["농부"],["하늘","땅","성인"],["둘러","위선"],["양반","허위","이중","도덕관"]]}],"blank":[{"n":"1-①","disp":"우화 소설은 사람이 아닌 동물이나 식물을 (   )하여 교훈을 나타내거나 세태를 풍자하는 소설이다. 이러한 갈래는 고대의 〈구토설화〉나 〈화왕계〉에서 시작되어 조선 후기의 〈토끼전〉, 〈서옥기〉 등 가전 및 의인 소설로 풍성하게 발전했다.","a":"의인화","alt":["의인"]},{"n":"1-②","disp":"우화 소설은 사람이 아닌 동물이나 식물을 의인화하여 교훈을 나타내거나 세태를 풍자하는 소설이다. 이러한 갈래는 고대의 〈(   )〉나 〈화왕계〉에서 시작되어 조선 후기의 〈토끼전〉, 〈서옥기〉 등 가전 및 의인 소설로 풍성하게 발전했다.","a":"구토설화","alt":["구토 설화"]},{"n":"1-③","disp":"우화 소설은 사람이 아닌 동물이나 식물을 의인화하여 교훈을 나타내거나 세태를 풍자하는 소설이다. 이러한 갈래는 고대의 〈구토설화〉나 〈(   )〉에서 시작되어 조선 후기의 〈토끼전〉, 〈서옥기〉 등 가전 및 의인 소설로 풍성하게 발전했다.","a":"화왕계","alt":[]},{"n":"1-④","disp":"우화 소설은 사람이 아닌 동물이나 식물을 의인화하여 교훈을 나타내거나 세태를 풍자하는 소설이다. 이러한 갈래는 고대의 〈구토설화〉나 〈화왕계〉에서 시작되어 조선 후기의 〈(   )〉, 〈서옥기〉 등 가전 및 의인 소설로 풍성하게 발전했다.","a":"토끼전","alt":[]},{"n":"2-①","disp":"우화 소설은 (   ) 인물을 등장시켜 교훈적 주제를 전달하며, 이를 강조하기 위해 반어, 풍자, 아이러니 등 다채로운 표현 기법을 활용한다.","a":"전형적인","alt":["전형적"]},{"n":"2-②","disp":"우화 소설은 전형적인 인물을 등장시켜 교훈적 주제를 전달하며, 이를 강조하기 위해 (   ), 풍자, 아이러니 등 다채로운 표현 기법을 활용한다.","a":"반어","alt":[]},{"n":"2-③","disp":"우화 소설은 전형적인 인물을 등장시켜 교훈적 주제를 전달하며, 이를 강조하기 위해 반어, 풍자, (   ) 등 다채로운 표현 기법을 활용한다.","a":"아이러니","alt":[]},{"n":"3-①","disp":"연암 (   )이 지은 〈호질〉은 한문 소설이자 대표적인 풍자소설, 우화 소설이다. 작가는 무능하고 위선적인 양반 계급과 부패한 관료들을 통렬히 비판하기 위해 동물의 입을 빌린다.","a":"박지원","alt":["연암 박지원"]},{"n":"3-②","disp":"연암 박지원이 지은 〈호질〉은 한문 소설이자 대표적인 (   ), 우화 소설이다. 작가는 무능하고 위선적인 양반 계급과 부패한 관료들을 통렬히 비판하기 위해 동물의 입을 빌린다.","a":"풍자소설","alt":["풍자 소설"]},{"n":"3-③","disp":"연암 박지원이 지은 〈호질〉은 한문 소설이자 대표적인 풍자소설, (   )이다. 작가는 무능하고 위선적인 양반 계급과 부패한 관료들을 통렬히 비판하기 위해 동물의 입을 빌린다.","a":"우화 소설","alt":["우화소설"]},{"n":"4-①","disp":"작품의 제목인 '호질(虎叱)'은 말 그대로 '(   )'이라는 뜻이다. 유교 사상이 뿌리 깊던 조선 시대에 지배층을 직접 비판하기 어려워, 작가는 위엄 있고 용맹한 호랑이의 입을 빌리는 간접 화법을 사용하여 비판의 효과를 극대화했다.","a":"호랑이의 꾸짖음","alt":["호랑이의꾸짖음"]},{"n":"4-②","disp":"작품의 제목인 '호질(虎叱)'은 말 그대로 '호랑이의 꾸짖음'이라는 뜻이다. 유교 사상이 뿌리 깊던 조선 시대에 지배층을 직접 비판하기 어려워, 작가는 위엄 있고 용맹한 호랑이의 입을 빌리는 (   )을 사용하여 비판의 효과를 극대화했다.","a":"간접 화법","alt":["간접화법","간접"]},{"n":"5-①","disp":"〈호질〉의 등장인물 중 (   )은 도덕적인 선비로 존경받지만 뒤에서는 과부인 동리자와 밀회를 즐기는 위선적인 인물이다. 반면, 이들을 엄하게 꾸짖는 호랑이는 인간 사회의 부조리와 이중성을 비판하는 주체로 등장한다.","a":"북곽 선생","alt":["북곽선생","북곽"]},{"n":"5-②","disp":"〈호질〉의 등장인물 중 북곽 선생은 도덕적인 선비로 존경받지만 뒤에서는 과부인 (   )와 밀회를 즐기는 위선적인 인물이다. 반면, 이들을 엄하게 꾸짖는 호랑이는 인간 사회의 부조리와 이중성을 비판하는 주체로 등장한다.","a":"동리자","alt":[]},{"n":"5-③","disp":"〈호질〉의 등장인물 중 북곽 선생은 도덕적인 선비로 존경받지만 뒤에서는 과부인 동리자와 밀회를 즐기는 위선적인 인물이다. 반면, 이들을 엄하게 꾸짖는 호랑이는 인간 사회의 (   )와 이중성을 비판하는 주체로 등장한다.","a":"부조리","alt":[]},{"n":"6-①","disp":"날이 새어 북곽 선생이 머리를 조아리다 마주친 (   )는 하루하루 김을 매며 부지런히 살아가는 민중을 대표한다. 이는 위선적이고 부도덕하게 살아가는 북곽 선생으로 대표되는 지배층의 삶과 극명한 대비를 이룬다.","a":"농부","alt":[]},{"n":"6-②","disp":"날이 새어 북곽 선생이 머리를 조아리다 마주친 농부는 하루하루 김을 매며 부지런히 살아가는 (   )을 대표한다. 이는 위선적이고 부도덕하게 살아가는 북곽 선생으로 대표되는 지배층의 삶과 극명한 대비를 이룬다.","a":"민중","alt":[]},{"n":"6-③","disp":"날이 새어 북곽 선생이 머리를 조아리다 마주친 농부는 하루하루 김을 매며 부지런히 살아가는 민중을 대표한다. 이는 위선적이고 부도덕하게 살아가는 북곽 선생으로 대표되는 (   )의 삶과 극명한 대비를 이룬다.","a":"지배층","alt":[]},{"n":"7-①","disp":"일반적인 우화 소설에서는 부정적인 인물이 의인화되는 경우가 많지만, 〈호질〉에서는 의인화된 호랑이가 오히려 인간 사회의 부정적 속성을 꾸짖는다. 이러한 (   ) 비판은 직접적인 비판보다 풍자의 효과가 훨씬 크다.","a":"우회적인","alt":["우회적","우회"]},{"n":"7-②","disp":"일반적인 우화 소설에서는 부정적인 인물이 의인화되는 경우가 많지만, 〈호질〉에서는 의인화된 호랑이가 오히려 인간 사회의 부정적 속성을 꾸짖는다. 이러한 우회적인 비판은 직접적인 비판보다 (   )의 효과가 훨씬 크다.","a":"풍자","alt":[]},{"n":"8-①","disp":"연암 박지원의 소설들은 무능한 (   )과 부패한 관료들을 통렬히 비판하는 특징을 지닌다. 대체로 평범하고 천대받는 인물들을 주인공으로 등장시켜, 이들의 입을 빌려 당시 사회의 모순을 고발했는데, 〈호질〉 또한 이러한 비판 의식이 잘 드러난 풍자 소설이다.","a":"양반 계급","alt":["양반계급","양반"]},{"n":"8-②","disp":"연암 박지원의 소설들은 무능한 양반 계급과 부패한 (   )들을 통렬히 비판하는 특징을 지닌다. 대체로 평범하고 천대받는 인물들을 주인공으로 등장시켜, 이들의 입을 빌려 당시 사회의 모순을 고발했는데, 〈호질〉 또한 이러한 비판 의식이 잘 드러난 풍자 소설이다.","a":"관료","alt":[]},{"n":"8-③","disp":"연암 박지원의 소설들은 무능한 양반 계급과 부패한 관료들을 통렬히 비판하는 특징을 지닌다. 대체로 평범하고 천대받는 인물들을 주인공으로 등장시켜, 이들의 입을 빌려 당시 사회의 (   )을 고발했는데, 〈호질〉 또한 이러한 비판 의식이 잘 드러난 풍자 소설이다.","a":"모순","alt":[]}]},{"id":"chun","name":"이춘풍전","story":[{"n":1,"q":"작품 초반에 등장하는 춘풍의 문제 상황과 이후 집안에 닥친 위기","a":"부잣집 외동아들로 태어난 춘풍은 인물과 재주가 뛰어났으나 부모님이 돌아가시자 주색잡기에 빠져 가산을 탕진한다. 이에 춘풍은 부인에게 집안 살림을 맡기고 다시는 주색잡기 등에 빠지지 않겠다는 수기를 씀.","k":[["부잣집","외동아들"],["주색잡기"],["가산","탕진"],["수기"]]},{"n":2,"q":"춘풍이 가산을 탕진한 후 아내 김 씨가 집안을 다시 일으켜 세운 과정","a":"김씨는 바느질 길쌈, 염색하기 등 사시사철 주야로 쉴 새 없이 일하고 돈을 벌어들였다. 이렇게 사오 년 모은 돈을 장변이며 월수 일수를 놓아 의식이 넉넉하고 가세가 풍족해졌다.","k":[["바느질","길쌈","염색"],["사오 년","돈","모"],["장변","월수","일수"],["풍족","넉넉"]]},{"n":3,"q":"집안이 다시 풍족해진 후 춘풍이 평양으로 떠나게 된 과정과 목적","a":"그는 아내의 만류에도 불구하고 호조에서 2천 냥을 비싼 이자로 빌려 돈을 벌어오겠다며 평양으로 장사를 떠납니다.","k":[["만류"],["호조"],["2천","이천"],["평양","장사"]]},{"n":4,"q":"춘풍이 재산을 탕진하고 비참하게 전락한 과정","a":"돈을 벌기 위해 평양에 간 춘풍은 기생 추월에게 홀려 1년 동안 흥청망청 노닐다가 이천오백 냥을 날리고 결국 추월을 아가씨라 부르며 심부름꾼이 되니 살았으되 죽느니만 못한 처지가 됐다.","k":[["추월","기생"],["1년","흥청망청"],["이천오백","2500","2천5백"],["심부름꾼"]]},{"n":5,"q":"남편의 소식을 들은 김 씨가 어느날 생각한 계교는","a":"뒷집 참판 댁 자제가 평양 감사로 내정된 것을 듣고, 대부인에게 잘 보여 인심을 얻는다. 참판 영감이 평양에 부임하러 가는 날, 김 씨는 대부인에게 본인의 오라비에게 비장 한몫 주시길 바란다.라고 속이고 비장 직을 얻어낸다. 오라비는 바로 김 씨 본인이다.","k":[["참판","평양 감사"],["대부인","인심"],["오라비"],["비장"]]},{"n":6,"q":"김 씨가 평양에서 사건을 해결하는 과정","a":"추월은 남장한 춘풍의 부인, 즉 비장을 유혹하려 하지만 실패한다. 이후 비장은 수일 후 춘풍을 잡아들여 호조 돈을 빌리고 상납을 아니하였다는 이유로 곤장을 친다. 추월도 잡아들여 곤장을 치고, 이자까지 받아내어 오천 냥을 춘풍에게 주고 서울로 올라가라고 한다.","k":[["유혹","실패"],["곤장"],["호조","상납"],["오천","이자"]]},{"n":7,"q":"서울로 돌아온 후 춘풍의 허세와 김씨가 자신의 정체를 밝히며 극이 끝나는 과정","a":"서울로 돌아온 춘풍은 직접 장사를 해 돈을 번 것처럼 자랑하며, 집에 오니 모든 것이 어설프다며 부인을 구박한다. 이후 비장이 자기 부인임을 알게 되어 잘못을 깊게 뉘우치고 개과천선한다. 춘풍과 부인은 함께 가정을 잘 다스리며 화목하게 산다.","k":[["자랑","허세"],["구박"],["비장","부인"],["개과천선","뉘우"],["화목"]]}],"blank":[{"n":"1-①","disp":"〈이춘풍전〉은 풍자와 (   ), 교훈을 모두 갖춘 판소리계 소설이다.","a":"해학","alt":[]},{"n":"1-②","disp":"〈이춘풍전〉은 풍자와 해학, 교훈을 모두 갖춘 (   )이다.","a":"판소리계 소설","alt":["판소리계","판소리계소설"]},{"n":"2-①","disp":"춘풍의 부인은 위기 상황에서 (   )으로 문제를 해결하는 진취적인 여성이다.","a":"주체적","alt":["주체"]},{"n":"2-②","disp":"춘풍의 부인은 위기 상황에서 주체적으로 문제를 해결하는 (   ) 여성이다.","a":"진취적인","alt":["진취적","진취"]},{"n":"3-①","disp":"고전 소설에서는 서술자가 작품 속에 개입해 자신의 주관적인 견해를 남기는 경우가 많다. 이를 서술자의 (   )이라고 하는데, 대부분 설의형 문장이나 감탄형 문장으로 표현된다.","a":"편집자적 논평","alt":["편집자적논평","편집자적 개입"]},{"n":"3-②","disp":"고전 소설에서는 서술자가 작품 속에 개입해 자신의 주관적인 견해를 남기는 경우가 많다. 이를 서술자의 편집자적 논평이라고 하는데, 대부분 (   ) 문장이나 감탄형 문장으로 표현된다.","a":"설의형","alt":["설의"]},{"n":"3-③","disp":"고전 소설에서는 서술자가 작품 속에 개입해 자신의 주관적인 견해를 남기는 경우가 많다. 이를 서술자의 편집자적 논평이라고 하는데, 대부분 설의형 문장이나 (   ) 문장으로 표현된다.","a":"감탄형","alt":["감탄"]},{"n":"4-①","disp":"〈이춘풍전〉 창작 무렵, 사회의 모습은 여러 가지 모순에 심한 몸살을 앓고 있었다. 정치적으로는 (   )과 소수 양반 가문의 관직 독점 현상이 만연했다. 몰락 양반이 대거 발생하고, 나아가 신분이나 관직을 사고파는 일까지 생겨났으며, 몰락 양반은 어려운 살림을 꾸려 가기 위해 돈이 필요했고, 신흥 부유층은 돈으로 명예를 사고자 했다. 농촌에서는 대지주가 많은 땅을 독점한 탓에 영세 농민이 농촌을 떠나고, 도시에서는 독과점 상인이 부를 축적해 영세업자를 몰아냈다. 문학도 많은 변화를 겪었다. 중국을 배경으로 과장된 인물과 허황된 사건을 다루던 경향에서 벗어나, 우리나라를 배경으로 하며 다양한 인물을 등장시킨 새로운 작품들이 창작되었다.","a":"당파 싸움","alt":["당파싸움","당파"]},{"n":"4-②","disp":"〈이춘풍전〉 창작 무렵, 사회의 모습은 여러 가지 모순에 심한 평대군","수성"],["술","취","잠"],["운영","김 진사","김진사"],["17","14"]]},{"n":2,"q":"안평대군이 운영을 비롯한 궁녀들에게 내린 금기와 궁궐 내 생활의 한계","a":"안평대군은 10명의 궁녀를 뽑아 공부(시문, 예능)를 가르친다. 그러나 그는 궁녀들이 궁궐 밖으로 나가지 못하게 통제한다.","k":[["10명","열"],["궁녀","가르"],["시문","예능","공부"],["밖","통제","나가지"]]},{"n":3,"q":"운영과 김 진사가 처음 만나 사랑에 빠지게 된 계기와 이후 사랑의 방식","a":"김진사가 수성궁에 들어와 시를 지을 때 운영은 벼루를 받들고 있었다. 둘은 처음 본 순간부터 서로 사랑에 빠진다. 운영은 벽에 구멍을 헐어 봉서(시와 금비녀를 봉한 편지)를 던졌고 진사는 그걸 주워 가지고 간다. 김진사는 무녀(김진사가 삼년을 못 가 죽을 거란 점을 친...)의 도움으로 편지를 운영에게 전달한다.","k":[["벼루"],["처음","사랑"],["봉서","금비녀","편지"],["무녀"]]},{"n":4,"q":"둘의 애정이 안평대군에게 포착될 위기에 궁녀들의 반응과 역할","a":"운영은 궁녀 자란에게 모든 사실을 털어놓고 자란은 도망치는 계획에 반대하며 특을 믿지말라고 경고한다. 안평대군은 운영의 시와 김진사의 상량문을 보고 둘의 사이를 의심하게 되고 궁녀들은 운영을 지키려 애를 쓴다.","k":[["자란"],["반대","경고","특"],["상량문"],["의심"],["지키"]]},{"n":5,"q":"운영과 김 진사의 계획과, 노비 '특'의 배신으로 실패하게 된 과정","a":"운영이 자신이 모은 재물을 노비 특에게 맡겨놓고 궁을 탈출해 김진사와 만날 계획을 세운다. 하지만 특은 도적의 습격을 받아 재물을 모두 빼앗겼다고 거짓말한다. 재물을 찾기 위해 김진사가 특의 집을 수색하고, 이 소식이 안평대군의 귀에 들어가며 둘의 관계가 발각된다.","k":[["재물","특"],["탈출","계획"],["도적","거짓말"],["수색"],["발각"]]},{"n":6,"q":"탈출 사실이 발각된 후 안평대군의 추국과 이에 맞선 운영의 선택 및 결말","a":"김진사가 운영의 재산을 빼돌린 특의 집을 수색하니 금팔지 한쌍과 운남보경(거울) 하나뿐이었다. 이 말이 퍼져 대군이 모든 사실을 알게된다. 김진사와 운영의 관계가 발각되자 운영은 비단 수건을 목을 매어 죽는다.","k":[["수색","특"],["금팔지","운남보경"],["대군","알"],["비단 수건","목","죽"]]},{"n":7,"q":"운영의 죽음을 알게 된 김 진사의 행보와, 이야기를 마친 후 유영이 보여준 결말","a":"김진사는 운영의 영혼을 위로하기 위해 절에서 불공을 드린다. 그리고 식음을 전폐하다 죽음을 맞는다. 그들은 유영에게 자신들의 정은 사라지지 않을 것이라며 사람들의 입에 오르내리며 웃음거리가 되지 않도록 책을 후세에 잘 전달해달라고 부탁한다. 유영이 다시 한번 잠에서 깨고 나니 운영과 김진사는 보이지 않고 김진사가 쓴 책만 남아있다. 유영은 그 책을 들고 여러 명산을 다니다가 그후 어떻게 생을 마쳤는지는 알 수 없다.","k":[["불공","절"],["식음","전폐","죽"],["책","후세"],["명산"],["알 수 없"]]}],"blank":[{"n":"1-①","disp":"〈운영전〉은 (   ), 애정소설, 몽유소설, 액자소설이다. 조선시대, 안평대군의 수성궁을 배경으로 하고 있으며, 남녀 간의 사랑과 궁녀의 비극적인 삶을 다룬다.","a":"염정소설","alt":["염정 소설","염정"]},{"n":"1-②","disp":"〈운영전〉은 염정소설, 애정소설, 몽유소설, (   )이다. 조선시대, 안평대군의 수성궁을 배경으로 하고 있으며, 남녀 간의 사랑과 궁녀의 비극적인 삶을 다룬다.","a":"액자소설","alt":["액자 소설","액자"]},{"n":"1-③","disp":"〈운영전〉은 염정소설, 애정소설, 몽유소설, 액자소설이다. 조선시대, 안평대군의 (   )을 배경으로 하고 경쟁 관계가 아닌 서로 (   )를 쌓아간다.","a":"유대","alt":[]}]},{"id":"gu","name":"구운몽","story":[{"n":1,"q":"형산 연화봉에서 불도를 닦던 '성진'이 세속적 번뇌를 품게 된 계기","a":"성진은 육관대사의 심부름으로 용궁에 갔다가 돌아오는 길에 연화봉 폭포 아래 돌다리에서 팔선녀를 만난다. 성진은 좁은 다리에서 자리를 옮겨달라고 부탁하자 선녀들은 신통한 도술을 부탁하고 성진은 도술(복숭아꽃 가지를 던지가 꽃이 여덞개의 구슬로 변하는)을 보여준다. 팔선녀와의 만남으로 성진은 속세의 부귀영화와 남녀 간의 애정에 대한 호기심을 갖게된다.","k":[["육관대사","용궁"],["돌다리","연화봉"],["팔선녀"],["도술","복숭아꽃","구슬"],["부귀영화","속세","애정"]]},{"n":2,"q":"성진의 번뇌를 알아채고 육관대사가 내린 벌과 이로 인해 성진이 겪게 된 변화","a":"팔선녀와 즐거운 시간을 보내고 돌아온 성진은 잠자리에 누워 팔선녀를 그리워하며 속세의 입신양명, 부귀영화를 떠올린다. 성진의 번뇌를 알아차린 육관대사는 성진을 풍도(지옥)으로 보낸다. 염라대왕 앞에 팔선녀도 끌려왔다. 성진과 팔선녀와 인간 세상으로 내려가게 되고 성진은 양처사의 아들로 태어나 양소유라는 이름을 얻게된다.","k":[["번뇌","그리워"],["풍도","지옥"],["염라대왕"],["양처사","양소유"]]},{"n":3,"q":"인간 세상에 태어난 양소유가 유교적 입신양명을 이루어가는 과정","a":"양소유는 출중한 용모와 뛰어난 학식을 바탕으로 과거 시험에 장원 급제하여 관직에 나아간다. 그는 반란을 일으킨 도적을 평정하고 외적의 침입을 막아내는 등 뛰어난 공을 세운다. 양소유는 승진을 거듭하여 최고 관직인 승상에 봉해지며 황제의 여동생과 혼인하여 황실과 가족이 되며 부귀영화를 누린다.","k":[["장원","급제","과거"],["반란","외적","공"],["승상"],["황제","여동생","혼인"]]},{"n":4,"q":"양소유가 속세에서 여덟 여인(팔선녀의 후신)과 만나는 과정과 그들과의 관계","a":"성진은 속세에 양소유(楊少遊)로 태어나, 천상계의 팔선녀가 환생한 여덟 여인과 2처 6첩의 인연을 맺는다. 남전산의 도사에게 받은 거문고와 퉁소가 이들과 인연을 만들어가는 데에 큰 도움을 준 악기들이다.","k":[["팔선녀","환생","여덟"],["2처","6첩","이처","육첩"],["남전산","도사"],["거문고","퉁소"]]},{"n":5,"q":"양소유가 만년에 느끼게 된 회한과 사유","a":"승상이 되어 모든 부귀영화와 화목한 가정을 이룬 양소유는 만년에 높은 곳(보제봉)에 올라 세월의 무상함을 느낀다. 그는 자손들의 번창함과 자신에게 쌓인 부귀도 결국 죽음 앞에서는 한낱 꿈과 같고 허무한 것(인생무상)임을 깨닫는다. 양소유는 영원한 진리를 얻기 위해 불교에 입문하려는 마음을 먹는다.","k":[["보제봉","높은 곳"],["무상","허무"],["꿈"],["불교","입문","진리"]]},{"n":6,"q":"양소유가 세속의 허무함을 느끼고 꿈에서 깨어나는 과정","a":"인생무상(허무)의 슬픔에 잠겨 있던 양소유 앞에 노승이 찾아와 지팡이로 바위를 두드리며 그를 일깨운다. 화려한 양소유의 삶은 온데간데없이 사라지고 자신이 연화봉 암자에 앉은 스님 성진임을 깨닫는다. 양소유로서 누렸던 평생의 부귀영화가 결국 하룻밤의 꿈(일장춘몽)이었음을 알게된다.","k":[["노승"],["지팡이","바위"],["연화봉","성진"],["일장춘몽","하룻밤"]]},{"n":7,"q":"꿈에서 깨어난 성진이 깨달은 진리와 이후 팔선녀와 함께 이룬 마지막 행보","a":"꿈에서 깨어난 성진은 인생무상의 진리를 깨닫고 크게 반성한다. 팔선녀도 속세의 번뇌를 깨닫고 스님이 되어 성진의 밑에서 불도를 닦는다. 결국 이들은 모두 번뇌를 극복하고 불교적 해탈을 이루고 극락세계로 돌아간다.","k":[["인생무상","깨닫"],["팔선녀","스님","불도"],["해탈"],["극락세계"]]}],"blank":[{"n":"1-①","disp":"(   )이 지은 〈구운몽〉의 갈래는 국문소설, 영웅소설, 염정소설이다. 불교적이고 구도적, 전기적인 성격을 가지고 있다.","a":"김만중","alt":[]},{"n":"1-②","disp":"김만중이 지은 〈구운몽〉의 갈래는 (   ), 영웅소설, 염정소설이다. 불교적이고 구도적, 전기적인 성격을 가지고 있다.","a":"국문소설","alt":["국문 소설"]},{"n":"1-③","disp":"김만중이 지은 〈구운몽〉의 갈래는 국문소설, 영웅소설, (   )이다. 불교적이고 구도적, 전기적인 성격을 가지고 있다.","a":"염정소설","alt":["염정 소설"]},{"n":"1-④","disp":"김만중이 지은 〈구운몽〉의 갈래는 국문소설, 영웅소설, 염정소설이다. 불교적이고 (   ), 전기적인 성격을 가지고 있다.","a":"구도적","alt":["구도"]},{"n":"2-①","disp":"주인공 이름 '소유(少遊)'의 이름 풀이는 속세에서 (   ) 즐겁게 지내다 간다는 뜻이다. 이 이름이 소설에서 암시하는 내용은 양소유의 인생이 한낱 꿈에 불과하다는 것이다.","a":"잠시","alt":[]},{"n":"2-②","disp":"주인공 이름 '소유(少遊)'의 이름 풀이는 속세에서 잠시 즐겁게 지내다 간다는 뜻이다. 이 이름이 소설에서 암시하는 내용은 양소유의 인생이 한낱 (   )에 불과하다는 것이다.","a":"꿈","alt":[]},{"n":"3-①","disp":"〈구운몽〉에는 성진이 양소유가 되어 누리는 입신출세와 부귀영달의 과정은 (   )의 현세주의와 일치하고 소설의 배경인 신선세계는 도교사상에 뿌리를 두고 있다. 인생의 무상함을 느끼는 성진의 모습은 불교사상의 핵심이 공(空)과 일치한다.","a":"유교사상","alt":["유교 사상","유교"]},{"n":"3-②","disp":"〈구운몽〉에는 성진이 양소유가 되어 누리는 입신출세와 부귀영달의 과정은 유교사상의 현세주의와 일치하고 소설의 배경인 신선세계는 (   )에 뿌리를 두고 있다. 인생의 무상함을 느끼는 성진의 모습은 불교사상의 핵심이 공(空)과 일치한다.","a":"도교사상","alt":["도교 사상","도교"]},{"n":"3-③","disp":"〈구운몽〉에는 성진이 양소유가 되어 누리는 입신출세와 부귀영달의 과정은 유교사상의 현세주의와 일치하고 소설의 배경인 신선세계는 도교사상에 뿌리를 두고 있다. 인생의 무상함을 느끼는 성진의 모습은 (   )의 핵심이 공(空)과 일치한다.","a":"불교사상","alt":["불교 사상","불교"]},{"n":"3-④","disp":"〈구운몽〉에는 성진이 양소유가 되어 누리는 입신출세와 부귀영달의 과정은 유교사상의 현세주의와 일치하고 소설의 배경인 신선세계는 도교사상에 뿌리를 두고 있다. 인생의 무상함을 느끼는 성진의 모습은 불교사상의 핵심이 (   )과 일치한다.","a":"공(空)","alt":["공"]},{"n":"4-①","disp":"구운몽(九雲夢) 제목 풀이 — 구(九): '9'이란 숫자는 1명의 양소유와 8명의 선녀를 뜻한다. 운(雲): 소설의 주제인 (   )을 뜻하며 구름이 일었다가 사라지는 짧은 순간을 인생에 비유한 것이다. 몽(夢): 성진이 꿈을 통해 세속적 욕망을 맛보고 깨달음을 얻는 것을 뜻한다.","a":"일장춘몽","alt":[]},{"n":"4-②","disp":"구운몽(九雲夢) 제목 풀이 — 구(九): '9'이란 숫자는 1명의 양소유와 8명의 선녀를 뜻한다. 운(雲): 소설의 주제인 일장춘몽을 뜻하며 (   )이 일었다가 사라지는 짧은 순간을 인생에 비유한 것이다. 몽(夢): 성진이 꿈을 통해 세속적 욕망을 맛보고 깨달음을 얻는 것을 뜻한다.","a":"구름","alt":[]},{"n":"4-③","disp":"구운몽(九雲夢) 제목 풀이 — 구(九): '9'이란 숫자는 1명의 양소유와 8명의 선녀를 뜻한다. 운(雲): 소설의 주제인 일장춘몽을 뜻하며 구름이 일었다가 사라지는 짧은 순간을 인생에 비유한 것이다. 몽(夢): 성진이 꿈을 통해 (   )을 맛보고 깨달음을 얻는 것을 뜻한다.","a":"세속적 욕망","alt":["세속적욕망","욕망"]},{"n":"5-①","disp":"성진에게 진정한 가르침을 주는 인물은 (   )이며 그는 성진에게 꿈과 현실은 다르지 않다고 말하며 '모든 유형의 사물은 공허하다'라는 진리를 설파한다. 이는 구운몽의 주제인 인생무상과 부귀영화의 덧없음을 뜻한다.","a":"육관대사","alt":["육관 대사"]},{"n":"5-②","disp":"성진에게 진정한 가르침을 주는 인물은 육관대사이며 그는 성진에게 꿈과 현실은 다르지 않다고 말하며 '모든 유형의 사물은 (   )'라는 진리를 설파한다. 이는 구운몽의 주제인 인생무상과 부귀영화의 덧없음을 뜻한다.","a":"공허하다","alt":["공허"]},{"n":"5-③","disp":"성진에게 진정한 가르침을 주는 인물은 육관대사이며 그는 성진에게 꿈과 현실은 다르지 않다고 말하며 '모든 유형의 사물은 공허하다'라는 진리를 설파한다. 이는 구운몽의 주제인 (   )과 부귀영화의 덧없음을 뜻한다.","a":"인생무상","alt":["인생 무상"]},{"n":"6-①","disp":"몽자류 소설과 몽유록계 소설은 모두 '현실 - 꿈 - 현실'의 (   )를 가지고 있다. 하지만 〈구운몽〉과 같은 몽자류 소설은 몽유록계 소설과 달리 '꿈'의 내용에 차이가 있다. 몽자류 소설의 꿈속의 세계는 현실세계보다 현실적이고 형이하학적이며 꿈의 내용이 세속적이다.","a":"환몽구조","alt":["환몽 구조","환몽"]},{"n":"6-②","disp":"(   ) 소설과 몽유록계 소설은 모두 '현실 - 꿈 - 현실'의 환몽구조를 가지고 있다. 하지만 〈구운몽〉과 같은 몽자류 소설은 몽유록계 소설과 달리 '꿈'의 내용에 차이가 있다. 몽자류 소설의 꿈속의 세계는 현실세계보다 현실적이고 형이하학적이며 꿈의 내용이 세속적이다.","a":"몽자류","alt":["몽자류 소설"]},{"n":"6-③","disp":"몽자류 소설과 몽유록계 소설은 모두 '현실 - 꿈 - 현실'의 환몽구조를 가지고 있다. 하지만 〈구운몽〉과 같은 몽자류 소설은 몽유록계 소설과 달리 '꿈'의 내용에 차이가 있다. 몽자류 소설의 꿈속의 세계는 현실세계보다 현실적이고 (   )이며 꿈의 내용이 세속적이다.","a":"형이하학적","alt":["형이하학"]}]},{"id":"sa","name":"사씨남정기","story":[{"n":1,"q":"명나라 사대부 유연수와 사씨(사정옥)의 혼인 과정과, 후사를 얻지 못해 일어난 가문 내의 상황을 서술하시오.","a":"매파의 혼담을 들은 유연수 집안의 두 부인은 묘혜 스님을 불러 사씨의 인품과 덕행을 알아본 뒤, 유연수는 사씨의 뛰어난 용모, 재주와 덕행에 감동하여 그녀를 정실부인으로 맞이한다. 그러나 혼인 후 9년이 지나도록 자식을 얻지 못하자, 사씨는 가문의 후사를 잇는 것이 부녀자의 도리이자 의무라고 생각하여 유연수에게 스스로 첩을 들일 것을 적극적으로 권유한다. 이에 유연수는 첩으로 교씨를 맞이하게 되고, 이는 향후 가문 내에 큰 갈등을 불러오는 계기가 된다.","k":[["매파","혼담"],["묘혜"],["9년","후사","자식"],["첩","권유"],["교씨"]]},{"n":2,"q":"첩으로 들어온 교씨의 성품과 그녀가 사씨를 모함하기 위해 꾸민 음모에 대해 서술하시오.","a":"교씨는 교활하고 간사하며 겉으로는 순종적인 척하나 속으로는 사씨를 시기하고 정실부인의 자리를 탐내며 탐욕과 질투가 가득한 인물이다. 교씨는 사씨를 쫓아내기 위해 사씨의 옥지환(옥반지)을 훔쳐 냉진에게 건넨 뒤 사씨와 사통간통한 정표로 의심하도록 유연수에게 보여주게 한다. 이후에도 자신이 낳은 아들 장주를 독살한 뒤 그 죄를 사씨에게 뒤집어씌우는 등의 치밀한 음모를 꾸민다.","k":[["교활","간사","시기"],["옥지환","옥반지"],["냉진"],["장주","독살"]]},{"n":3,"q":"교씨의 간계에 속은 유연수가 내린 결정과, 이로 인해 사씨가 겪게 된 시련을 서술하시오.","a":"교씨의 거짓에 속아 넘간 유연수는 사씨를 집안에서 쫓아내는 결정을 내린다. 억울하게 폐출당한 사씨는 시부모의 묘전에서 홀로 지내다가 교씨의 흉계로 납치될 위기에 처하며, 이를 피해 피신한다. 배를 타고 남방으로 향해 가는 중 병을 얻기도 하고 폭풍을 만나기도 한다. 여비도 떨어지고 갈 곳도 없었던 사씨는 강물에 투신하려 하는 등 온갖 곤경과 생사의 위기를 겪는다.","k":[["쫓아","폐출"],["묘전","시부모"],["납치","흉계"],["남방","폭풍"],["투신","강물"]]},{"n":4,"q":"사씨가 쫓겨난 후 교씨와 동청이 저지른 악행과 이로 인해 유연수가 겪게 된 비극을 서술하시오.","a":"정실 자리를 차지한 교씨는 동청과 같이 유씨 가문의 재산을 독점하고 방탕한 생활을 일삼는다. 이들은 유연수가 작성한 글을 왜곡하여 간신 엄승상에게 바쳐 그를 모함하고 이로 인해 유연수는 관직을 박탈당하고 먼 곳으로 유배를 당하는 비극을 겪게 된다. 여기서 그치지 않고 동청은 유연수를 완전히 없애기 위해 자객까지 보내 그의 목숨을 노리는 악행을 저지른다.","k":[["정실","동청"],["재산","독점"],["엄승상","모함","글"],["유배","관직"],["자객"]]},{"n":5,"q":"유연수가 유배에서 풀려나게 된 계기와, 사씨의 억울함을 깨닫고 그녀를 찾아 나서는 과정을 서술하시오.","a":"유연수는 때마침 황제가 태자를 책봉하는 나라의 큰 경사가 있어 임금의 은총을 입어 유배에서 풀려난다. 친척이 있는 무창으로 향하는 길에 사씨의 시녀였던 설매를 만나게 된다. 설매는 교씨와 동청의 간계로 사씨가 억울한 누명을 쓰고 쫓겨났다는 진실과, 사씨의 아들 인아를 죽이라고 명을 받았으나 길가 숲에 숨겨뒀다는 소식 및 사씨가 살아있을 수도 있다는 소식을 전하고, 이를 들은 유연수는 크게 뉘우치며 사씨를 찾아 나서게 된다.","k":[["태자","책봉","경사"],["무창"],["설매"],["인아"],["뉘우","찾아"]]},{"n":6,"q":"유연수와 사씨가 극적으로 재회하는 과정과 악인인 교씨 및 동청이 받게 된 처벌을 서술하시오.","a":"유연수는 동청이 보낸 도적들에게 쫓기다 물줄기에 가로막혀 강물에 몸을 던지려던 순간, 배를 타고 지나가던 사씨와 극적으로 재회하게 된다. 이후 악행이 밝혀진 동청은 장안 네거리에서 요참을 당하고 재산을 몰수당하며, 냉진과 도망쳐 창기(술집 기생)로 전락했던 교씨 역시 유연수에게 잡혀와 죄를 추궁당한 뒤 죽임을 당하며 종말을 맞이한다.","k":[["도적","쫓기"],["강물","배","재회"],["동청","요참","장안"],["냉진","창기"],["교씨","죽임"]]},{"n":7,"q":"사씨가 정실로 복위한 후 가문의 결말과, 작가 김만중이 이 작품을 통해 전달하고자 한 정치적 메시지를 서술하시오.","a":"사씨는 정실로 복위한 후, 임 낭자의 도움으로 목숨을 건진 아들 인아와 극적으로 재회하고, 임씨와 함께 자손을 거느리며 가문의 화평과 번영을 되찾게 된다. 작가 김만중은 권선징악의 가치관을 전달함과 동시에, 숙종이 인현왕후를 폐위하고 장희빈을 총애한 당대의 정국을 비판하며 숙종이 잘못을 깨닫고 인현왕후를 복위시킬 것을 촉구하는 정치적 메시지를 전달하고자 했다.","k":[["복위","정실"],["임 낭자","임씨"],["인아","재회"],["권선징악"],["숙종","인현왕후","장희빈"]]}],"blank":[{"n":"1-①","disp":"(   )은 한 가족 안에서 벌어지는 갈등을 다루며, 착한 사람은 복을 받고 악한 사람은 벌을 받는다는 권선징악의 주제를 전달한다. 당시 독자층은 주로 교육 기회가 적었던 사대부층의 부녀자와 평민들이었기 때문에 주로 한글로 작성되었다.","a":"가정 소설","alt":["가정소설","가정"]},{"n":"1-②","disp":"가정 소설은 한 가족 안에서 벌어지는 갈등을 다루며, 착한 사람은 복을 받고 악한 사람은 벌을 받는다는 (   )의 주제를 전달한다. 당시 독자층은 주로 교육 기회가 적었던 사대부층의 부녀자와 평민들이었기 때문에 주로 한글로 작성되었다.","a":"권선징악","alt":[]},{"n":"1-③","disp":"가정 소설은 한 가족 안에서 벌어지는 갈등을 다루며, 착한 사람은 복을 받고 악한 사람은 벌을 받는다는 권선징악의 주제를 전달한다. 당시 독자층은 주로 교육 기회가 적었던 사대부층의 부녀자와 평민들이었기 때문에 주로 (   )로 작성되었다.","a":"한글","alt":[]},{"n":"2-①","disp":"김만중이 지은 〈사씨남정기〉는 (   )가 폐위되고 희빈 장씨가 왕비가 된 역사적 사건을 바탕으로 한 소설이다. 또한 임금의 잘못을 완곡하게 깨우쳐 주기 위해 창작된 목적 소설로, 풍간적 성격을 특징으로 한다.","a":"인현왕후","alt":[]},{"n":"2-②","disp":"김만중이 지은 〈사씨남정기〉는 인현왕후가 폐위되고 (   )가 왕비가 된 역사적 사건을 바탕으로 한 소설이다. 또한 임금의 잘못을 완곡하게 깨우쳐 주기 위해 창작된 목적 소설로, 풍간적 성격을 특징으로 한다.","a":"희빈 장씨","alt":["희빈장씨","장희빈"]},{"n":"2-③","disp":"김만중이 지은 〈사씨남정기〉는 인현왕후가 폐위되고 희빈 장씨가 왕비가 된 역사적 사건을 바탕으로 한 소설이다. 또한 임금의 잘못을 완곡하게 깨우쳐 주기 위해 창작된 (   )로, 풍간적 성격을 특징으로 한다.","a":"목적 소설","alt":["목적소설","목적"]},{"n":"2-④","disp":"김만중이 지은 〈사씨남정기〉는 인현왕후가 폐위되고 희빈 장씨가 왕비가 된 역사적 사건을 바탕으로 한 소설이다. 또한 임금의 잘못을 완곡하게 깨우쳐 주기 위해 창작된 목적 소설로, (   ) 성격을 특징으로 한다.","a":"풍간적","alt":["풍간"]},{"n":"3-①","disp":"〈사씨남정기〉의 상징적 인물 구도를 당대 정치적 사건과 비교하면, 현숙한 부인인 사씨는 (   )를, 간악한 모함을 일삼는 교씨는 희빈 장씨를, 교씨의 이간질에 넘어가 사씨를 추방하는 유연수는 숙종을 상징한다.","a":"인현왕후","alt":[]},{"n":"3-②","disp":"〈사씨남정기〉의 상징적 인물 구도를 당대 정치적 사건과 비교하면, 현숙한 부인인 사씨는 인현왕후를, 간악한 모함을 일삼는 교씨는 (   )를, 교씨의 이간질에 넘어가 사씨를 추방하는 유연수는 숙종을 상징한다.","a":"희빈 장씨","alt":["희빈장씨","장희빈"]},{"n":"3-③","disp":"〈사씨남정기〉의 상징적 인물 구도를 당대 정치적 사건과 비교하면, 현숙한 부인인 사씨는 인현왕후를, 간악한 모함을 일삼는 교씨는 희빈 장씨를, 교씨의 이간질에 넘어가 사씨를 추방하는 유연수는 (   )을 상징한다.","a":"숙종","alt":[]},{"n":"4-①","disp":"유연수는 교씨의 모함에 빠져 사씨를 버리고 재산을 잃는 등 (   ) 양반 사대부의 모습을 보여준다. 사씨가 억울하게 집에서 쫓겨나는 대목은 당시 여성들이 주체적으로 행동하기 어려웠으며, 남편의 가부장적 권위가 매우 막강했음을 보여준다.","a":"유약한","alt":["유약"]},{"n":"4-②","disp":"유연수는 교씨의 모함에 빠져 사씨를 버리고 재산을 잃는 등 유약한 양반 사대부의 모습을 보여준다. 사씨가 억울하게 집에서 쫓겨나는 대목은 당시 여성들이 주체적으로 행동하기 어려웠으며, 남편의 (   )가 매우 막강했음을 보여준다.","a":"가부장적 권위","alt":["가부장적권위","가부장적","가부장"]},{"n":"5-①","disp":"사씨가 자식을 낳기 위해 스스로 유연수에게 교씨를 첩으로 권하고, 훗날 고초를 겪은 후에도 다시 (   )를 첩으로 들이려 하는 대목은, 작가 김만중 자신이 여전히 봉건적 도덕성에 얽매여 작품을 썼다는 문학사적 한계를 드러내는 부분이다.","a":"임씨","alt":["임 씨"]},{"n":"5-②","disp":"사씨가 자식을 낳기 위해 스스로 유연수에게 교씨를 첩으로 권하고, 훗날 고초를 겪은 후에도 다시 임씨를 첩으로 들이려 하는 대목은, 작가 김만중 자신이 여전히 (   )에 얽매여 작품을 썼다는 문학사적 한계를 드러내는 부분이다.","a":"봉건적 도덕성","alt":["봉건적도덕성","봉건적"]},{"n":"5-③","disp":"사씨가 자식을 낳기 위해 스스로 유연수에게 교씨를 첩으로 권하고, 훗날 고초를 겪은 후에도 다시 임씨를 첩으로 들이려 하는 대목은, 작가 김만중 자신이 여전히 봉건적 도덕성에 얽매여 작품을 썼다는 문학사적 (   )를 드러내는 부분이다.","a":"한계","alt":[]},{"n":"6-①","disp":"〈사씨남정기〉에서 사씨가 자식을 낳기 위해 교씨를 첩으로 들이는 모습이나, 고난을 겪은 뒤에도 다시 임씨를 첩으로 들이려 하는 대목을 통해 당대 사회에 (   )가 일반적이었으며, 가문의 대를 잇는 것을 매우 중요하게 여겼던 당대 사회상을 알 수 있다.","a":"축첩 제도","alt":["축첩제도","축첩"]},{"n":"6-②","disp":"〈사씨남정기〉에서 사씨가 자식을 낳기 위해 교씨를 첩으로 들이는 모습이나, 고난을 겪은 뒤에도 다시 임씨를 첩으로 들이려 하는 대목을 통해 당대 사회에 축첩 제도가 일반적이었으며, 가문의 (   ) 것을 매우 중요하게 여겼던 당대 사회상을 알 수 있다.","a":"대를 잇는","alt":["대를잇는","대"]},{"n":"7-①","disp":"작품 속 유연수와 사씨가 (   )를 통해 혼담을 주고받는 모습은 당대 혼인이 개인의 연애가 아닌 중매로 이루어졌음을 보여준다. 또한 가문의 대를 잇기 위해 첩을 두는 축첩 제도가 일반적이었던 당시 사회상도 소설에 드러난다.","a":"매파","alt":[]},{"n":"7-②","disp":"작품 속 유연수와 사씨가 매파를 통해 혼담을 주고받는 모습은 당대 혼인이 개인의 연애가 아닌 (   )로 이루어졌음을 보여준다. 또한 가문의 대를 잇기 위해 첩을 두는 축첩 제도가 일반적이었던 당시 사회상도 소설에 드러난다.","a":"중매","alt":[]},{"n":"7-③","disp":"작품 속 유연수와 사씨가 매파를 통해 혼담을 주고받는 모습은 당대 혼인이 개인의 연애가 아닌 중매로 이루어졌음을 보여준다. 또한 가문의 대를 잇기 위해 첩을 두는 (   )가 일반적이었던 당시 사회상도 소설에 드러난다.","a":"축첩 제도","alt":["축첩제도","축첩"]},{"n":"8-①","disp":"(   )(유연수)이 \"첩이 들어오면 집안이 어지러워지는 것은 당연지사\"라고 언급하는 대목은 당시에도 처첩 간의 갈등을 경계했음을 보여주는 동시에 향후 벌어질 교씨의 악행을 암시하는 대목이기도 하다.","a":"유한림","alt":[]},{"n":"8-②","disp":"유한림(유연수)이 \"첩이 들어오면 집안이 어지러워지는 것은 당연지사\"라고 언급하는 대목은 당시에도 (   ) 간의 갈등을 경계했음을 보여주는 동시에 향후 벌어질 교씨의 악행을 암시하는 대목이기도 하다.","a":"처첩","alt":[]},{"n":"8-③","disp":"유한림(유연수)이 \"첩이 들어오면 집안이 어지러워지는 것은 당연지사\"라고 언급하는 대목은 당시에도 처첩 간의 갈등을 경계했음을 보여주는 동시에 향후 벌어질 교씨의 악행을 (   )하는 대목이기도 하다.","a":"암시","alt":[]},{"n":"9-①","disp":"누군가의 잘못을 바로잡기 위해 (   ) 표현으로 깨달음을 주는 소설을 풍간 소설이라 한다. 김만중은 〈사씨남정기〉를 통해 숙종 임금의 잘못된 판단을 일깨우고 유교적 가치관을 바로 세우고자 했다.","a":"완곡한","alt":["완곡"]},{"n":"9-②","disp":"누군가의 잘못을 바로잡기 위해 완곡한 표현으로 깨달음을 주는 소설을 (   )이라 한다. 김만중은 〈사씨남정기〉를 통해 숙종 임금의 잘못된 판단을 일깨우고 유교적 가치관을 바로 세우고자 했다.","a":"풍간 소설","alt":["풍간소설","풍간"]},{"n":"9-③","disp":"누군가의 잘못을 바로잡기 위해 완곡한 표현으로 깨달음을 주는 소설을 풍간 소설이라 한다. 김만중은 〈사씨남정기〉를 통해 (   ) 임금의 잘못된 판단을 일깨우고 유교적 가치관을 바로 세우고자 했다.","a":"숙종","alt":[]}]},{"id":"chung","name":"유충렬전","story":[{"n":1,"q":"주인공 '유충렬'의 출생 배경","a":"명나라 영종 황제 시절의 충신인 유심은 자식이 없어 고민하다가 부부가 남악산에서 기도를 하니 꿈속에 청룡을 타고 선인이 나타난다. 유충렬이 태어나는 날에 선녀가 내려와 아기는 하늘의 신선이었던 자미원의 장성(장군)이 환생한 것이라고 알려준다.","k":[["영종","명나라"],["유심","충신"],["남악산","기도"],["청룡","선인","꿈"],["자미원","장성","환생"]]},{"n":2,"q":"정한담과 최일귀의 모함으로 유충렬의 집안이 겪게 된 시련과 이로 인한 충렬의 이별","a":"정한담과 최일귀는 간신으로 오랑캐와 전쟁을 하자며 천자를 부추긴다. 유심이 이에 반대하자 정한담이 그를 가달국과 내통한다는 누명을 씌워 연북으로 귀양을 보낸다. 정한담과 최일귀는 유심 집안에 영웅이 난다는 말에 장부인과 어린 충렬이 사는 집에 불을 지른다. 하지만 장부인의 꿈에 노인이 나타나 붉은 부채를 주며 불이 나면 부채를 흔들며 뒤뜰 담장 아래에 숨어있으라고 이른다. 충렬을 데리고 불길을 탈출한 장부인은 정한담과 최일귀이 보낸 도적들에게 잡히고 충렬은 강에 던져진다.","k":[["정한담","최일귀"],["가달국","내통","누명"],["연북","귀양"],["불","장부인"],["붉은 부채","부채"],["강","던져"]]},{"n":3,"q":"유랑하던 충렬이 도승지 강희주를 만나 구원받는 과정과 다시 닥쳐온 시련","a":"정한담과 최일귀가 보낸 도적들에 의해 강에 던져진 충렬은 구사일생으로 살아나 멱라수(강)에 이른다. 충렬은 어머니도 사망하고 아버지도 귀양가는 길에 멱라수에서 빠져죽은 것으로 오해하고 슬피운다. 지나가던 강희주(승상)이 충렬을 거두어 월계촌으로 가고, 충렬은 강희주의 딸과 혼인한다. 세월이 흘러 충렬이 열다섯 살이 되었을 때, 강희주가 정한담과 최일귀의 모함을 받아 옥에 갇히자 충렬은 부인과 헤어져 황성으로 길을 떠난다.","k":[["멱라수"],["강희주"],["월계촌"],["딸","혼인"],["열다섯"],["옥","모함"]]},{"n":4,"q":"깊은 산속으로 피신한 유충렬이 어떤 조력자를 만나 영웅으로 성장하는지","a":"강희주의 집에서 나온 충렬은 백룡사에서 머물다가 노승에게서 어머니 장부인이 남긴 옥함(남경 도원수 유충렬이 개탁하라)를 받는다. 옥함 안에는 갑옷과 칼, 책(병서)가 들어 있었다. 유충렬은 송임촌 동장자에게서 천사마(말)까지 얻는다.","k":[["백룡사"],["노승"],["옥함"],["갑옷","칼","병서"],["천사마","동장자"]]},{"n":5,"q":"정한담의 반란과 국가적 위기","a":"명나라의 국운이 약해져 오랑캐들이 들고 일어난다. 정한담과 최일귀는 천자에게 오랑캐를 함락하겠다며 출발하지만 적에게 바로 항복하고 이들의 우두머리가 되어 도성으로 쳐들어온다. 적의 군사를 이용해 천자의 자리를 빼앗기 위한 계획이었다. 옥새를 들고 도망치는 천자가 정한담과 최일귀에게 항복하려는 순간, 이충렬이 천사마를 타고 나타난다.","k":[["국운","오랑캐"],["항복","우두머리"],["도성","쳐들어"],["옥새","천자"],["천사마"]]},{"n":6,"q":"유충렬이 위기에 빠진 천자를 구하고 원수를 갚는 과정","a":"충렬은 배신자 정한담과 최일귀에게 항복할 위기를 맞은 천자 앞에 나타난다. 정한담과 최일귀의 모함을 받아 귀양을 간 유심과 강희주의 원통함을 알리자 천자는 나라를 도와주면 반드시 공을 갚겠다고 약속한다. 천자는 유충렬을 도원수로 임명하고 충렬은 장성검을 휘둘러 최일귀의 머리를 베어낸다. 정한담은 자신의 투구가 깨어지자 호산대로 높이 올라가 도망친다. 정한담은 주변국에 문서를 보내 군사를 모으고 천자를 잡아들여 항서를 쓰라고 강요한다. 충렬은 천사마를 몰아 한달음에 궁궐로 도착해 정한담을 잡아 옥에 가둔다. 호국의 호왕이 한담이 사로잡혔다는 말을 듣고 명의 황후와 태후 태자를 사로잡아 호국으로 돌아간다. 유충렬은 호왕의 머리를 베고 황후, 태후, 태자를 구해 명나라로 돌아온다.","k":[["도원수"],["장성검","최일귀"],["호산대","정한담"],["호왕","호국"],["황후","태후","태자"]]},{"n":7,"q":"헤어진 가족과의 재회와 결말","a":"정한담의 농간에 깊은 토굴에 갇힌 유심은 죽을 날만 기다리고 있었다. '대명국 도원수'가 된 유충렬은 아버지를 찾아내고 선녀가 준 과일로 유심의 기운을 살려놓는다. 유심은 정한담의 목을 베고 최일귀와 장한담의 삼족을 멸한다. 유충렬은 이번엔 호국에 잡혀간 장인어른, 강희주를 구한다. 그리고 헤어졌던 어머니(장부인)를 만나 충렬의 등에 '삼태성'을 보여주며 모자 사이를 확인하고 절개를 지키며 살아남은 아내(강 낭자)까지 만나 재회한다.","k":[["토굴","유심"],["도원수"],["선녀","과일"],["삼족"],["강희주","장인"],["삼태성","장부인"],["강 낭자","아내"]]}],"blank":[{"n":"1-①","disp":"(   )은 전쟁을 배경과 소재로 하는 소설이다. 일반적으로 비범한 인물이 등장해 위기를 극복하고 성장한 뒤 전쟁에 나가 공을 세우거나 나라를 구하는 내용으로 전개된다. 공을 세운 주인공이 부귀영화를 누리거나 입신양명을 하며 행복한 결말을 맞는다. 군담 소설은 역사 군담 소설과 창작 군담 소설로 나눌 수 있다. 역사 군담 소설은 실제로 있었던 전쟁을 소설화한 작품이며, 창작 군담 소설은 허구의 전쟁과 거기서 파생된 사건들을 그린 작품이다. 후자는 소설의 공간적 배경이 중국인 경우가 많고, 조선 후기, 소설의 상품화라는 흐름을 타고 활발하게 창작되며 민중에게 큰 사랑을 받았다.","a":"군담 소설","alt":["군담소설","군담"]},{"n":"1-②","disp":"군담 소설은 전쟁을 배경과 소재로 하는 소설이다. 일반적으로 비범한 인물이 등장해 위기를 극복하고 성장한 뒤 전쟁에 나가 공을 세우거나 나라를 구하는 내용으로 전개된다. 공을 세운 주인공이 부귀영화를 누리거나 입신양명을 하며 행복한 결말을 맞는다. 군담 소설은 (   )과 창작 군담 소설로 나눌 수 있다. 역사 군담 소설은 실제로 있었던 전쟁을 소설화한 작품이며, 창작 군담 소설은 허구의 전쟁과 거기서 파생된 사건들을 그린 작품이다. 후자는 소설의 공간적 배경이 중국인 경우가 많고, 조선 후기, 소설의 상품화라는 흐름을 타고 활발하게 창작되며 민중에게 큰 사랑을 받았다.","a":"역사 군담 소설","alt":["역사 군담","역사군담소설"]},{"n":"1-③","disp":"군담 소설은 전쟁을 배경과 소재로 하는 소설이다. 일반적으로 비범한 인물이 등장해 위기를 극복하고 성장한 뒤 전쟁에 나가 공을 세우거나 나라를 구하는 내용으로 전개된다. 공을 세운 주인공이 부귀영화를 누리거나 입신양명을 하며 행복한 결말을 맞는다. 군담 소설은 역사 군담 소설과 (   )로 나눌 수 있다. 역사 군담 소설은 실제로 있었던 전쟁을 소설화한 작품이며, 창작 군담 소설은 허구의 전쟁과 거기서 파생된 사건들을 그린 작품이다. 후자는 소설의 공간적 배경이 중국인 경우가 많고, 조선 후기, 소설의 상품화라는 흐름을 타고 활발하게 창작되며 민중에게 큰 사랑을 받았다.","a":"창작 군담 소설","alt":["창작 군담","창작군담소설"]},{"n":"1-④","disp":"군담 소설은 전쟁을 배경과 소재로 하는 소설이다. 일반적으로 비범한 인물이 등장해 위기를 극복하고 성장한 뒤 전쟁에 나가 공을 세우거나 나라를 구하는 내용으로 전개된다. 공을 세운 주인공이 부귀영화를 누리거나 입신양명을 하며 행복한 결말을 맞는다. 군담 소설은 역사 군담 소설과 창작 군담 소설로 나눌 수 있다. 역사 군담 소설은 실제로 있었던 전쟁을 소설화한 작품이며, 창작 군담 소설은 허구의 "alt":[]},{"n":"6-③","disp":"〈유충렬전〉은 임진왜란과 병자호란으로 나라가 황폐해졌을 무렵 창작된 작품으로, 전란 이후 나라에는 불안감과 패배 의식이 가득했고, 백성들은 하루속히 나라가 안정되기를 바랐다. 〈유충렬전〉에는 당시 민중의 심리가 반영되었는데, 황폐한 사회를 살아가야 하는 슬픔, 패전으로 인한 민족적 자존심의 회복을 바라는 마음, 청나라에 대한 적개심 등을 예로 들 수 있다. 악인에게 통렬히 복수하고 징계하는 대목을 통해 고난에 대한 (   )도 엿볼 수 있다.","a":"보상 심리","alt":["보상심리","보상"]},{"n":"7-①","disp":"〈유충렬전〉에는 정치적 암투 때문에 가족 구성원이 (   )하면서 겪는 고난과 재회의 과정을 담고 있다. 천자의 일가, 유심의 일가, 유충렬의 처가가 처한 상황은 안정된 삶을 영위하지 못하는 하층민의 비극적인 상황과 별반 다르지 않다. 작품 속에 천자 일가의 고난이 그려진 데서 무능력한 왕권을 비판하려는 의도를 읽어낼 수 있다.","a":"생이별","alt":[]},{"n":"7-②","disp":"〈유충렬전〉에는 정치적 암투 때문에 가족 구성원이 생이별하면서 겪는 고난과 재회의 과정을 담고 있다. 천자의 일가, 유심의 일가, 유충렬의 처가가 처한 상황은 안정된 삶을 영위하지 못하는 (   )의 비극적인 상황과 별반 다르지 않다. 작품 속에 천자 일가의 고난이 그려진 데서 무능력한 왕권을 비판하려는 의도를 읽어낼 수 있다.","a":"하층민","alt":[]},{"n":"7-③","disp":"〈유충렬전〉에는 정치적 암투 때문에 가족 구성원이 생이별하면서 겪는 고난과 재회의 과정을 담고 있다. 천자의 일가, 유심의 일가, 유충렬의 처가가 처한 상황은 안정된 삶을 영위하지 못하는 하층민의 비극적인 상황과 별반 다르지 않다. 작품 속에 천자 일가의 고난이 그려진 데서 무능력한 (   )을 비판하려는 의도를 읽어낼 수 있다.","a":"왕권","alt":[]},{"n":"8-①","disp":"유충렬은 천상의 신선((   ))으로 지내다가 죄를 짓고 지상으로 내려온 인물이다. 전투에 나설 때는 신선의 도술처럼 가공할 파괴력으로 오랑캐를 정벌한다. 유충렬 외에 다른 등장인물들은 선녀가 가지고 온 천상의 과일을 먹고 기력을 찾거나, 난이 닥칠 때마다 꿈을 통해 현실의 위험을 예고받기도 한다. 즉, 〈유충렬전〉 속 환상성은 도교적인 상상력과 민간의 주술적인 신앙이 결합되어 있고, 현실에서 이루지 못하는 일을 이루고자 하는 바람에서 나타났다.","a":"자미원 장성","alt":["자미원장성","자미원"]},{"n":"8-②","disp":"유충렬은 천상의 신선(자미원 장성)으로 지내다가 죄를 짓고 지상으로 내려온 인물이다. 전투에 나설 때는 신선의 도술처럼 가공할 파괴력으로 오랑캐를 정벌한다. 유충렬 외에 다른 등장인물들은 선녀가 가지고 온 천상의 과일을 먹고 기력을 찾거나, 난이 닥칠 때마다 꿈을 통해 현실의 위험을 예고받기도 한다. 즉, 〈유충렬전〉 속 환상성은 (   ) 상상력과 민간의 주술적인 신앙이 결합되어 있고, 현실에서 이루지 못하는 일을 이루고자 하는 바람에서 나타났다.","a":"도교적인","alt":["도교적","도교"]},{"n":"8-③","disp":"유충렬은 천상의 신선(자미원 장성)으로 지내다가 죄를 짓고 지상으로 내려온 인물이다. 전투에 나설 때는 신선의 도술처럼 가공할 파괴력으로 오랑캐를 정벌한다. 유충렬 외에 다른 등장인물들은 선녀가 가지고 온 천상의 과일을 먹고 기력을 찾거나, 난이 닥칠 때마다 꿈을 통해 현실의 위험을 예고받기도 한다. 즉, 〈유충렬전〉 속 환상성은 도교적인 상상력과 민간의 (   ) 신앙이 결합되어 있고, 현실에서 이루지 못하는 일을 이루고자 하는 바람에서 나타났다.","a":"주술적인","alt":["주술적","주술"]},{"n":"9-①","disp":"유충렬은 유심의 외아들로 태어났으며, 그 전에는 천상계의 신선이었다. 이는 영웅이 '(   )'으로 태어난다는 것을 뜻한다. 후사가 없 자금을 마련하는 과정과 두 사람의 태도","a":"허생은 한양의 부자 변씨를 찾아가 다짜고짜 만 냥의 돈을 빌려 달라고 요구한다. 변씨는 허생의 허름한 차림새에도 말이 간단하고 눈빛이 오만하며 부끄러운 기색이 없는 것을 보고 만냥을 빌려준다. 허생은 고맙다는 인사도 없이 길을 떠난다.","k":[["변씨"],["만 냥","만냥"],["허름","차림새"],["오만","부끄러운 기색"],["인사"]]},{"n":3,"q":"허생이 안성과 제주도 등에서 행한 경제활동과 이를 통해 돈을 번 원리","a":"허생은 교통과 물류의 요충지인 안성에서 과일을 싹쓸이하여 매점매석한 뒤 고가로 판매해 큰 이윤을 남긴다. 그 돈을 들고 제주도로 건너가 양반들의 망건 재료인 말총을 독점하여 돈을 번다. 조선의 불완전한 유통 구조와 경제적 허약함을 이용한 전략이다.","k":[["안성","과일"],["매점매석","싹쓸이"],["제주","말총","망건"],["유통","허약"]]},{"n":4,"q":"허생이 변산의 도적들을 교화하여 섬으로 데리고 가 이상향을 건설하는 과정","a":"허생은 변산에 들끓던 도적들을 찾아가 그들에게 소와 아내를 얻어주고 빈 섬으로 이주할 것을 제안한다. 도적들과 무인도로 들어간 허생은 농사를 짓게 하고 해외(장기도)와 교역하며 은 백만냥을 버는 등의 이상향을 건설한다. 그후 허생은 '조그만 시험'이 끝났다며 섬의 배를 불태우고 돈 오십만냥을 바닷물 속에 던지고, '화근'을 없앤다며 글을 아는 사람들을 배에 태워 섬을 떠난다.","k":[["변산","도적"],["소","아내","빈 섬"],["장기도","교역","백만"],["배","불태우","오십만"],["화근","글"]]},{"n":5,"q":"허생이 빌린 돈을 갚는 방식과, 어영대장 이완이 허생을 찾아오게 된 계기","a":"허생은 변씨에게 빌린 만 냥의 10배인 십만 냥을 갚는다. 십분의 일의 이자만 쳐서 받겠다는 변씨에게 '나를 장사치로 대접하냐'면서 화를 낸다. 변씨는 허생이 돈을 번 방법을 듣고는 그 비범함에 탄복하고 인재를 찾던 어영대장 이완에게 허생을 추천한다. 이완 대장은 국방과 국가의 인재 등용을 위해 허생의 집을 찾아와 시국에 대한 자문을 구하게 된다.","k":[["십만","10배"],["장사치"],["탄복","비범"],["어영대장","이완"],["자문","인재"]]},{"n":6,"q":"허생이 이완 대장에게 제시한 세 가지 계책(시무책)과 이완의 반응","a":"허생은 북벌론(청나라 반대파)을 주장하는 신하들에게 삼고초려하는 자세로 숨어있는 인재를 등용할 것, 망한 명나라 자손들을 사대부 딸들과 결혼시키고 재산도 나눠줄 것, 사대부 자제들을 청나라로 유학보내어 청나라를 염탐하게 할 것 등의 파격적인 계책을 제시한다. 그러나 이완은 사대부들이 청나라의 변발(머리스타일)과 호복(옷)을 받아들이지 못할 것이라며 거절한다. 허생은 구태의연한 양반 사대부들의 무능함과 위선을 매섭게 혼낸다.","k":[["삼고초려","인재"],["명나라","자손","결혼"],["청나라","유학","염탐"],["변발","호복","거절"],["무능","위선"]]},{"n":7,"q":"이완 대장이 도망친 후 허생의 행방과, 작가가 작품을 통해 전달하고자 한 주제","a":"다음 날 이완이 다시 찾아왔을 때 허생은 어디론가 자취를 숨긴 뒤였다. 작가는 허생전을 통해 당시 조선 사대부들의 허위의식과 무능한 북벌론(청나라 반대파)을 풍자하고 실사구시(實事求是: 사실에 근거하여 진리를 탐구함)의 실학 사상을 강조한다.","k":[["자취","숨"],["허위의식","무능"],["북벌론","북벌"],["실사구시","실학"]]}],"blank":[{"n":"1-①","disp":"(   )이 지은 〈허생전〉은 한문소설이자 풍자소설이다. 작품의 배경은 조선시대 17세기 중반으로, 부를 쌓은 상인들이 득세하며 신분제가 동요하던 사회 분위기가 반영되었다. 이 작품은 풍자적이고 비판적이며 양반계급에 대한 냉소적인 태도를 지닌 작품이다.","a":"박지원","alt":[]},{"n":"1-②","disp":"박지원이 지은 〈허생전〉은 한문소설이자 풍자소설이다. 작품의 배경은 조선시대 (   ) 중반으로, 부를 쌓은 상인들이 득세하며 신분제가 동요하던 사회 분위기가 반영되었다. 이 작품은 풍자적이고 비판적이며 양반계급에 대한 냉소적인 태도를 지닌 작품이다.","a":"17세기","alt":["17"]},{"n":"1-③","disp":"박지원이 지은 〈허생전〉은 한문소설이자 풍자소설이다. 작품의 배경은 조선시대 17세기 중반으로, 부를 쌓은 상인들이 득세하며 (   )가 동요하던 사회 분위기가 반영되었다. 이 작품은 풍자적이고 비판적이며 양반계급에 대한 냉소적인 태도를 지닌 작품이다.","a":"신분제","alt":[]},{"n":"1-④","disp":"박지원이 지은 〈허생전〉은 한문소설이자 풍자소설이다. 작품의 배경은 조선시대 17세기 중반으로, 부를 쌓은 상인들이 득세하며 신분제가 동요하던 사회 분위기가 반영되었다. 이 작품은 풍자적이고 비판적이며 양반계급에 대한 (   ) 태도를 지닌 작품이다.","a":"냉소적인","alt":["냉소적","냉소"]},{"n":"2-①","disp":"특정한 상품을 대량으로 사들였다가 상품이 부족해 가격이 올랐을 때 한꺼번에 팔아 폭리를 취하는 행위를 (   )이라고 한다. 허생이 사들인 과일과 말총은 각각 제사와 예법을 지키기 위해 필요한 물건들(제사과일, 망건)로 허생은 허례허식을 비판하고자 이를 사들였다.","a":"매점매석","alt":["매점 매석"]},{"n":"2-②","disp":"특정한 상품을 대량으로 사들였다가 상품이 부족해 가격이 올랐을 때 한꺼번에 팔아 폭리를 취하는 행위를 매점매석이라고 한다. 허생이 사들인 과일과 (   )은 각각 제사와 예법을 지키기 위해 필요한 물건들(제사과일, 망건)로 허생은 허례허식을 비판하고자 이를 사들였다.","a":"말총","alt":[]},{"n":"2-③","disp":"특정한 상품을 대량으로 사들였다가 상품이 부족해 가격이 올랐을 때 한꺼번에 팔아 폭리를 취하는 행위를 매점매석이라고 한다. 허생이 사들인 과일과 말총은 각각 제사와 예법을 지키기 위해 필요한 물건들(제사과일, 망건)로 허생은 (   )을 비판하고자 이를 사들였다.","a":"허례허식","alt":["허례 허식"]},{"n":"3-①","disp":"허생은 가난 때문에 어쩔 수 없이 도적이 된 사람들을 '(   )'으로 데려가 살아가는 데 필요한 최소한의 조건을 마련해주고 이를 바탕으로 부족함 없이 살 수 있도록 돕는 이용후생(利用厚生)의 실학사상을 펼쳤다.","a":"빈 섬","alt":["빈섬"]},{"n":"3-②","disp":"허생은 가난 때문에 어쩔 수 없이 도적이 된 사람들을 '빈 섬'으로 데려가 살아가는 데 필요한 최소한의 조건을 마련해주고 이를 바탕으로 부족함 없이 살 수 있도록 돕는 (   )(利用厚生)의 실학사상을 펼쳤다.","a":"이용후생","alt":["이용후생(利用厚生)"]},{"n":"3-③","disp":"허생은 가난 때문에 어쩔 수 없이 도적이 된 사람들을 '빈 섬'으로 데려가 살아가는 데 필요한 최소한의 조건을 마련해주고 이를 바탕으로 부족함 없이 살 수 있도록 돕는 이용후생(利用厚生)의 (   )을 펼쳤다.","a":"실학사상","alt":["실학 사상","실학"]},{"n":"4-①","disp":"허생은 양반이지만 매점매석이라는 비정상적인 장사로 돈을 번다. 한 명이 전국의 물건값을 좌지우지했다는 것은 당시의 (   )가 얼마나 취약했는지 보여준다. 허생 때문에 전국의 과일과 망건이 모두 동이 난다. 양반들은 제사를 지내지 못하고 예법을 지키지 못한다. 이는 작가가 양반의 허례허식을 간접적으로 비판한 것이라고 볼 수 있다.","a":"경제구조","alt":["경제 구조"]},{"n":"4-②","disp":"허생은 양반이지만 매점매석이라는 비정상적인 장사로 돈을 번다. 한 명이 전국의 물건값을 좌지우지했다는 것은 당시의 경제구조가 얼마나 (   )했는지 보여준다. 허생 때문에 전국의 과일과 망건이 function save(){
  const v=JSON.stringify(ST);
  try{ if(window.storage) window.storage.set(KEY,v); }catch(e){}
  try{ localStorage.setItem(KEY,v); }catch(e){}
}

const el=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key=(w,set,i)=>w.id+":"+set+":"+i;
const nDone=(w,set)=>w[set].filter((_,i)=>ST.passed[key(w,set,i)]).length;
const nAll=w=>ORDER.reduce((a,x)=>a+w[x].length,0);
const nDoneAll=w=>ORDER.reduce((a,x)=>a+nDone(w,x),0);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function getQ(w,set,i){
  const e=ST.edits[key(w,set,i)];
  return e?Object.assign({},w[set][i],e):w[set][i];
}
function norm(s){return String(s||"").toLowerCase().replace(/[\s,.\u00b7'"`~!?()\[\]{}<>:;\-–—…·「」『』〈〉①②③④]/g,"");}

function gradeBlank(text,q){
  const t=norm(text);
  const ok = t.length>0 && [q.a].concat(q.alt||[]).some(x=>norm(x)===t);
  return {hit:ok?[q.a]:[],miss:ok?[]:[q.a],bad:[],tooShort:false,ok};
}
function grade(text,q){
  if(!q.k) return gradeBlank(text,q);
  const t=norm(text), hit=[], miss=[];
  q.k.forEach(g=>{ (g.some(w=>t.includes(norm(w)))?hit:miss).push(g[0]); });
  const bad=(q.x||[]).filter(w=>w&&t.includes(norm(w)));
  const allowed = ST.mode==="strict" ? 0 : (q.k.length>=4 ? 1 : 0);
  const isShort = t.length<20;
  return {hit,miss,bad,tooShort:isShort,ok:!isShort && !bad.length && miss.length<=allowed};
}

/* ---------- 홈 ---------- */
function home(){
  cur=null;
  const worksDone=WORKS.filter(w=>nDoneAll(w)===nAll(w)).length;
  const qDone=WORKS.reduce((s,w)=>s+nDoneAll(w),0);
  const qAll=WORKS.reduce((s,w)=>s+nAll(w),0);
  const nEdit=Object.keys(ST.edits||{}).length;

  const rows=WORKS.map(w=>{
    const d=nDoneAll(w), a=nAll(w), full=d===a, open=openId===w.id;
    return '<div class="row'+(full?" done":"")+'">'
      +'<button class="rowhead" data-open="'+w.id+'"><span class="nm"><b>'+w.name+'</b>'
      +'<span>줄거리 '+w.story.length+'문항 · 이론 빈칸 '+w.blank.length+'개</span></span>'
      +'<span class="frac">'+d+' / '+a+'</span>'+(full?'<span class="mark">通</span>':'')+'</button>'
      +'<div class="panel'+(open?" open":"")+'"><div class="panel-in">'
      + ORDER.map(x=>setBtn(w,x)).join("")
      +'</div></div><span class="track"><i data-fill="'+(d/a*100)+'"></i></span></div>';
  }).join("");

  const missList=Object.entries(ST.miss).map(([k,v])=>{
    const p=k.split(":"), w=WORKS.find(x=>x.id===p[0]);
    if(!w||!w[p[1]]||!w[p[1]][+p[2]]) return null;
    const q=w[p[1]][+p[2]];
    return {w:w.name,set:SETNAME[p[1]],n:q.n,q:(p[1]==="blank"?q.disp:q.q),c:v};
  }).filter(Boolean).sort((a,b)=>b.c-a.c).slice(0,6);

  el("app").innerHTML=
    '<div class="top"><h1>고전소설 연습장</h1>'
    +'<div class="sub">9월 8일 수행평가 · 선생님 배부 답안 기준 · '+qAll+'문항</div>'
    +'<div class="by">만든 사람 · 안태현</div></div><div class="hr"></div>'
    +'<div class="tally"><span class="big">'+worksDone+'</span><span class="of">/ '+WORKS.length+' 작품 통과</span>'
    +'<span class="of" style="margin-left:auto">'+qDone+' / '+qAll+' 문항</span></div>'
    +'<div class="allbox">'    +'<button class="allbtn" data-all="story"><b>전체 작품 줄거리 랜덤</b><span>'+allDone('story')+' / '+allTotal('story')+'</span></button>'    +'<button class="allbtn" data-all="blank"><b>전체 작품 이론 빈칸 랜덤</b><span>'+allDone('blank')+' / '+allTotal('blank')+'</span></button></div>'    +'<div class="rows">'+rows+'</div>'
    +'<div class="nb"><h3>오답 노트</h3><p class="cap">틀린 횟수가 많은 순서예요.</p>'
    +(missList.length?missList.map(m=>'<div class="miss"><span class="n">'+m.c+'회</span><div><em>'
        +m.w+' · '+m.set+' '+m.n+'번</em>'+esc(m.q)+'</div></div>').join("")
      :'<p class="none">아직 없어요. 작품을 골라 시작해 보세요.</p>')
    +'</div><div class="foot">'
    +'<select id="mode"><option value="normal"'+(ST.mode==="normal"?" selected":"")+'>보통 채점</option>'
    +'<option value="strict"'+(ST.mode==="strict"?" selected":"")+'>엄격 채점</option></select>'
    +'<span style="font-size:12px;color:var(--ink-3)">'+(ST.mode==="strict"?"핵심어가 모두 있어야 통과":"서술형은 핵심어 1개까지 봐줌")+'</span>'
    +(nEdit?'<button class="tinybtn" id="dump">고친 답안 '+nEdit+'개 내보내기</button>':'')
    +'<button class="tinybtn'+(armed?" danger":"")+'" id="wipe" style="margin-left:auto">'
    +(armed?"정말 지울까요? 한 번 더 누르기":"기록 지우기")+'</button>'
    +'<div id="dumpbox" style="width:100%"></div></div>';

  requestAnimationFrame(()=>document.querySelectorAll("[data-fill]").forEach(b=>b.style.width=b.dataset.fill+"%"));
  document.querySelectorAll("[data-all]").forEach(b=>b.onclick=()=>startAll(b.dataset.all));
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{openId=openId===b.dataset.open?null:b.dataset.open;home();});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const p=b.dataset.go.split(":");start(p[0],p[1]);});
  el("mode").onchange=e=>{ST.mode=e.target.value;save();home();};
  el("wipe").onclick=()=>{
    if(!armed){armed=true;home();setTimeout(()=>{armed=false;},4000);return;}
    ST.passed={};ST.miss={};armed=false;save();home();
  };
  if(el("dump")) el("dump").onclick=()=>{
    el("dumpbox").innerHTML='<textarea class="dump" readonly>'+esc(JSON.stringify(ST.edits,null,1))+'</textarea>';
    el("dumpbox").querySelector("textarea").select();
  };
}
const allTotal = set=>WORKS.reduce((a,w)=>a+w[set].length,0);
const allDone  = set=>WORKS.reduce((a,w)=>a+nDone(w,set),0);
function setBtn(w,set){
  const d=nDone(w,set), a=w[set].length;
  return '<button class="pill'+(d===a?" full":"")+'" data-go="'+w.id+':'+set+'"><b>'+SETS[set]+'</b><span>'+d+' / '+a+' 통과</span></button>';
}

/* ---------- 풀이 ---------- */
function begin(items,title,set){
  cur={items:null,title:title,set:set,queue:shuffle(items),total:items.length,cleared:0,last:null};
  ask();
}
function start(wid,set){
  const w=WORKS.find(x=>x.id===wid);
  let todo=w[set].map((_,i)=>i).filter(i=>!ST.passed[key(w,set,i)]);
  if(!todo.length){ w[set].forEach((_,i)=>delete ST.passed[key(w,set,i)]); todo=w[set].map((_,i)=>i); }
  cur={backTo:w.id};
  begin(todo.map(i=>({w:w,set:set,i:i})), w.name, set);
  cur.backTo=w.id;
}
function startAll(set){
  let todo=[];
  WORKS.forEach(w=>w[set].forEach((_,i)=>{ if(!ST.passed[key(w,set,i)]) todo.push({w:w,set:set,i:i}); }));
  if(!todo.length){
    WORKS.forEach(w=>w[set].forEach((_,i)=>delete ST.passed[key(w,set,i)]));
    WORKS.forEach(w=>w[set].forEach((_,i)=>todo.push({w:w,set:set,i:i})));
  }
  begin(todo, "전체 작품", set);
  cur.all=true;
}
function shell(inner){
  const pct=cur.total?cur.cleared/cur.total*100:0;
  el("app").innerHTML=
    '<div class="qtop"><button class="back" id="back">←</button><span class="where">'+cur.title+' · '+SETS[cur.set]+'</span>'
    +'<span class="count">'+cur.cleared+' / '+cur.total+'</span></div>'
    +'<div class="pbar"><i style="width:'+pct+'%"></i></div><div class="fade">'+inner+'</div>';
  el("back").onclick=()=>{ openId=cur.backTo||null; home(); };
}
function ask(){
  if(!cur.queue.length) return finish();
  const it=cur.queue[0], q=getQ(it.w,it.set,it.i), isB=it.set==="blank";
  shell(
    (cur.all?'<p class="hint" style="text-align:left;margin:22px 0 -14px">'+esc(it.w.name)+'</p>':'')
    +'<p class="q'+(isB?" small":"")+'">'
    +(isB?q.disp.replace(/\(\s*\)/,'<span class="gap">(&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)</span>'):esc(q.q))+'</p>'
    +(isB?'<input id="ans" class="fill" placeholder="빈칸에 들어갈 말" autocomplete="off">'
        :'<textarea id="ans" placeholder="문장으로 써 보세요."></textarea>')
    +'<div class="actions"><button class="btn" id="go">채점하기</button></div>'
    +'<p class="hint">'+it.w.name+' '+SETNAME[it.set]+' '+q.n+'번 · 남은 문제 '+cur.queue.length+'개</p>'
  );
  const t=el("ans"); t.focus();
  el("go").onclick=check;
  t.onkeydown=e=>{ if(e.key==="Enter"&&(isB||e.metaKey||e.ctrlKey)){e.preventDefault();check();} };
}
function check(){
  const it=cur.queue[0];
  cur.last={it:it,mine:el("ans").value};
  apply(grade(cur.last.mine,getQ(it.w,it.set,it.i)).ok,true);
}
function same(a,b){ return a.w.id===b.w.id && a.set===b.set && a.i===b.i; }
function apply(ok,auto){
  const it=cur.last.it, q=getQ(it.w,it.set,it.i), k=key(it.w,it.set,it.i), mine=cur.last.mine;
  const r=grade(mine,q), isB=it.set==="blank";
  if(!auto){
    if(cur.last.ok&&!ok){ delete ST.passed[k]; cur.cleared=Math.max(0,cur.cleared-1);
      ST.miss[k]=(ST.miss[k]||0)+1; if(!cur.queue.some(x=>same(x,it))) cur.queue=cur.queue.concat([it]); }
    if(!cur.last.ok&&ok){ ST.passed[k]=true; cur.cleared++;
      if(ST.miss[k]){ST.miss[k]--; if(!ST.miss[k]) delete ST.miss[k];}
      cur.queue=cur.queue.filter(x=>!same(x,it)); }
  }else{
    if(ok){ ST.passed[k]=true; cur.queue=cur.queue.slice(1); cur.cleared++; }
    else{ ST.miss[k]=(ST.miss[k]||0)+1; cur.queue=cur.queue.slice(1).concat([it]); }
  }
  cur.last.ok=ok; save();

  const chips=isB?"":(r.hit.map(x=>'<span class="chip">'+esc(x)+'</span>').join("")
                     +r.miss.map(x=>'<span class="chip miss">'+esc(x)+'</span>').join(""));
  let why;
  if(!auto) why=ok?'직접 맞은 걸로 표시함':'직접 틀린 걸로 표시함';
  else if(isB) why=ok?'정확히 맞혔어요':'뒤에서 다시 나와요';
  else if(ok) why='핵심어 '+r.hit.length+' / '+q.k.length+'개';
  else if(r.bad.length) why='틀린 표현: '+r.bad.join(", ");
  else if(r.tooShort) why='답이 너무 짧아요';
  else why='빠진 핵심어 '+r.miss.length+'개 · 뒤에서 다시 나와요';

  shell(
    '<div class="verdict'+(ok?"":" no")+'"><h2>'+(ok?"통과":"다시")+'</h2><p>'+why+'</p></div>'
    +'<p class="hint" style="text-align:left;margin:14px 0 -10px">'+esc(it.w.name)+' · '+SETNAME[it.set]+' '+q.n+'번</p>'
    +'<p class="q small" style="margin:16px 0 0">'
    +(isB?q.disp.replace(/\(\s*\)/,'<span class="gap">( '+esc(q.a)+' )</span>'):esc(q.q))+'</p>'
    +(chips?'<div class="chips">'+chips+'</div>':'')
    +'<p class="sect">내가 쓴 답</p><div class="mine">'+esc(mine||"(빈칸)")+'</div>'
    +(isB?((q.alt||[]).length?'<p class="sect">허용 표기</p><div class="mine">'+esc(q.alt.join(", "))+'</div>':'')
        :'<p class="sect">선생님 답안</p><div class="model">'+esc(q.a)+'</div>')
    +'<div class="judge"><p class="ask">'+(isB?'표기만 다른 정답이면 아래에서 맞은 걸로 바꿔 주세요.':'핵심어만 보고 매긴 점수예요. 답안과 뜻이 같은지 직접 확인해 주세요.')+'</p><div class="set">'
    +'<button class="flip'+(ok?" on":"")+'" data-flip="1">맞은 걸로 하기</button>'
    +'<button class="flip warn'+(ok?"":" on")+'" data-flip="0">틀린 걸로 하기</button>'
    +(isB?'':'<button class="flip small" id="edit">채점 기준 고치기</button>')
    +'</div></div>'
    +'<div class="actions"><button class="btn" id="next">'+(cur.queue.length?"다음 문제":"마치기")+'</button></div>'
  );
  document.querySelectorAll("[data-flip]").forEach(b=>b.onclick=()=>{
    const v=b.dataset.flip==="1"; if(v!==cur.last.ok) apply(v,false);
  });
  if(el("edit")) el("edit").onclick=()=>editor(it);
  el("next").onclick=ask;
  window.scrollTo(0,0);
}

function editor(it){
  const q=getQ(it.w,it.set,it.i), k=key(it.w,it.set,it.i), edited=!!ST.edits[k];
  shell(
    '<div class="ed"><p class="q small" style="margin:8px 0 0">'+esc(q.q)+'</p>'
    +'<label>선생님 답안 (그대로 두는 걸 권장)</label><textarea class="a" id="e-a">'+esc(q.a)+'</textarea>'
    +'<label>핵심어 — 한 줄에 한 개. 같은 뜻으로 인정할 말은 쉼표로 나열</label>'
    +'<textarea class="k" id="e-k">'+esc(q.k.map(g=>g.join(", ")).join("\n"))+'</textarea>'
    +'<label>이 말이 있으면 무조건 오답 — 쉼표로 나열 (비워도 됨)</label>'
    +'<textarea class="x" id="e-x">'+esc((q.x||[]).join(", "))+'</textarea>'
    +'<p class="note">핵심어가 너무 빡세거나 느슨할 때만 손대세요.</p>'
    +'<div class="actions"><button class="btn" id="e-save">저장</button>'
    +'<button class="btn line" id="e-cancel">취소</button></div>'
    +(edited?'<div class="actions" style="margin-top:8px"><button class="btn line" id="e-undo">원래대로 되돌리기</button></div>':'')
    +'</div>'
  );
  const back=()=>{ if(cur.last&&same(cur.last.it,it)) apply(grade(cur.last.mine,getQ(it.w,it.set,it.i)).ok,true); else ask(); };
  el("e-save").onclick=()=>{
    const a=el("e-a").value.trim();
    const ks=el("e-k").value.split("\n").map(l=>l.split(",").map(s=>s.trim()).filter(Boolean)).filter(g=>g.length);
    const xs=el("e-x").value.split(",").map(s=>s.trim()).filter(Boolean);
    if(!a||!ks.length){el("e-a").focus();return;}
    ST.edits[k]={a,k:ks,x:xs}; save(); back();
  };
  el("e-cancel").onclick=()=>{ if(cur.last&&same(cur.last.it,it)) apply(cur.last.ok,false); else ask(); };
  if(edited) el("e-undo").onclick=()=>{ delete ST.edits[k]; save(); back(); };
}

function finish(){
  const set=cur.set, isAll=!!cur.all;
  const w = isAll ? null : WORKS.find(x=>x.id===cur.backTo);
  const whole = w ? nDoneAll(w)===nAll(w) : false;
  if(w) openId=w.id;
  home();
  const v=document.createElement("div"); v.className="veil";
  const head = isAll ? "全" : (whole?"通":"半");
  const title = isAll ? ("전체 " + SETNAME[set] + " 완주") : (w.name + (whole?" 통과":" · "+SETS[set]+" 완료"));
  const sub = isAll ? "10작품 " + SETNAME[set] + " 문제를 모두 맞혔어요."
                    : (whole?"줄거리와 이론을 모두 맞혔어요.":"남은 쪽도 마저 풀어 보세요.");
  v.innerHTML='<div class="card"><div class="seal">'+head+'</div><h3>'+title+'</h3><p>'+sub
    +'</p><button class="btn" id="ok">목록으로</button></div>';
  document.body.appendChild(v);
  v.querySelector("#ok").onclick=()=>v.remove();
}

load().then(home);
</script>
</body>
