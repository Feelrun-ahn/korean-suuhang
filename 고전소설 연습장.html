<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고전소설 연습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfbf9;
  --ink:#16191d;
  --ink-2:#5c6169;
  --ink-3:#9aa0a8;
  --rule:#e4e4de;
  --rule-2:#f0f0ea;
  --mark:#b03a2b;
  --mark-bg:#faefec;
  --ok-bg:#eef1ee;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  font-size:15px;line-height:1.62;letter-spacing:-.1px;
}
.serif{font-family:"Noto Serif KR",serif}
.wrap{max-width:620px;margin:0 auto;padding:0 20px 56px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px}

/* top ------------------------------------------------ */
.top{padding:26px 0 14px}
.top h1{font-family:"Noto Serif KR",serif;font-weight:600;font-size:21px;margin:0;letter-spacing:-.6px}
.top .sub{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.top .by{font-size:10.5px;color:var(--ink-3);margin-top:6px;letter-spacing:.2px}

.judge{margin-top:18px;padding:13px 0 0;border-top:1px solid var(--rule-2)}
.judge .ask{font-size:12.5px;color:var(--ink-2);margin:0 0 9px}
.judge .set{display:flex;gap:8px;flex-wrap:wrap}
.flip{
  padding:8px 13px;border:1px solid var(--rule);border-radius:20px;background:#fff;
  font-size:12.5px;color:var(--ink-2);transition:border-color .15s,color .15s;
}
.flip:hover{border-color:var(--ink-3)}
.flip.on{border-color:var(--ink);color:var(--ink);font-weight:500}
.flip.warn.on{border-color:var(--mark);color:var(--mark)}
.flip.small{font-size:12px;padding:7px 11px}

.ed label{display:block;font-size:11.5px;color:var(--ink-3);margin:16px 0 5px}
.ed textarea{min-height:auto}
.ed textarea.a{min-height:110px}
.ed textarea.k{min-height:130px;font-size:14px;line-height:1.75}
.ed textarea.x{min-height:56px;font-size:14px}
.ed .note{font-size:11.5px;color:var(--ink-3);line-height:1.6;margin:5px 0 0}
.dump{width:100%;min-height:120px;font-size:11px;font-family:ui-monospace,monospace;margin-top:10px;
      border:1px solid var(--rule);border-radius:7px;padding:10px;background:#fff;color:var(--ink-2)}
.hr{height:1px;background:var(--rule);margin:0}

.tally{display:flex;align-items:baseline;gap:6px;padding:14px 0 4px}
.tally .big{font-family:"Noto Serif KR",serif;font-size:26px;font-weight:600;line-height:1}
.tally .of{font-size:13px;color:var(--ink-3)}

/* work rows ------------------------------------------ */
.rows{margin-top:8px}
.row{border-top:1px solid var(--rule-2);position:relative}
.row:first-child{border-top:1px solid var(--rule)}
.rowhead{
  width:100%;background:none;border:0;padding:15px 0 15px;
  display:flex;align-items:center;gap:14px;text-align:left;
}
.rowhead .nm{flex:1;min-width:0}
.rowhead .nm b{font-family:"Noto Serif KR",serif;font-size:17px;font-weight:600;display:block;letter-spacing:-.3px}
.rowhead .nm span{font-size:11.5px;color:var(--ink-3)}
.frac{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.done .frac{color:var(--ink)}
.mark{
  flex:none;width:26px;height:26px;border:1.5px solid var(--mark);border-radius:4px;
  display:grid;place-items:center;color:var(--mark);
  font-family:"Noto Serif KR",serif;font-size:14px;font-weight:600;
}
.track{position:absolute;left:0;bottom:0;height:1.5px;width:100%;background:transparent}
.track i{display:block;height:100%;background:var(--ink);width:0;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* accordion ------------------------------------------ */
.panel{overflow:hidden;max-height:0;transition:max-height .28s cubic-bezier(.4,0,.2,1)}
.panel.open{max-height:200px}
.panel-in{padding:2px 0 16px;display:flex;gap:8px}
.pill{
  flex:1;border:1px solid var(--rule);background:#fff;border-radius:7px;
  padding:10px 12px;text-align:left;transition:border-color .15s;
}
.pill:hover{border-color:var(--ink-3)}
.pill b{display:block;font-size:13.5px;font-weight:500}
.pill span{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pill.full{border-color:var(--rule);background:var(--ok-bg)}

/* quiz ----------------------------------------------- */
.qtop{display:flex;align-items:center;gap:10px;padding:20px 0 12px}
.back{background:none;border:0;padding:4px 8px 4px 0;color:var(--ink-2);font-size:19px;line-height:1}
.qtop .where{flex:1;font-size:12.5px;color:var(--ink-3)}
.qtop .count{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pbar{height:2px;background:var(--rule-2)}
.pbar i{display:block;height:100%;background:var(--ink);transition:width .4s cubic-bezier(.4,0,.2,1)}

.fade{animation:fade .22s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}

.q{
  font-family:"Noto Serif KR",serif;font-size:19px;font-weight:400;line-height:1.62;
  margin:26px 0 20px;letter-spacing:-.3px;
}
textarea{
  width:100%;min-height:170px;padding:14px;font:inherit;font-size:15.5px;line-height:1.7;
  border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink);resize:vertical;
  transition:border-color .15s;
}
textarea::placeholder{color:var(--ink-3)}
textarea:focus{outline:none;border-color:var(--ink)}
.actions{margin-top:12px;display:flex;gap:8px}
.btn{
  flex:1;padding:13px;border:1px solid var(--ink);border-radius:8px;
  background:var(--ink);color:#fff;font-size:15px;font-weight:500;
  transition:opacity .15s;
}
.btn:active{opacity:.8}
.btn.line{background:transparent;color:var(--ink-2);border-color:var(--rule);font-weight:400}
.hint{font-size:11.5px;color:var(--ink-3);text-align:center;margin-top:10px}

/* result --------------------------------------------- */
.verdict{display:flex;align-items:baseline;gap:9px;margin:22px 0 4px}
.verdict h2{font-family:"Noto Serif KR",serif;font-size:22px;font-weight:600;margin:0;letter-spacing:-.5px}
.verdict.no h2{color:var(--mark)}
.verdict p{margin:0;font-size:12.5px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:14px 0 0}
.chip{font-size:12px;padding:3.5px 9px;border-radius:13px;border:1px solid var(--rule);color:var(--ink-2)}
.chip.miss{border-color:var(--mark);background:var(--mark-bg);color:var(--mark);font-weight:500}
.sect{font-size:11.5px;color:var(--ink-3);margin:22px 0 6px}
.model{
  font-family:"Noto Serif KR",serif;font-size:15.5px;line-height:1.78;
  border-left:2px solid var(--ink);padding:2px 0 2px 14px;
}
.mine{font-size:14px;color:var(--ink-2);white-space:pre-wrap;padding:2px 0 2px 14px;border-left:2px solid var(--rule)}

/* notebook ------------------------------------------- */
.nb{margin-top:34px}
.nb h3{font-family:"Noto Serif KR",serif;font-size:15px;font-weight:600;margin:0 0 2px}
.nb .cap{font-size:12px;color:var(--ink-3);margin:0 0 8px}
.miss{display:flex;gap:11px;padding:10px 0;border-top:1px solid var(--rule-2);font-size:13.5px;line-height:1.5}
.miss .n{flex:none;font-size:11.5px;color:var(--mark);font-variant-numeric:tabular-nums;padding-top:2px;min-width:26px}
.miss em{display:block;font-style:normal;font-size:11px;color:var(--ink-3)}
.none{font-size:13px;color:var(--ink-3);padding:8px 0}

.foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tinybtn{background:none;border:0;padding:4px 0;font-size:12.5px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
.tinybtn.danger{color:var(--mark)}
select{
  font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--rule);
  border-radius:6px;background:#fff;color:var(--ink-2);
}

/* seal ----------------------------------------------- */
.veil{position:fixed;inset:0;background:rgba(22,25,29,.5);display:grid;place-items:center;padding:26px;z-index:40;animation:fade .2s ease both}
.card{background:var(--bg);border-radius:12px;padding:32px 26px 24px;text-align:center;max-width:320px;width:100%}
.seal{
  width:104px;height:104px;margin:0 auto 18px;border:5px solid var(--mark);border-radius:10px;
  display:grid;place-items:center;color:var(--mark);
  font-family:"Noto Serif KR",serif;font-weight:600;font-size:50px;
  animation:stamp .42s cubic-bezier(.2,1.5,.45,1) both;
}
@keyframes stamp{
  0%{transform:scale(1.7) rotate(-12deg);opacity:0}
  55%{transform:scale(.95) rotate(2deg);opacity:1}
  100%{transform:scale(1) rotate(-2.5deg);opacity:1}
}
.card h3{font-family:"Noto Serif KR",serif;font-size:19px;font-weight:600;margin:0 0 5px}
.card p{font-size:13px;color:var(--ink-3);margin:0 0 20px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const DATA = {"works":[{"id":"bari","name":"바리데기","sub":"서사무가 · 무조 신화","story":[{"n":1,"q":"바리데기가 태어나자마자 버려지게 된 원인과 그 과정","a":"아들을 간절히 바라던 오구대왕과 길대부인 사이에서 딸만 여섯이 태어난 뒤, 일곱째도 딸로 태어나자 왕이 크게 분노한다. 결국 옥함에 넣어 강물에 버려졌고, 비리공덕 할아비·할미가 건져 길러낸다.","k":[["아들"],["일곱째","일곱번째","막내","7째","일곱번"],["옥함","강물","바다"],["버려","버렸","버림","버리"]]},{"n":2,"q":"바리데기가 자신을 버린 부모를 위해 목숨을 건 여정을 결심하게 된 계기","a":"부모가 병들어 죽게 되었는데, 서천서역국의 약수만이 살릴 수 있다는 말을 듣는다. 여섯 언니가 모두 거절하자, 버려진 자신을 낳아준 은혜를 갚겠다며 바리데기가 스스로 나선다.","k":[["병","죽"],["약수","생명수","서천서역국"],["언니","여섯"],["은혜","효","낳아준","보답","갚"]]},{"n":3,"q":"바리데기가 서천서역국으로 가는 길에 겪은 시련과 이를 극복하는 과정","a":"이승과 저승의 경계인 험한 길을 지나며 빨래하기·밭 갈기 같은 고된 일을 요구받고, 지옥의 강과 수많은 망자를 거쳐야 했다. 바리데기는 요구를 모두 성실히 수행하고 부처가 준 낙화와 금방울 같은 신이한 조력을 얻어 길을 이어간다.","k":[["저승","이승","경계","지옥"],["빨래","밭","일","노동"],["꽃","낙화","부처","금방울","도움","조력"]]},{"n":4,"q":"바리데기가 생명수(약려수)를 얻기 위해 무장승(무장신선)에게 제시받은 조건과 이를 수행한 내용","a":"무장승은 길값으로 나무하기 3년, 삼값으로 불 때기 3년, 물값으로 물 긷기 3년 — 도합 9년의 노동을 요구한다. 이어 배필이 되어 아들 일곱을 낳아 달라고 요구했고, 바리데기는 이 모두를 수행한 끝에 자신이 길어 나르던 물이 곧 약수였음을 알게 된다.","k":[["나무"],["불"],["물"],["9년","구년","아홉"],["아들","일곱"]]},{"n":5,"q":"약수를 가지고 돌아온 바리데기가 부모를 다시 살려내는 과정","a":"돌아와 보니 부모는 이미 죽어 상여가 나가는 중이었다. 바리데기는 상여를 막아서서 관을 열고 약수를 입에 흘려 넣고 뼈살이꽃·살살이꽃·피살이꽃을 시신에 놓아 부모를 되살린다.","k":[["상여","장례","죽"],["약수","입"],["꽃"],["살려","되살","살아"]]},{"n":6,"q":"부모를 구한 후 바리데기가 왕의 보상을 사양하고 어떤 존재가 되었는지","a":"왕이 나라와 재산의 반을 주겠다 했으나 바리데기는 이를 모두 사양한다. 대신 죽은 이의 넋을 저승으로 인도하는 무조신(오구신)이 되기를 청해 무당의 시조신으로 좌정한다.","k":[["사양","거절","마다"],["반","나라","재산"],["무조신","오구신","무당","신"],["인도","넋","저승","좌정"]]},{"n":7,"q":"전체 줄거리를 '출생과 버려짐', '서천서역국 여정과 부모 구원', '신으로의 좌정(결말)' 단계가 모두 포함되도록 3문장으로 서술","a":"아들을 원하던 오구대왕은 일곱째 딸로 태어난 바리데기를 옥함에 넣어 버렸다. 훗날 부모가 병들자 바리데기는 홀로 서천서역국으로 떠나 무장승의 9년 노동과 출산의 시련을 견디고 약수를 얻어 부모를 되살렸다. 그러나 왕이 내리는 보상을 사양하고, 죽은 이를 저승으로 인도하는 무조신으로 좌정하였다.","k":[["버려","버렸","옥함"],["서천서역국","약수"],["부모","되살","살려"],["무조신","신","좌정"]]}],"theory":[{"n":1,"q":"설화란 무엇이며 〈바리데기〉는 그중 어디에 해당하는가","a":"설화는 일정한 구조를 갖추고 입에서 입으로 전해지는 꾸며낸 이야기로, 신화·전설·민담으로 나뉜다. 〈바리데기〉는 무당이 굿에서 구연하는 무속 신화에 해당하며, 신의 내력을 밝히는 본풀이다.","k":[["구전","입","전승"],["신화","전설","민담"],["무속","무가","본풀이"]]},{"n":2,"q":"〈바리데기〉의 갈래, 성격, 주제","a":"갈래는 서사무가(무속 신화)이자 구비 서사시다. 성격은 서사적·무속적·신화적·주술적이며, 주제는 부모를 위한 희생과 효, 그리고 바리데기가 무조신으로 좌정하게 된 내력이다.","k":[["서사무가","무가"],["무속","신화","주술"],["효","희생"],["무조신","좌정","내력"]]},{"n":3,"q":"인물 설명 — 오구대왕, 길대부인, 석가세존, 바리데기, 무장신선","a":"오구대왕은 아들만 바라다 딸을 버리는 가부장적 인물로 뒤에 병들어 딸에게 구원받는다. 길대부인은 딸을 버리는 데 동조하나 끝내 슬퍼하는 어머니이며, 석가세존은 버려진 바리데기를 돕고 여정을 인도하는 초월적 조력자다. 바리데기는 버림받고도 희생으로 부모를 살려 신이 되는 주인공이고, 무장신선은 약수를 지키며 시련을 부과하는 시험자이자 남편이다.","k":[["오구대왕","가부장","아들"],["길대부인","어머니"],["석가세존","부처","조력"],["바리데기","희생","주인공"],["무장","약수","시련"]]},{"n":4,"q":"〈바리데기〉에 나타난 서사 구조의 특징","a":"영웅의 일대기 구조를 따르면서 '결핍 → 시련 → 성취 → 좌정'으로 이어지는 순환 구조를 보인다. 버림받음과 구원, 죽음과 재생이 대립적으로 짝을 이루고, 유사한 사건과 표현이 반복되어 구연에 알맞게 짜여 있다.","k":[["영웅","일대기"],["시련","성취","결핍"],["반복","대립","순환"],["죽음","재생","구원"]]},{"n":5,"q":"무가의 특징","a":"굿판에서 무당이 신을 향해 구연하는 노래로 신성성과 주술성을 지닌다. 구비 전승되어 지역과 구연자마다 판본이 다르고, 율문체와 반복적 표현이 두드러지며 오락성과 문학성도 함께 지닌다.","k":[["굿","무당","구연"],["신성","주술"],["구비","전승","판본"],["율문","반복","오락"]]},{"n":6,"q":"〈바리데기〉에 나타난 영웅의 일대기 구조","a":"고귀한 혈통(왕의 딸)으로 태어나 기자치성이라는 비정상적 출생 과정을 거치고, 어려서 버려지는 위기를 맞는다. 비리공덕 부부라는 조력자에게 구출·양육된 뒤 서천서역국 여정이라는 성장 후의 시련을 겪고, 이를 극복해 신적 존재로 좌정한다.","k":[["고귀","혈통","왕"],["출생","기자","치성"],["버려","위기"],["조력","구출","양육"],["극복","좌정","승리"]]},{"n":7,"q":"〈바리데기〉의 노동과 출산의 의미","a":"9년의 노동과 일곱 아들의 출산은 당시 여성이 감당하던 삶 자체를 압축해 보여 준다. 이 고된 일상이 생명수를 얻는 조건이 됨으로써, 평범한 여성의 노동과 출산이 신성한 가치로 격상된다.","k":[["9년","노동","일"],["출산","아들","일곱"],["여성","삶"],["신성","가치","생명"]]},{"n":8,"q":"〈바리데기〉의 희생에 담긴 의미","a":"가장 버림받은 존재가 오히려 자신을 버린 부모를 구원한다는 역설이 담겨 있다. 이 희생은 단순한 효를 넘어 스스로 신성을 얻는 과정이며, 죽음을 넘어 생명을 회복시키는 힘으로 그려진다.","k":[["버림","역설"],["구원","살"],["효"],["신성","신","생명"]]},{"n":9,"q":"〈바리데기〉의 문학적 성취","a":"우리 무속 신화를 대표하는 작품으로, 여성을 주체적인 영웅으로 내세운 드문 서사다. 죽음과 재생이라는 원형적 주제를 갖추고 구비 서사시로서 완결된 구조와 풍부한 표현을 지녀 후대 문학과 예술에 널리 활용된다.","k":[["무속","신화","대표"],["여성","영웅","주체"],["죽음","재생","원형"],["구비","서사","구조"]]}]},{"id":"guk","name":"국선생전","sub":"이규보 · 가전체(술 의인화)","story":[{"n":1,"q":"주인공 '국성(술)'의 가계적 배경과 성품, 그리고 조정에 등용되는 계기","a":"국성은 주천 고을 사람으로, 할아버지는 모(보리), 아버지는 차(흰 술)이며 어머니는 곡씨(곡식)의 딸이다. 어려서부터 도량이 넓고 맑아 유영·도잠 같은 이들과 사귀며 이름을 떨쳤고, 그 향기로운 명성을 들은 임금이 불러들여 벼슬을 내린다.","k":[["모","보리"],["차","흰술","흰 술"],["곡","곡식"],["도량","성품","넓"],["임금","벼슬","등용"]]},{"n":2,"q":"국성이 조정에 들어가 임금의 총애를 받으며 행한 역할과 그로 인해 조정에 일어난 변화","a":"임금은 그를 이름 대신 '국선생'이라 부르며 가마를 탄 채 전에 오르게 할 만큼 극진히 대우했다. 국성은 임금의 불편한 마음을 풀어주며 늘 곁을 지켰으나, 총애가 깊어지면서 임금이 잔치에 함부로 노니는 등 조정의 기강이 흐트러진다.","k":[["국선생"],["총애","사랑"],["곁","마음","풀"],["잔치","기강","방자","흐트","함부로"]]},{"n":3,"q":"국성의 자식들이 일으킨 문제와 이로 인해 국성이 겪게 되는 시련","a":"세 아들 혹·폭·역이 아버지의 총애를 믿고 방자하게 굴어, 중서령 모영(붓)이 상소를 올려 탄핵한다. 이 일로 아들들은 스스로 목숨을 끊었고, 국성은 파직되어 서인으로 떨어진다.","k":[["아들","혹","폭","역"],["방자","교만"],["모영","붓"],["탄핵","상소"],["파직","서인","평민","쫓"]]},{"n":4,"q":"국성이 관직에서 물러난 후 국가에 찾아온 위기와 임금이 다시 국성을 찾게 된 이유","a":"국성이 벼슬을 그만두자 제와 격 사이에 도적 떼가 일어나 나라가 어지러워진다. 임금이 토벌을 명했으나 마땅한 적임자가 없었고, 결국 국성만이 이를 다스릴 수 있다고 판단해 그를 다시 부른다.","k":[["도적","도둑"],["적임자","없","마땅"],["다시","기용","불"]]},{"n":5,"q":"다시 등용된 국성이 국가의 위기를 극복하는 과정과 그 공로","a":"장수가 된 국성은 부하를 엄히 통솔하고 군사들과 고생을 함께하며 신뢰를 얻는다. 수성에 물을 대어 단번에 함락시키는 공을 세웠고, 임금은 그 공로로 그를 상동후에 봉한다.","k":[["장수","군사","부하"],["도적","수성","함락","물리"],["상동후"]]},{"n":6,"q":"공을 세운 국성이 권력에 연연하지 않고 관직에서 물러나는 과정과 그 의미","a":"2년 뒤 국성은 스스로 상소를 올려 물러나기를 청하고, 임금의 허락을 받아 고향으로 돌아가 여생을 마친다. 이는 분수를 알고 물러날 때를 아는 신하의 바람직한 처신을 보여 준다.","k":[["상소","청","스스로"],["고향","돌아"],["분수","물러날","처신","절제"]]},{"n":7,"q":"작품 마지막에 제시된 사신(사관)의 평가를 바탕으로, 작가가 국성이라는 인물을 통해 전달하고자 한 주제","a":"사신은 국성이 큰 총애를 받고도 만족할 줄 알아 스스로 물러나 천수를 누렸다고 평한다. 작가는 술을 의인화한 국성을 통해 신하가 지녀야 할 절제와 충절, 물러날 때를 아는 지혜를 전하고자 했다.","k":[["사신","사관","평"],["만족","분수","절제"],["물러","은퇴"],["신하","충","도리","지혜"]]}],"theory":[{"n":1,"q":"가전체란 무엇인가","a":"사물이나 동식물을 사람처럼 의인화해 그 일생을 전기 형식으로 기록한 갈래다. 『사기』 열전을 본떠 가계 - 행적 - 사신의 논평 순서로 서술하며, 사물에 빗대어 교훈을 주려는 목적이 크다.","k":[["의인","사람처럼"],["일생","전기","열전"],["논평","사신","계보","가계"],["교훈","계세"]]},{"n":2,"q":"〈국선생전〉의 작가, 갈래, 성격, 주제, 연대","a":"이규보가 지은 가전(가전체)으로 고려 후기 작품이며 『동문선』에 실려 전한다. 성격은 서사적·교훈적·풍자적·우의적이고, 주제는 술을 의인화해 보여 주는 신하의 올바른 처신과 절제다.","k":[["이규보"],["가전","가전체"],["고려"],["교훈","우의","풍자","서사"],["절제","처신","신하","도리"]]},{"n":3,"q":"국성의 가계 — 술이 만들어지는 과정","a":"할아버지 모(보리)와 아버지 차(흰 술), 어머니 곡씨(곡식)라는 계보는 곧 보리와 곡식으로 누룩을 만들어 술을 빚는 과정을 그대로 옮긴 것이다. 고향인 주천(술 샘) 역시 술의 근원을 뜻한다.","k":[["모","보리"],["차","흰술","흰 술"],["곡","곡식"],["누룩","빚","만들","술"],["주천"]]},{"n":4,"q":"임금이 국성을 '국선생'으로 예우한 까닭","a":"국성이 임금의 근심과 불편한 마음을 풀어 주고 늘 곁에서 뜻에 맞게 처신했기 때문이다. 도량이 넓고 성품이 온순해 그릇이 크다고 여겼기에 이름 대신 '선생'이라 높여 부르며 스승 대하듯 예우했다.","k":[["근심","마음","풀"],["도량","그릇","성품"],["선생","높여","존경","예우"]]},{"n":5,"q":"가전이 등장한 당시의 시대상","a":"고려 후기 무신정변 이후 새로 등장한 신흥 사대부들이 문학의 주역이 된 시기다. 이들은 사물의 이치를 따지고 현실을 비판적으로 바라보았으며, 세상을 경계하고 사람을 바로잡으려는 계세징인의 의식이 가전 창작으로 이어졌다.","k":[["고려","무신","후기"],["사대부","신흥"],["이치","비판","현실"],["계세징인","교훈","경계"]]},{"n":6,"q":"〈국선생전〉에 나타난 교술적 요소","a":"인물의 행적을 서술한 뒤 사신의 논평을 덧붙여 교훈을 직접 드러낸다. 사물을 의인화해 그 속성을 설명하는 부분도 지식 전달에 가까워, 서사이면서 동시에 가르침을 전하는 교술적 성격을 지닌다.","k":[["사신","논평","평"],["교훈","가르침","직접"],["의인","속성","설명"]]},{"n":7,"q":"가전과 소설의 공통점과 차이점","a":"공통점은 둘 다 꾸며낸 인물과 사건을 갖춘 허구적 서사라는 점이다. 차이점은 가전이 사물을 의인화해 계보 - 행적 - 논평이라는 고정된 형식으로 교훈을 전하는 데 비해, 소설은 형식이 자유롭고 인물의 성격과 내면 갈등을 훨씬 풍부하게 그린다는 것이다.","k":[["허구","꾸며","서사"],["의인","사물"],["형식","계보","논평","고정"],["갈등","내면","성격","자유"]]}]},{"id":"lee","name":"이생규장전","sub":"김시습 『금오신화』 · 전기소설","story":[{"n":1,"q":"이생과 최랑(최 처녀)이 서로 사랑에 빠지게 된 계기와 그 과정","a":"국학에 다니던 이생이 최씨 집 담 너머로 시를 읊는 최랑을 엿보고 반해 시를 적어 담 안으로 던진다. 최랑이 답시를 보내 만날 것을 약속하면서 마음이 통했고, 이생이 밤마다 담을 넘어 찾아가며 사랑을 키운다.","k":[["담"],["시"],["최랑","최씨"],["넘","주고받","답"]]},{"n":2,"q":"이생과 최랑의 만남이 발각된 후 두 사람이 겪은 위기와 이를 극복한 과정","a":"이를 안 이생의 아버지가 꾸짖으며 그를 영남의 농장으로 내려보내자, 최랑은 상사병으로 몸져눕는다. 사연을 알게 된 최씨 부모가 이씨 집에 혼인을 청했고, 결국 두 집안이 혼인을 허락한다.","k":[["아버지","부모"],["영남","농장","보내"],["상사병","병","앓"],["혼인","허락"]]},{"n":3,"q":"부모의 반대를 극복한 이생과 최랑의 혼인 과정과 혼인 이후의 삶","a":"정식으로 혼례를 올려 부부가 되었고, 이생은 과거에 급제해 벼슬길에 오른다. 두 사람은 시를 주고받으며 더없이 행복한 나날을 보낸다.","k":[["혼례","혼인","부부"],["과거","급제","벼슬"],["행복","화목"]]},{"n":4,"q":"행복했던 이생과 최랑에게 찾아온 두 번째 시련인 '홍건적의 난'과 최랑의 비극적 죽음","a":"홍건적이 침입해 가족이 흩어지고 이생은 몸을 피했으나, 최랑은 도적에게 붙잡힌다. 최랑은 끝까지 절개를 지키며 항거하다 도적의 칼에 죽임을 당한다.","k":[["홍건적"],["피","흩어","달아"],["절개","항거","지키"],["죽","살해","칼"]]},{"n":5,"q":"아내를 잃고 슬퍼하던 이생에게 일어난 기이한 일과 두 사람의 재회 과정","a":"난이 끝난 뒤 홀로 슬퍼하던 이생 앞에 죽은 최랑이 환신(혼령)으로 돌아온다. 이생은 이승 사람이 아님을 알면서도 반갑게 맞아 예전처럼 함께 살았고, 흩어진 유골을 거두어 장사 지낸다.","k":[["혼령","환신","죽은","귀신"],["돌아","나타"],["함께","살"],["유골","장사","거두"]]},{"n":6,"q":"환귀한 최랑과 이생이 결국 다시 이별하게 된 이유와 이별의 과정","a":"이승에 머물 수 있도록 허락된 저승의 기한(3년)이 다해 최랑은 더 이상 남을 수 없게 된다. 최랑은 이생에게 이별을 고하고, 자취가 차츰 희미해지며 완전히 사라진다.","k":[["기한","3년","삼년","때"],["저승","이승","허락"],["이별","작별","고"],["사라","자취","떠"]]},{"n":7,"q":"최랑이 떠난 후 이생의 삶과 이 작품이 전달하고자 하는 핵심 주제","a":"이생은 아내를 그리워하다 병을 얻어 몇 달 만에 세상을 떠난다. 이 작품은 죽음과 전란이라는 현실의 폭력조차 갈라놓지 못한 지고지순한 사랑을 통해 인간의 의지와 사랑의 가치를 보여 준다.","k":[["그리","병"],["죽","세상을 떠"],["사랑"],["죽음","전란","현실","초월","넘"]]}],"theory":[{"n":1,"q":"전기소설이란 무엇인가","a":"현실에서 일어나기 어려운 기이하고 신비로운 사건을 다루는 소설 갈래다. 귀신·환생·초현실적 공간이 등장하며, 우리 문학에서는 김시습의 『금오신화』가 그 출발점으로 꼽힌다.","k":[["기이","신비","비현실","초현실"],["귀신","혼령","환생"],["금오신화"]]},{"n":2,"q":"〈이생규장전〉의 작가, 갈래, 성격, 배경, 주제, 출전","a":"김시습이 지은 한문 전기소설로 『금오신화』에 실려 있다. 성격은 전기적·낭만적·비극적이며, 배경은 고려 말 송도(개성)이고, 주제는 죽음도 갈라놓지 못한 남녀의 지고지순한 사랑이다.","k":[["김시습"],["전기","한문"],["금오신화"],["송도","개성","고려"],["사랑","죽음"]]},{"n":3,"q":"작품 속 '시'의 역할","a":"인물의 마음을 대신 전하는 매개이자 두 사람을 이어 주는 사랑의 통로다. 산문 서술이 다 담지 못한 정서를 압축해 드러내고 낭만적 분위기를 높이며, 사건이 다음 단계로 넘어가게 하는 구실도 한다.","k":[["마음","정서","심리"],["매개","이어","전달"],["낭만","분위기"],["사건","전개"]]},{"n":4,"q":"세 번의 가약(만남)의 의미","a":"담을 넘어 몰래 맺은 첫 만남, 부모의 반대를 넘어 이룬 혼인, 죽은 뒤 혼령으로 이룬 재회로 이어진다. 만남과 이별이 반복되며 장애가 점점 커지는데 그때마다 사랑을 지켜냄으로써, 두 사람의 사랑이 세속의 제약을 넘어 죽음까지 초월하는 것으로 심화된다.","k":[["담","몰래","처음"],["혼인","부모","반대"],["혼령","죽은","재회"],["초월","심화","장애","극복"]]},{"n":5,"q":"최랑을 통해 작가가 말하려는 의미","a":"최랑은 먼저 시를 보내고 죽음 앞에서도 절개를 지키는 적극적이고 주체적인 여성이다. 봉건적 규범에 눌리지 않고 스스로 사랑을 선택하는 인물을 내세워, 작가는 인간의 자연스러운 감정과 의지를 긍정한다.","k":[["적극","주체","능동"],["절개","지키"],["봉건","규범","제약"],["감정","의지","긍정","사랑"]]},{"n":6,"q":"김시습의 두 작품(만복사저포기·이생규장전)의 공통점","a":"산 사람과 죽은 여인이 사랑을 나누는 명혼 구조를 공유하고, 전기적·비현실적 요소가 두드러진다. 두 작품 모두 여인이 떠난 뒤 남주인공이 세상에 뜻을 두지 않고 사라지거나 죽는 비극으로 끝나는데, 여기에는 현실에 좌절한 작가 자신의 처지가 투영되어 있다.","k":[["죽은","혼령","명혼"],["전기","비현실","기이"],["비극","죽","떠"],["작가","현실","좌절","김시습"]]}]},{"id":"hojil","name":"호질","sub":"박지원 『열하일기』 · 우화 · 풍자","story":[{"n":1,"q":"작품 도입부에서 호랑이가 어떤 존재로 묘사되며, 먹잇감을 정하기 위해 유자(선비)를 고르는 과정","a":"호랑이는 문무와 지혜, 용맹을 두루 갖춘 신령스럽고 위엄 있는 존재로 그려진다. 창귀들이 의원과 무당을 권하지만 사람을 속이고 해치는 자들이라며 물리치고, 깨끗하다는 유자(선비)를 먹기로 하고 마을로 향한다.","k":[["문무","지혜","용맹","신령","위엄"],["창귀"],["의원","무당"],["선비","유자"]]},{"n":2,"q":"북곽선생과 동리자가 표면적으로 드러내는 평판과 실제 모습의 가식성","a":"북곽선생은 학문 높은 선비로 칭송받고, 동리자는 수절 과부로 열녀 정표까지 받은 인물이다. 그러나 동리자에게는 성이 다른 아들이 다섯이나 있었고 두 사람은 밤중에 몰래 만나고 있었으니, 겉으로 드러난 평판과 실제가 완전히 달랐다.","k":[["북곽","학문","선비","칭송"],["동리자","열녀","수절","과부"],["아들","다섯","성이 다른"],["몰래","밤","만나","위선","가식"]]},{"n":3,"q":"동리자의 방에 있던 북곽선생이 아들들에게 들통나 도망치는 과정과 그 해학적 상황","a":"방에서 나는 소리를 들은 동리자의 아들들이 '여우가 북곽선생으로 둔갑했다'며 몰려든다. 북곽선생은 체면도 잊고 허둥지둥 달아나다 들판의 똥구덩이에 빠지는데, 존경받던 선비의 추한 몰골이 웃음을 자아낸다.","k":[["여우","둔갑"],["아들","몰려","들이닥"],["도망","달아"],["똥"]]},{"n":4,"q":"호랑이가 똥통에 빠진 북곽선생을 보고 지적하며 꾸짖는 '유자(선비)'의 위선적 실체","a":"간신히 기어 나온 북곽선생 앞에 호랑이가 나타나 얼굴을 찡그리고 코를 막으며 더럽다고 외면한다. 잡아먹으려던 선비가 짐승조차 꺼릴 만큼 더러운 존재였다는 점에서 유학자의 위선이 단번에 폭로된다.","k":[["코","찡그","더럽","냄새"],["먹지","외면","꺼"],["위선","가식","실체"]]},{"n":5,"q":"호랑이가 자신의 생태적 특성과 인간의 행태를 비교하며 인간의 탐욕을 비판한 내용","a":"호랑이는 자신은 굶주릴 때만 사냥하고 초목을 해치지 않는다고 말한다. 반면 인간은 인의를 말하면서도 서로 속이고 잡아먹으며, 그물·함정·창칼 같은 도구를 만들어 남을 해치니 짐승보다 못하다고 꾸짖는다.","k":[["굶주","배고","초목","사냥"],["인의","도덕","말"],["그물","함정","창","도구","무기"],["서로","잡아먹","해치","탐욕"]]},{"n":6,"q":"호랑이의 질책을 들은 북곽선생이 자신의 목숨을 구하기 위해 보여준 비굴한 행동","a":"북곽선생은 땅에 엎드려 머리를 조아리고 거듭 절하며 목숨을 구걸한다. 성현의 말씀까지 끌어다 호랑이를 성인에 빗대어 아첨하는데, 학식 높은 선비의 체면이 완전히 무너진 모습이다.","k":[["엎드","머리","조아","절"],["목숨","구걸","살려"],["아첨","성현","칭송","비굴"]]},{"n":7,"q":"날이 새자 호랑이가 사라진 후 농부와 만난 북곽선생의 변명과 이 작품이 전달하려는 핵심 주제","a":"호랑이가 이미 사라진 줄도 모르고 절을 계속하던 북곽선생은, 농부가 이유를 묻자 하늘과 땅에 공경을 표하는 중이라며 그럴듯하게 둘러댄다. 이 작품은 겉으로만 도덕을 내세우는 양반·유학자의 위선과 허위의식을 신랄하게 풍자한다.","k":[["농부"],["하늘","땅","공경","절"],["둘러","변명","핑계"],["위선","풍자","양반","허위"]]}],"theory":[{"n":1,"q":"우화소설이란 무엇인가","a":"동식물이나 사물을 사람처럼 등장시켜 인간 사회를 빗대어 비판하는 소설이다. 직접 말하기 어려운 내용을 간접적으로 드러내 풍자 효과를 높이고 교훈을 준다.","k":[["동물","사물","의인"],["빗대","간접","우의"],["풍자","비판","교훈"]]},{"n":2,"q":"〈호질〉의 작가, 갈래, 배경, 성격, 주제","a":"박지원이 지은 한문 단편으로 『열하일기』에 실린 우화소설이자 풍자소설이다. 성격은 풍자적·우의적·비판적이며, 배경은 중국의 어느 고을로 설정되어 있고, 주제는 양반과 유학자의 위선적인 삶에 대한 비판이다.","k":[["박지원"],["열하일기"],["우화","풍자","한문"],["중국"],["양반","유학자","위선","비판"]]},{"n":3,"q":"인물 설명 — 북곽선생, 호랑이","a":"북곽선생은 학문과 덕망으로 이름난 대학자이지만 실제로는 과부와 밀회를 즐기고 목숨 앞에서 비굴해지는 위선적 인물이다. 호랑이는 인간의 위선과 탐욕을 꿰뚫어 보고 준엄하게 꾸짖는 존재로, 작가의 비판 의식을 대변한다.","k":[["북곽","학자","덕망","위선"],["밀회","비굴","동리자"],["호랑이","꾸짖","비판"],["작가","대변","의식"]]},{"n":4,"q":"다른 우화와의 차이점","a":"보통의 우화가 동물을 통해 일반적인 교훈을 주는 데 그친다면, 〈호질〉은 양반·유학자라는 특정 계층을 겨냥해 당대 현실을 구체적으로 비판한다. 결말에서도 교훈으로 정리해 주지 않고 북곽선생의 변명으로 끝맺어 독자가 스스로 판단하게 한다.","k":[["교훈","단순","일반"],["양반","유학자","계층","현실"],["구체","비판","풍자"],["결말","변명","독자","판단"]]},{"n":5,"q":"북곽선생과 농부의 비교","a":"북곽선생은 학식과 명성을 갖췄으나 겉과 속이 다른 위선적 지식인이다. 반면 이른 아침부터 밭에 나온 농부는 소박하고 정직한 서민으로, 그의 순박한 질문이 북곽선생의 변명을 이끌어 내어 위선을 한 번 더 드러낸다.","k":[["북곽","위선","지식인","겉"],["농부","소박","정직","서민"],["질문","변명","드러"]]},{"n":6,"q":"작가가 호랑이를 통해 현실을 풍자한 이유","a":"사람이 직접 양반을 꾸짖으면 신분 질서상 설득력도 없고 위험도 크다. 인간 밖의 존재이면서 위엄을 갖춘 호랑이를 내세워야 인간 전체를 객관적으로 내려다보며 비판할 수 있고, 짐승만도 못하다는 대비가 선명해져 풍자의 힘이 커진다.","k":[["신분","직접","위험","검열"],["객관","밖","위엄"],["짐승","대비","못하"],["풍자","효과","비판"]]},{"n":7,"q":"박지원 소설의 공통점","a":"대부분 한문 단편으로 실학사상을 바탕에 두고 있으며, 무능하고 위선적인 양반 계층을 풍자한다. 인물을 생생하고 사실적으로 그리며 해학을 곁들이고, 결말을 딱 떨어지게 맺지 않아 독자에게 여운과 판단을 남긴다.","k":[["한문","단편"],["실학","이용후생","현실"],["양반","풍자","비판"],["해학","사실","여운"]]}]},{"id":"chun","name":"이춘풍전","sub":"작자 미상 · 판소리계 풍자소설","story":[{"n":1,"q":"작품 초반에 등장하는 이춘풍의 성격적 결함과 이로 인해 집안에 닥친 위기","a":"서울의 부잣집 아들 이춘풍은 주색잡기에 빠져 방탕하게 지낸다. 결국 선대의 재산을 모두 탕진해 집안이 몰락하고, 아내가 굶주려 거동도 못 할 지경에 이른다.","k":[["주색","방탕","놀"],["가산","재산","탕진","날"],["몰락","가난","굶"]]},{"n":2,"q":"춘풍이 가산을 탕진한 후 아내 김 씨가 집안을 다시 일으켜 세운 과정","a":"춘풍이 뉘우치며 다시는 방탕하지 않겠다는 수기(서약)를 써 주자, 김 씨는 굶주린 배를 안고 품팔이와 바느질로 억척스럽게 돈을 모은다. 그 덕에 세간이 다시 넉넉해진다.","k":[["수기","서약","각서"],["품팔","바느질","삯","일"],["돈","모","재산"]]},{"n":3,"q":"집안이 다시 풍족해진 후 춘풍이 호조의 돈을 빌려 평양으로 떠나게 된 계기와 목적","a":"형편이 나아지자 춘풍은 다시 교만해져 크게 장사해 큰돈을 벌겠다고 나선다. 호조에서 2,000냥을 빌리고 아내가 모은 500냥까지 합쳐 2,500냥을 들고 평양으로 떠난다.","k":[["호조"],["2000","이천","2천","2500","2천5","이천오"],["평양"],["장사","돈","벌"]]},{"n":4,"q":"평양에 도착한 춘풍이 추월에게 속아 재산을 탕진하고 비참하게 전락한 과정","a":"평양 명기 추월에게 미혹되어 장사는 하지 않고 돈을 모두 탕진한다. 빈털터리가 되자 박대와 수모를 받으며 추월의 집에서 하인 노릇을 하는 처지로 전락한다.","k":[["추월"],["탕진","빼앗","잃","날"],["하인","사환","종","심부름"]]},{"n":5,"q":"남편의 비참한 소식을 들은 김 씨가 춘풍을 구하고 추월을 응징하기 위해 취한 기발한 계책","a":"소식을 들은 김 씨는 마침 이웃에 사는 참판이 평양감사로 부임하게 되자 그에게 청하여 비장 자리를 얻는다. 그리고 남장을 하고 비장이 되어 평양으로 따라간다.","k":[["참판","감사","평안","평양감사"],["남장","남자","변장"],["비장"]]},{"n":6,"q":"남장 비장으로 분한 김 씨가 평양 관아에서 추월과 춘풍을 불러 심문하고 사건을 해결하는 과정","a":"비장이 된 김 씨는 추월의 집을 찾아 남편의 거지 같은 몰골과 추월의 간교함을 확인한 뒤, 관아로 두 사람을 잡아들여 문초한다. 추월을 엄히 벌하고 2,500냥을 모두 되찾아 춘풍에게 돌려준다.","k":[["관아","문초","심문","잡아"],["추월","벌","징벌","곤장"],["돈","2500","되찾","돌려"]]},{"n":7,"q":"서울로 돌아온 후 춘풍이 보여준 허세와, 김 씨가 정체를 밝히며 극이 마무리되는 과정","a":"돈을 들고 돌아온 춘풍은 아내 앞에서 자기가 장사로 벌어 왔다며 허세를 부린다. 그때 김 씨가 다시 비장 차림으로 나타나 춘풍을 쩔쩔매게 한 뒤 정체를 밝히고, 망신당한 춘풍이 뉘우치며 부부가 화목하게 마무리된다.","k":[["허세","자랑","큰소리"],["비장","다시","나타"],["정체","밝"],["뉘우","반성","망신","화목"]]}],"theory":[{"n":1,"q":"〈이춘풍전〉의 갈래, 성격, 배경, 주제","a":"작자 미상의 한글 소설로 판소리계 소설이자 세태 풍자 소설이다. 성격은 풍자적·해학적·교훈적이며, 배경은 조선 후기의 서울과 평양이다. 주제는 허랑방탕한 남편의 각성과 슬기로운 아내의 활약, 그리고 무능한 남성 중심 사회에 대한 풍자다.","k":[["작자 미상","한글"],["판소리","세태","풍자"],["조선 후기","서울","평양"],["아내","각성","남성","풍자"]]},{"n":2,"q":"인물 설명 — 춘풍, 부인(김 씨), 추월","a":"춘풍은 무능하고 허영심 많은 인물로 방탕과 허세를 반복하다 아내에게 망신당하고서야 뉘우친다. 부인 김 씨는 현실 감각과 추진력을 갖추고 직접 돈을 벌며 남장까지 해 사건을 해결하는 실질적 주인공이다. 추월은 춘풍을 유혹해 재물을 빼앗는 인물로, 이익만을 좇는 당대 세태를 보여 준다.","k":[["춘풍","무능","허세","방탕"],["부인","김씨","김 씨","유능","해결"],["남장","비장"],["추월","유혹","재물","이익"]]},{"n":3,"q":"편집자적 논평이란 무엇인가","a":"서술자가 사건 진행 도중 끼어들어 인물의 행동을 평가하거나 독자에게 말을 건네는 서술 방식이다. 판소리계 소설의 대표적 특징으로, 춘풍의 어리석음을 서술자가 직접 나무라며 웃음과 교훈을 동시에 준다.","k":[["서술자","끼어","개입"],["평가","논평","말을 건"],["판소리","특징"],["교훈","웃음"]]},{"n":4,"q":"〈이춘풍전〉 창작 무렵 사회의 모습","a":"조선 후기에는 상업이 발달해 돈이 신분보다 중요해지고, 몰락한 양반과 부유한 상인·기생이 함께 등장했다. 여성의 경제적 역할이 커지면서 무능한 남성과 유능한 여성이라는 구도가 가능해졌고, 이런 변화가 작품에 그대로 담겼다.","k":[["상업","화폐","돈","경제"],["신분","몰락","양반"],["여성","역할","지위"],["조선 후기","변화"]]},{"n":5,"q":"춘풍 부인이 보여 주는 의의","a":"남편에게 기대지 않고 스스로 재산을 일으키며, 남장을 해 관직의 힘까지 빌려 문제를 직접 해결한다. 남성 중심 질서 안에서 여성이 주체적으로 능력을 발휘하는 모습을 보여 준다는 점에서 앞선 여성상으로 평가된다.","k":[["스스로","주체","능동"],["남장","비장","해결"],["여성","지위","능력"],["근대","의의","평가","앞선"]]},{"n":6,"q":"〈이춘풍전〉이 판소리계 소설인 이유","a":"서술자가 개입해 논평하고, 운문에 가까운 가락과 반복·과장된 표현이 자주 나타난다. 양반의 한문투와 서민의 일상어가 섞여 있고 해학적 장면이 두드러지며, 서민의 시각에서 인물을 웃음거리로 삼는 점도 판소리 사설의 성격을 보여 준다.","k":[["서술자","개입","논평"],["운문","가락","율문","4"],["한문투","일상어","서민"],["해학","과장","웃음"]]},{"n":7,"q":"소설에 나타난 문제 상황과 해결 양상","a":"문제는 춘풍의 방탕으로 가정 경제가 무너지고 남편이 타지에서 몰락한 것이다. 해결은 무능한 남편이 아니라 아내가 경제력과 지혜, 남장이라는 기지를 발휘해 이루어지며, 응징과 화해를 거쳐 가정이 회복되는 방식으로 마무리된다.","k":[["방탕","탕진","몰락"],["아내","부인","해결"],["지혜","남장","기지","경제력"],["응징","화해","회복"]]}]},{"id":"woon","name":"운영전","sub":"작자 미상 · 몽유록계 비극소설","story":[{"n":1,"q":"작품의 도입부에서 '유영'이 수성궁에 찾아가 어떠한 계기로 운영과 김 진사의 비극적 이야기를 듣게 되는지","a":"선조 때 선비 유영이 안평대군의 옛집인 수성궁 터에 술을 들고 찾아가 놀다가 취해 잠든다. 깨어 보니 운영과 김 진사가 나타나 자신들의 비극적 사랑 이야기를 직접 들려준다.","k":[["유영"],["수성궁","안평대군"],["술","취","잠"],["운영","김진사","김 진사"]]},{"n":2,"q":"안평대군이 운영을 비롯한 궁녀들에게 내린 금기와 궁궐 내 생활의 한계","a":"안평대군은 아름답고 재주 있는 궁녀 열 명을 뽑아 시문을 가르치되, 궁 밖 출입과 외간 남자와의 접촉을 엄히 금했다. 재능은 길러 주면서 인간적 감정과 욕망은 억누르게 한 셈이라, 궁녀들의 삶은 근본적으로 갇혀 있었다.","k":[["궁녀","열"],["시","글","가르"],["금","출입","접촉","남자"],["갇","억눌","한계","자유"]]},{"n":3,"q":"운영과 김 진사가 처음 만나 사랑에 빠지게 된 계기와 이후 사랑의 방식","a":"김 진사가 안평대군을 찾아와 시로 풍류를 즐길 때 운영이 그를 보고 마음을 빼앗기고, 벼루의 먹물이 김 진사의 소매에 튄 일을 계기로 서로 마음을 확인한다. 이후 궁을 드나드는 무녀를 통해 시와 편지를 몰래 주고받고, 밤에 담을 넘어 만나는 위험한 사랑을 이어간다.","k":[["김진사","김 진사","진사"],["먹물","벼루","시"],["무녀","편지","글"],["담","밤","몰래"]]},{"n":4,"q":"둘의 애정이 안평대군에게 포착될 위기에 궁녀들의 반응과 역할","a":"자란을 비롯한 서궁의 동료 궁녀들은 운영의 처지를 동정하며 만남을 눈감아 주고 적극 도와준다. 안평대군의 추궁 앞에서도 인간의 정은 막을 수 없다며 함께 항변해 운영을 변호한다.","k":[["자란","궁녀","동료"],["동정","도와","도움","감싸"],["항변","변호","막을 수 없","편"]]},{"n":5,"q":"운영과 김 진사가 궁궐을 탈출하기 위해 세운 계획과, 노비 '특'의 배신으로 실패하게 된 과정","a":"김 진사의 종 특이 재물을 미리 궁 밖으로 빼돌린 뒤 함께 달아나라고 권하는데, 실은 재물과 운영을 모두 차지하려는 속셈이었다. 특이 궁궐의 재물이 빠져나간다는 소문을 일부러 퍼뜨리면서 일이 안평대군에게 알려져 계획은 실패한다.","k":[["특"],["재물","보화","돈"],["빼돌","가로채","차지","속셈"],["소문","발각","알려"]]},{"n":6,"q":"탈출 사실이 발각된 후 안평대군의 추국과 이에 맞선 운영의 선택 및 결말","a":"궁녀들이 끌려와 문초를 받지만, 안평대군은 그들의 항변을 듣고 마음이 풀려 운영을 죽이지 않고 별당에 가둔다. 그러나 운영은 그날 스스로 목숨을 끊어 자신의 사랑을 지키는 비극적 선택을 한다.","k":[["문초","추국","심문"],["별당","가두","갇"],["스스로","자결","목숨"]]},{"n":7,"q":"운영의 죽음을 알게 된 김 진사의 행보와, 이야기를 마친 후 유영이 보여준 결말","a":"김 진사는 운영이 남긴 재물을 부처에게 바쳐 내세의 인연을 빌다가, 식음을 전폐하고 뒤따라 세상을 떠난다. 이야기를 마친 두 사람이 사라지자 유영은 그들이 남긴 책을 안고 돌아와 명산대찰을 떠돌았고, 어떻게 생을 마쳤는지 알 수 없다.","k":[["김진사","김 진사","진사"],["죽","떠나","따라"],["유영"],["책","기록","명산"]]}],"theory":[{"n":1,"q":"〈운영전〉의 갈래, 성격, 배경, 주제","a":"작자 미상의 한문 소설로 몽유록계 애정 소설이자 우리 고전소설에서 드문 비극 소설이다. 성격은 비극적·낭만적·사실적이며, 배경은 조선 초 안평대군의 수성궁이다. 주제는 신분과 규범의 억압을 넘어서려 한 남녀의 비극적 사랑이다.","k":[["몽유록","애정","한문"],["비극"],["수성궁","안평대군","조선"],["신분","억압","사랑"]]},{"n":2,"q":"인물 설명 — 유영, 운영, 김 진사","a":"유영은 이야기를 전해 듣고 기록하는 외부 서술자이자 관찰자다. 운영은 궁녀라는 신분의 제약 속에서도 사랑을 선택하고 끝내 목숨으로 지켜내는 주체적 인물이며, 김 진사는 재주 있는 선비지만 소극적이고 종 특에게 속을 만큼 현실 대응력이 부족한 인물이다.","k":[["유영","관찰","기록","외부"],["운영","궁녀","주체","사랑"],["김진사","김 진사","선비","소극","부족"]]},{"n":3,"q":"일반적인 몽유록계 소설과의 차이점","a":"보통의 몽유록은 몽유자가 꿈에서 인물들을 만나 이야기를 듣고 깨어나며 현실을 비판하는 틀을 갖는다. 〈운영전〉은 꿈과 현실의 경계가 뚜렷하지 않고, 들은 이야기가 아니라 당사자인 운영과 김 진사가 직접 자기 사연을 서술하며, 교훈이나 각성 대신 비극적 정서로 끝난다는 점이 다르다.","k":[["몽유자","꿈","깨"],["경계","모호","뚜렷하지"],["당사자","직접","서술","1인칭"],["비극","정서","교훈"]]},{"n":4,"q":"안평대군의 이중성","a":"그는 궁녀들에게 시문을 가르치며 재능을 아끼는 후원자이지만, 동시에 그들의 사랑과 자유를 금지하는 억압자이기도 하다. 문초 끝에 운영을 죽이지 않고 용서하는 인간적인 면도 보이지만 끝내 궁이라는 울타리를 풀어 주지는 못한다.","k":[["재능","가르","후원","아끼"],["금지","억압","가두"],["용서","인간적","살려"],["이중","모순"]]},{"n":5,"q":"〈운영전〉의 비장미","a":"비장미는 인물이 뜻을 이루지 못하고 좌절하거나 죽음에 이를 때 느껴지는 슬프고도 숭고한 아름다움이다. 운영이 목숨으로 사랑을 지키고 김 진사가 뒤따르는 결말에서, 현실의 벽 앞에서도 뜻을 굽히지 않은 인물들의 비극이 숭고하게 그려진다.","k":[["좌절","죽음","이루지 못"],["슬프","숭고","아름"],["사랑","지키","굽히지"]]},{"n":6,"q":"〈운영전〉의 표면적 주제와 이면적 주제","a":"표면적으로는 궁녀 운영과 김 진사의 이루어질 수 없는 사랑을 그린 애정담이다. 이면에는 궁이라는 폐쇄된 공간과 신분 질서, 인간의 자연스러운 욕망을 억누르는 봉건적 규범에 대한 비판이 담겨 있다.","k":[["사랑","애정","이루어질 수 없"],["신분","봉건","규범","제도"],["억압","욕망","비판","자유"]]},{"n":7,"q":"〈운영전〉의 액자식 구성","a":"유영이 수성궁에서 두 사람을 만나는 부분이 바깥 이야기(외화)이고, 운영과 김 진사가 들려주는 사랑 이야기가 안 이야기(내화)다. 내화를 당사자가 1인칭으로 서술해 사실감과 절실함을 높이고, 외화가 이를 감싸며 이야기에 신빙성을 준다.","k":[["외화","바깥","유영"],["내화","안","운영","사랑"],["1인칭","당사자","서술"],["사실감","신빙","효과"]]},{"n":8,"q":"다른 몽유록 소설과의 비교","a":"「원생몽유록」 같은 작품은 역사적 인물을 등장시켜 정치적 울분을 드러내는 데 무게를 두지만, 〈운영전〉은 개인의 애정과 내면 심리에 집중한다. 또 다른 몽유록이 꿈에서 깨어나며 각성으로 마무리되는 것과 달리 〈운영전〉은 끝까지 비극적 여운을 남긴다.","k":[["역사","정치","원생","울분"],["애정","개인","심리","내면"],["각성","깨","비극","여운"]]},{"n":9,"q":"여성 작가(추정)가 쓴 작품이라는 근거와 그 특징","a":"여성 인물의 감정과 심리가 섬세하게 그려지고, 운영이 자기 목소리로 직접 사연을 서술한다. 자란을 비롯한 궁녀들의 연대와 우정이 두드러지며, 여성을 억누르는 제도에 대한 비판적 시선이 뚜렷하다는 점도 근거로 꼽힌다.","k":[["섬세","심리","감정","내면"],["목소리","직접","서술","1인칭"],["궁녀","연대","자란","우정"],["제도","억압","비판"]]}]},{"id":"gu","name":"구운몽","sub":"김만중 · 몽자류 소설","story":[{"n":1,"q":"형산 연화봉에서 불도를 닦던 '성진'이 세속적 번뇌를 품게 된 계기","a":"육관대사의 제자 성진이 용궁에 심부름을 갔다가 술을 마시고 돌아온다. 돌다리에서 팔선녀를 만나 희롱하며 마음이 흔들렸고, 이후 인간 세상의 부귀영화와 여색을 부러워하는 번뇌에 빠진다.","k":[["성진"],["용궁","술"],["팔선녀","돌다리","석교"],["번뇌","부귀","여색","세속"]]},{"n":2,"q":"성진의 마음속 번뇌를 알아채고 육관대사가 내린 벌과 이로 인해 성진이 겪게 된 변화","a":"마음속을 꿰뚫어 본 육관대사는 성진과 팔선녀를 모두 인간 세상으로 내쫓는다. 성진은 회남 양처사의 아들 양소유로 다시 태어나 인간의 삶을 살게 된다.","k":[["육관대사"],["인간","속세","세상","내쫓","쫓"],["양소유"],["태어","환생","윤회"]]},{"n":3,"q":"인간 세상에 태어난 양소유가 유교적 입신양명을 이루어가는 과정","a":"양소유는 과거에 급제해 벼슬길에 오르고, 반란을 진압하고 외적을 물리쳐 큰 공을 세운다. 마침내 승상의 자리에 올라 유교적 입신양명을 완성한다.","k":[["과거","급제"],["반란","외적","전쟁","공"],["승상","벼슬","재상"]]},{"n":4,"q":"양소유가 속세에서 여덟 여인(팔선녀의 후신)과 만나는 과정과 그들과의 관계","a":"진채봉·계섬월·정경패·가춘운·적경홍·이소화(난양공주)·심요연·백능파를 차례로 만난다. 이들은 팔선녀의 후신으로, 2처 6첩이 되어 서로 시기함 없이 화락하게 지낸다.","k":[["팔선녀","후신","여덟"],["처","첩","2처","6첩"],["화락","시기","화목","함께"]]},{"n":5,"q":"승상이 되어 인생의 부귀영화를 누린 양소유가 만년에 느끼게 된 회한과 사유","a":"취미궁에서 여덟 부인과 잔치를 벌이던 양소유는 옛 영웅들의 무너진 무덤을 바라본다. 그 순간 인생의 덧없음을 절감하고 불도에 뜻을 두게 된다.","k":[["무덤","영웅","취미궁"],["덧없","허무","무상"],["불도","불교","깨"]]},{"n":6,"q":"양소유가 세속의 허무함을 느끼던 순간 나타난 노승과의 대화 및 꿈에서 깨어나는 과정","a":"홀연 나타난 노승과 문답을 나누던 중, 노승이 지팡이로 돌난간을 내리친다. 순간 모든 것이 사라지고 성진은 연화봉 자신의 자리에서 깨어난다.","k":[["노승","육관대사"],["지팡이","돌난간","내리"],["깨어","꿈","연화봉"]]},{"n":7,"q":"꿈에서 깨어난 성진이 깨달은 진리와 이후 팔선녀와 함께 이룬 마지막 행보","a":"성진은 인간의 부귀영화가 한바탕 꿈에 지나지 않음을 깨닫고 진심으로 참회한다. 팔선녀도 함께 돌아와 육관대사의 가르침을 받고, 모두 큰 도를 이루어 극락세계에 이른다.","k":[["꿈","일장춘몽","덧없","허무"],["부귀","영화"],["팔선녀"],["극락","도","깨달","성불"]]}],"theory":[{"n":1,"q":"〈구운몽〉의 작가, 갈래, 성격, 배경, 주제","a":"김만중이 유배 시절 어머니를 위로하려 지은 한글 장편 소설로 몽자류 소설의 효시다. 성격은 불교적·전기적·이상적이며, 배경은 중국 당나라 남악 형산과 인간 세상이다. 주제는 인간의 부귀영화가 한바탕 꿈에 지나지 않는다는 깨달음이다.","k":[["김만중"],["몽자류","효시"],["한글","장편"],["당나라","형산","연화봉"],["부귀","꿈","깨달","허무"]]},{"n":2,"q":"'성진'과 '소유' 이름의 의미","a":"성진(性眞)은 '참된 본성'이라는 뜻으로 수행자가 되찾아야 할 본래의 자리를 가리킨다. 소유(少游)는 '잠시 노닌다'는 뜻으로, 인간 세상의 삶이 잠깐 스쳐 가는 유람에 지나지 않음을 이름에 미리 담아 둔 것이다.","k":[["성진","참","본성","진"],["소유","잠시","노","유람"],["인간","삶","덧없","꿈"]]},{"n":4,"q":"〈구운몽〉에 담겨 있는 사상적 배경","a":"유교·불교·도교가 함께 녹아 있다. 양소유의 입신양명은 유교적 가치를, 신선과 용궁이 등장하는 대목은 도교적 상상력을, 모든 것이 꿈이었다는 결말과 공(空) 사상은 불교를 보여 주며 그중 불교의 공 사상이 중심을 이룬다.","k":[["유교","입신양명"],["도교","신선","용궁"],["불교","공","깨달"],["중심","조화","화합"]]},{"n":5,"q":"제목 '구운몽'의 의미","a":"'구(九)'는 성진과 팔선녀 아홉 사람을, '운(雲)'은 구름처럼 덧없이 흩어지는 인생을, '몽(夢)'은 그 모든 것이 꿈이었음을 뜻한다. 제목 자체가 작품의 인물 구성과 주제를 한꺼번에 담고 있다.","k":[["구","아홉","성진","팔선녀"],["운","구름","덧없"],["몽","꿈"],["주제","담","인물"]]},{"n":6,"q":"육관대사의 가르침","a":"육관대사는 성진에게 꿈과 현실, 부귀와 적막을 둘로 나누어 보는 마음 자체가 미혹임을 일깨운다. 꿈을 직접 겪게 해 스스로 깨닫게 하는 방식으로, 집착을 버리고 참된 본성으로 돌아가야 한다는 불교의 가르침을 전한다.","k":[["꿈","현실","구분","나누"],["미혹","집착","분별"],["스스로","깨닫","경험"],["본성","불교","도"]]},{"n":7,"q":"몽자류 소설과 몽유록계 소설의 차이","a":"몽자류 소설은 주인공이 꿈속에서 다른 인물로 다시 태어나 일생을 살고, 깨어난 뒤 인생의 덧없음을 깨닫는 구조다. 몽유록계는 몽유자가 자기 모습 그대로 꿈에 들어가 인물들을 만나 이야기를 듣고 돌아오며, 주로 현실 비판이나 울분을 드러내는 데 목적이 있다.","k":[["몽자류","다시 태어","환생","일생"],["깨달","덧없","각성"],["몽유록","그대로","만나","듣"],["비판","울분","현실"]]}]},{"id":"sa","name":"사씨남정기","sub":"김만중 · 가정소설 · 풍간소설","story":[{"n":1,"q":"명나라 사대부 유연수와 사씨의 혼인 과정과, 후사를 얻지 못해 일어난 상황","a":"명나라 사대부 유연수가 덕과 재주를 갖춘 사정옥(사씨)과 혼인한다. 그러나 아홉 해가 지나도록 자식이 없자, 사씨가 스스로 남편에게 첩을 들일 것을 권한다.","k":[["유연수"],["사씨","사정옥"],["자식","후사","없"],["첩","권","들"]]},{"n":2,"q":"첩으로 들어온 교씨의 성품과 그녀가 사씨를 모함하기 위해 꾸민 음모","a":"교채란은 겉으로 순종하는 척하지만 간교하고 시기심이 강한 인물이다. 아들을 낳은 뒤 문객 동청과 결탁해, 사씨가 자기 아들을 저주했다는 거짓 증거를 꾸미는 등 온갖 모함을 벌인다.","k":[["교씨","교채란"],["간교","시기","질투","악"],["동청"],["모함","음모","거짓","저주"]]},{"n":3,"q":"교씨의 간계에 속은 유연수가 내린 결정과, 이로 인해 사씨가 겪게 된 시련","a":"간계에 속은 유연수는 끝내 사씨를 내쫓는다. 사씨는 집을 떠나 시부모 묘 근처에 의지하다 남쪽으로 떠돌며 온갖 고초를 겪는다.","k":[["속","간계"],["내쫓","쫓","폐출"],["떠돌","고초","남","유랑"]]},{"n":4,"q":"사씨가 쫓겨난 후 교씨와 동청이 저지른 악행과 이로 인해 유연수가 겪게 된 비극","a":"교씨와 동청은 간통하며 재산을 차지하고, 동청은 권세가에 붙어 벼슬을 얻는다. 나아가 유연수를 모함해 유배까지 보낸다.","k":[["간통","결탁","정을 통"],["재산","차지","가로"],["모함"],["유배","귀양"]]},{"n":5,"q":"유연수가 유배에서 풀려나게 된 계기와, 사씨의 억울함을 깨닫고 그녀를 찾아 나서는 과정","a":"권세가가 실각하고 동청의 죄상이 드러나면서 유연수도 풀려난다. 자신의 어리석음을 뼈저리게 뉘우친 그는 사씨의 억울함을 깨닫고 직접 찾아 나선다.","k":[["동청","죄","드러","실각"],["풀려","석방"],["뉘우","깨달","반성"],["찾"]]},{"n":6,"q":"유연수와 사씨가 재회하는 과정과 악인인 교씨 및 동청이 받게 된 처벌","a":"우여곡절 끝에 두 사람은 다시 만나 오해를 풀고 화합한다. 동청은 처형되고 교씨 역시 죄가 모두 밝혀져 처벌받는다.","k":[["재회","다시 만","만나"],["동청"],["교씨"],["처형","처벌","죽","벌"]]},{"n":7,"q":"사씨가 정실로 복위한 후 가문의 결말과, 작가 김만중이 작품을 통해 전달하고자 한 정치적 메시지","a":"사씨는 정실로 복위하고 가문은 다시 번성한다. 김만중은 인현왕후 폐위와 장희빈 사건을 빗대어, 어진 사람을 내치고 간사한 자를 총애한 임금의 잘못을 깨우치려 했다.","k":[["복위","정실"],["번성","화목","가문"],["인현왕후","장희빈","숙종"],["깨우","풍간","비판","잘못"]]}],"theory":[{"n":1,"q":"〈사씨남정기〉의 작가, 갈래, 성격, 배경, 주제, 연대","a":"김만중이 숙종 때 남해 유배 중에 지은 한글 가정 소설이자 풍간 소설이다. 성격은 교훈적·풍자적이며, 배경은 중국 명나라이고, 주제는 처첩 갈등 속에서 드러나는 권선징악과 사씨의 덕행이다.","k":[["김만중"],["가정소설","가정","풍간"],["한글","숙종","유배"],["명나라","중국"],["권선징악","덕","처첩"]]},{"n":2,"q":"인물 설명 — 사씨, 교씨, 유연수","a":"사씨는 덕과 지혜를 갖춘 이상적 여성으로 모함을 받고도 원망 없이 견디는 선의 표상이다. 교씨는 겉으로 순종하나 속으로 시기와 욕심이 가득한 악인이며, 유연수는 판단력이 흐려 간계에 속아 아내를 내쳤다가 뒤에 뉘우치는 인물로 어리석은 군주를 빗댄 존재다.","k":[["사씨","덕","지혜","선"],["교씨","시기","욕심","악"],["유연수","속","어리","뉘우"],["군주","임금","빗대"]]},{"n":3,"q":"〈사씨남정기〉의 창작 배경","a":"숙종이 인현왕후를 폐위하고 장희빈을 총애하던 시기에, 남해로 유배 간 김만중이 이를 바로잡고자 지었다. 임금을 직접 비판할 수 없으니 명나라 가정의 이야기로 옮겨 놓고 깨우침을 주려 한 것이다.","k":[["숙종","인현왕후","장희빈"],["폐위","총애"],["유배","김만중"],["직접","빗대","깨우","풍간"]]},{"n":4,"q":"〈사씨남정기〉의 문학사적 의의","a":"우리 문학에서 본격적인 가정 소설의 출발점으로 꼽히며, 처첩 갈등이라는 소재를 소설의 중심 갈등으로 끌어올렸다. 한글 소설의 문장과 짜임을 한 단계 높였고 「장화홍련전」 등 후대 가정 소설에 큰 영향을 주었다.","k":[["가정소설","최초","출발","본격"],["처첩","갈등"],["한글","수준","문장"],["영향","후대","장화홍련"]]},{"n":5,"q":"풍간소설이란 무엇인가","a":"임금이나 권력자의 잘못을 직접 지적하지 않고 이야기에 빗대어 넌지시 깨우치는 소설이다. 〈사씨남정기〉는 명나라 유씨 가문의 일로 옮겨 놓았지만 실제로는 숙종의 잘못을 겨냥하고 있어 대표적인 풍간 소설로 꼽힌다.","k":[["직접","빗대","넌지시","간접"],["임금","권력","잘못"],["깨우","경계"],["숙종","대표","겨냥"]]},{"n":6,"q":"작품에 반영된 당대 사회상","a":"축첩이 허용되던 가부장제 아래에서 처와 첩의 갈등이 흔했고, 여성은 아들을 낳지 못하면 지위가 흔들렸다. 여성에게 덕과 인내를 요구하는 유교적 규범이 강했으며, 궁중의 권력 다툼이 가정의 갈등과 겹쳐 보이던 시대였다.","k":[["축첩","처첩","가부장"],["아들","후사","지위"],["유교","덕","인내","규범"],["궁중","권력","다툼"]]}]},{"id":"chung","name":"유충렬전","sub":"작자 미상 · 군담소설 · 영웅소설","story":[{"n":1,"q":"주인공 '유충렬'의 출생 배경과 그의 집안이 갖는 내력","a":"유충렬은 명나라 개국공신의 후예인 충신 정언주부 유심의 아들이다. 늦도록 자식이 없던 유심이 남악형산에 치성을 드린 뒤 천상 선관이 내려오는 태몽을 꾸고 그를 얻는다.","k":[["유심"],["충신","개국공신","명문"],["치성","형산","기도"],["태몽","선관","꿈"]]},{"n":2,"q":"간신 정한담 일파의 모함으로 유충렬의 집안이 겪게 된 시련과 이로 인한 충렬의 이별","a":"간신 정한담·최일귀가 유심을 모함해 유배 보내고, 집까지 해쳐 남은 가족을 없애려 한다. 충렬은 어머니와 달아나던 중 헤어져 홀로 떠돌게 된다.","k":[["정한담","최일귀"],["모함"],["유배","귀양"],["어머니","헤어","이별","흩어"]]},{"n":3,"q":"유랑하던 충렬이 도승지 강희주를 만나 구원받는 과정과, 다시 닥쳐온 시련","a":"떠돌던 충렬은 강희주에게 구원받고 그의 딸과 혼인한다. 그러나 강희주가 유심을 변호하는 상소를 올렸다가 정한담에게 걸려 유배되고, 그 집안까지 화를 입어 충렬은 다시 홀로 피신한다.","k":[["강희주"],["구원","도움","거두"],["혼인","딸","사위"],["상소","유배","화","피신"]]},{"n":4,"q":"깊은 산속으로 피신한 유충렬이 어떤 조력자를 만나 영웅으로 성장하는지","a":"깊은 산속으로 피신한 충렬은 노승(도승)을 만나 병법과 무예를 익힌다. 나아가 천사마·장성검·갑옷 같은 신이한 보물까지 얻으며 영웅으로 성장한다.","k":[["노승","도승","스승"],["병법","무예","도술"],["천사마","장성검","갑옷","보물","신물"]]},{"n":5,"q":"정한담 일파가 외적과 결탁하여 일으킨 반란과 명나라 조정이 처한 위기","a":"정한담 일파는 남적·북적 등 외적과 결탁해 반란을 일으켜 도성을 함락한다. 천자가 항복 직전까지 몰릴 만큼 조정이 절체절명의 위기에 빠진다.","k":[["정한담"],["외적","오랑캐","남적","북적","결탁"],["반란","난"],["천자","도성","항복","위기"]]},{"n":6,"q":"유충렬이 출전하여 위기에 빠진 천자(황제)를 구하고 원수를 갚는 과정","a":"유충렬이 홀연히 나타나 적군을 물리치고 사로잡히기 직전의 천자를 구출한다. 이어 정한담과 최일귀를 붙잡아 처단하며 아버지의 원수를 갚는다.","k":[["천자","황제","구"],["정한담","최일귀"],["원수","갚","처단","복수"]]},{"n":7,"q":"전쟁을 승리로 이끈 유충렬이 헤어졌던 가족과 재회하고 이루게 된 최종 결말","a":"유배지의 아버지와 헤어졌던 어머니, 아내와 장인까지 모두 찾아 재회한다. 충렬은 대사마 대장군에 오르고 연왕에 봉해져 부귀영화를 누린다.","k":[["아버지","어머니","가족","아내"],["재회","만","찾"],["대장군","연왕","벼슬","대사마"],["부귀","영화"]]}],"theory":[{"n":1,"q":"군담소설이란 무엇인가","a":"전쟁과 영웅의 활약을 중심으로 하는 소설 갈래다. 주인공이 위기에 빠진 나라를 구하고 적을 물리치는 과정을 그리며, 조선 후기 전란을 겪은 민중의 심리를 반영해 크게 유행했다.","k":[["전쟁","전란","싸움"],["영웅","활약","공"],["나라","구","위기"],["조선 후기","민중","유행"]]},{"n":2,"q":"〈유충렬전〉의 갈래, 성격, 배경, 주제","a":"작자 미상의 한글 소설로 군담 소설이자 영웅 소설이다. 성격은 영웅적·전기적·비현실적이며 배경은 중국 명나라다. 주제는 유충렬의 영웅적 활약과 나라를 위기에서 구해 내는 충의, 그리고 간신에 대한 응징이다.","k":[["군담","영웅소설","영웅"],["한글","작자 미상"],["명나라","중국"],["충","나라","응징","간신"]]},{"n":3,"q":"인물 설명 — 유충렬, 정한담, 최일귀","a":"유충렬은 고귀한 혈통으로 태어나 시련을 딛고 나라를 구하는 영웅적 주인공이다. 정한담은 권력욕에 눈이 멀어 충신을 모함하고 외적과 손잡아 반란을 일으키는 악인이며, 최일귀는 정한담을 도와 유심을 모함하고 반란에 가담하는 인물이다.","k":[["유충렬","영웅","혈통","주인공"],["정한담","권력","모함","반란"],["최일귀","가담","도와"]]},{"n":4,"q":"배경을 중국으로 설정한 이유","a":"조선을 무대로 삼아 지배층을 비판하면 화를 입을 수 있으므로 중국으로 옮겨 검열을 피했다. 명나라를 배경으로 삼는 것이 당시의 숭명 의식에도 맞았고, 천자를 구한다는 큰 규모의 이야기를 펼치기에도 적합했다.","k":[["검열","비판","피","화"],["명나라","숭명","존중"],["규모","천자","웅장"]]},{"n":5,"q":"병자호란 패전과 민중의식의 반영","a":"실제 역사에서는 청에게 굴욕적으로 패했지만 작품에서는 오랑캐를 통쾌하게 물리치고 천자를 구해 낸다. 현실에서 이루지 못한 승리를 소설에서 이루어 좌절감을 달래고, 나라를 지키지 못한 무능한 집권층에 대한 불만도 함께 담았다.","k":[["병자호란","청","오랑캐","패"],["승리","물리","통쾌"],["좌절","보상","위안","대리"],["집권층","무능","불만","비판"]]},{"n":6,"q":"시대적 상황과 복수극","a":"전란을 겪은 백성들에게는 침략자와 무능한 관리에 대한 응어리가 남아 있었다. 충렬이 아버지의 원수이자 나라를 팔아넘긴 정한담을 직접 붙잡아 처단하는 복수극은 그 응어리를 대신 풀어 주는 역할을 한다.","k":[["전란","백성","응어리","한"],["원수","정한담","복수","처단"],["대신","풀","대리","만족"]]},{"n":7,"q":"가족들과의 이별과 재회의 의미","a":"이별은 주인공을 시련에 빠뜨려 영웅으로 성장하게 만드는 계기이자, 전란으로 가족이 흩어진 당대 백성의 경험을 그대로 보여 준다. 마지막의 재회는 흩어진 가족이 다시 모이기를 바라는 민중의 소망을 이루어 주는 행복한 결말이다.","k":[["이별","시련","성장","계기"],["전란","백성","경험","흩어"],["재회","소망","행복","결말"]]},{"n":8,"q":"작품에 나타난 주술적 상상력","a":"기자치성과 천상 선관이 내려오는 태몽, 도승에게 얻은 천사마와 장성검, 도술로 벌이는 대결 등 초현실적 요소가 곳곳에 나타난다. 천상계가 주인공을 돕는 설정은 영웅의 비범함을 강조하고 어려움이 반드시 극복되리라는 믿음을 준다.","k":[["태몽","치성","천상","선관"],["천사마","장성검","도술","신물"],["초현실","비현실","신이"],["비범","영웅","강조"]]},{"n":9,"q":"〈유충렬전〉에 나타난 영웅의 일대기 구조","a":"명문 충신의 아들이라는 고귀한 혈통, 치성과 태몽에 의한 비정상적 출생, 정한담의 모함으로 가족과 헤어지는 어린 시절의 위기로 이어진다. 이후 강희주와 노승이라는 조력자에게 구출되고 가르침을 받아 성장하며, 반란이라는 시련을 물리치고 최고의 지위에 오르는 승리로 마무리된다.","k":[["고귀","혈통","명문"],["태몽","출생","치성"],["위기","헤어","모함"],["조력","구출","노승","강희주"],["시련","극복","승리"]]}]},{"id":"heo","name":"허생전","sub":"박지원 · 한문 풍자소설","story":[{"n":1,"q":"허생이 7년 동안 글읽기만 하다가 집을 나서게 된 직접적인 계기와 그 과정","a":"남산 묵적골에서 7년째 글만 읽던 허생에게, 굶주림을 참다못한 아내가 과거도 보지 않으면서 글은 읽어 무엇하냐며 차라리 도둑질이라도 하라고 힐난한다. 허생은 10년 기한을 채우지 못한 것을 아쉬워하며 책을 덮고 집을 나선다.","k":[["7년","칠년","글","독서"],["아내"],["도둑","굶","가난","힐난"],["집","나","떠"]]},{"n":2,"q":"허생이 부자 변씨를 찾아가 자금을 마련하는 과정과 두 사람의 태도","a":"한양 제일 부자 변씨를 찾아가 대뜸 만 냥을 빌려 달라 요구한다. 허생은 이름조차 밝히지 않을 만큼 당당했고, 변씨는 그 비범함을 알아보고 아무것도 묻지 않은 채 선뜻 내준다.","k":[["변씨"],["만냥","만 냥","1만","일만"],["당당","거리낌","대뜸"],["선뜻","묻지","빌려","내"]]},{"n":3,"q":"허생이 안성과 제주도 등에서 행한 경제 활동과 이를 통해 돈을 번 원리","a":"안성에서 제사에 쓰이는 과일을 모조리 사들였다가 열 배 값에 되팔고, 제주도에서는 말총을 매점해 망건값이 치솟자 큰 이익을 남긴다. 이는 매점매석 방식으로, 한 사람의 돈만으로도 시장이 흔들릴 만큼 조선 경제 구조가 취약함을 드러낸다.","k":[["안성","과일"],["제주","말총","망건"],["매점","독점","사들","싹쓸"],["열배","열 배","이익","취약"]]},{"n":4,"q":"허생이 변산의 도적들을 교화하여 섬으로 데리고 가 이상향을 건설하는 과정","a":"변산의 도적들에게 돈을 나눠 주고 소와 여자를 데려오게 한 뒤 무인도로 데려가 농사를 짓게 한다. 3년 뒤 남은 곡식을 팔아 큰돈을 얻고, 글 아는 자들을 데리고 나오며 화근을 없앤다는 말과 함께 섬을 떠난다.","k":[["변산","도적","도둑"],["섬","무인도"],["농사","곡식","소"],["화근","글","떠나","나오"]]},{"n":5,"q":"허생이 빌린 돈을 갚는 방식과, 어영대장 이완이 허생을 찾아오게 된 계기","a":"변씨에게 빌린 돈의 열 배인 십만 냥을 갚고, 변씨가 사양해도 끝내 받지 않는다. 이후 변씨가 그의 인물됨을 어영대장 이완에게 알렸고, 인재를 구하던 이완이 직접 찾아온다.","k":[["십만","10만","열배","열 배"],["갚"],["변씨"],["이완","어영대장","인재"]]},{"n":6,"q":"허생이 이완 대장에게 제시한 세 가지 계책(시무책)과 이완의 반응","a":"와룡선생 같은 인재를 천거할 테니 삼고초려하라, 명나라 유민의 후손을 후대하고 권세가의 재물과 집을 나누어 주라, 자제들을 청에 보내 유학하고 장사시켜 실정을 파악하라고 제안한다. 이완은 세 가지 모두 어렵다며 난색을 표한다.","k":[["삼고초려","와룡","인재","천거"],["명나라","종실","권세","훈척","재물"],["청","유학","장사","변발"],["어렵","난색","거절","못"]]},{"n":7,"q":"이완 대장이 도망친 후 허생의 행방과, 작가가 작품을 통해 전달하고자 한 주제","a":"분노한 허생이 칼을 찾자 이완은 달아났고, 이튿날 다시 가 보니 허생은 자취를 감춘 뒤였다. 작가는 북벌을 외치면서도 아무것도 실천하지 못하는 지배층의 무능과 허위를 비판하며 이용후생의 실학 정신을 강조한다.","k":[["칼","분노","화"],["도망","달아"],["자취","사라","감춘"],["북벌","지배층","무능","허위","실학"]]}],"theory":[{"n":1,"q":"〈허생전〉의 작가, 갈래, 성격, 배경","a":"박지원이 지은 한문 단편 소설로 『열하일기』의 「옥갑야화」에 실려 있다. 성격은 풍자적·비판적·실학적이며, 배경은 조선 후기의 한양과 안성·제주·변산 등이다.","k":[["박지원"],["열하일기","옥갑야화"],["한문","단편"],["풍자","실학","비판"],["조선","한양"]]},{"n":2,"q":"작품에 나타난 신분제의 동요","a":"양반인 허생은 가난해 아내에게 핀잔을 듣고 장사에 나서고, 상인인 변씨는 큰 재산으로 사회적 힘을 지닌다. 신분보다 경제력이 사람의 처지를 좌우하기 시작한 조선 후기의 변화가 그대로 드러난다.","k":[["양반","허생","가난","몰락"],["변씨","상인","부자","재산"],["경제력","돈","신분"],["조선 후기","변화","동요"]]},{"n":3,"q":"매점매석의 숨겨진 의미","a":"한 사람이 만 냥으로 나라 전체의 과일과 말총을 좌우할 수 있다는 것은 조선의 경제 규모가 그만큼 작고 유통 구조가 허술했음을 뜻한다. 허생은 돈을 벌려는 것이 아니라 이 취약함을 직접 보여 주어 당대 경제의 문제를 고발한 것이다.","k":[["규모","작","취약","허술"],["유통","경제","시장"],["고발","비판","드러","보여"],["돈","목적","아니"]]},{"n":4,"q":"이용후생의 실학사상","a":"이용후생은 기구와 물자를 편리하게 쓰고 그로써 백성의 삶을 넉넉하게 하자는 실학의 주장이다. 허생이 상업과 무역으로 재물을 늘리고 도적들에게 생업을 마련해 주는 대목, 청과 교류하자는 계책에 이 사상이 뚜렷하게 담겨 있다.","k":[["편리","물자","기구","이용"],["백성","삶","넉넉","후생"],["상업","무역","생업"],["청","교류","실학"]]},{"n":5,"q":"허생에게 장사는 어떤 의미인가","a":"허생에게 장사는 부자가 되기 위한 수단이 아니다. 조선 경제의 허약함을 실험으로 증명하고 도적들에게 살길을 마련해 주기 위한 방편이었으며, 그래서 번 돈을 미련 없이 바다에 버리거나 되돌려 준다.","k":[["부","돈","목적","아니"],["실험","증명","보여"],["도적","백성","살길","구제"],["버리","돌려","미련"]]},{"n":6,"q":"'빈 섬' 공간에 대한 설명","a":"신분 차별도 권력 다툼도 없이 농사만으로 살아가는 이상 사회를 실험한 공간이다. 조선 현실에 없는 이상향을 보여 줌으로써 현실의 문제를 비추어 주지만, 허생이 글 아는 자를 데리고 나오며 떠나는 데서 그 이상이 완전하지 못했음도 함께 드러난다.","k":[["이상","이상향","실험"],["신분","권력","차별","없"],["현실","조선","비판","비추"],["한계","떠","불완전"]]},{"n":7,"q":"허생의 모습에서 드러나는 사자성어","a":"7년간 가난 속에서도 글만 읽은 모습은 안빈낙도(安貧樂道)로 설명된다. 큰돈을 벌고도 미련 없이 버리는 태도는 청렴과 무욕을, 이완에게 세 계책을 내놓고 호통치는 장면은 우국충정(憂國衷情)을 보여 준다.","k":[["안빈낙도","가난","글"],["미련","버리","청렴","무욕"],["우국충정","나라","이완","계책"]]},{"n":8,"q":"〈허생전〉은 왜 미완으로 끝이 났나","a":"이완이 달아나고 허생이 자취를 감춘 채 끝나 결말이 열려 있다. 실학의 이상이 당시 조선의 지배 질서 안에서는 실현될 수 없었음을 보여 주는 동시에, 판단과 실천의 몫을 독자에게 넘겨 여운을 남기려 한 것이다.","k":[["열린","결말","사라","자취"],["실현","불가능","현실","한계"],["독자","판단","여운","몫"]]},{"n":9,"q":"작가가 허생을 통해 말하려는 바","a":"북벌을 외치면서도 아무것도 실천하지 못하는 지배층의 무능과 허위를 비판한다. 동시에 상업과 무역을 키워 백성의 삶을 넉넉하게 해야 한다는 이용후생의 실학 정신, 그리고 명분보다 실질을 앞세우는 태도를 강조한다.","k":[["북벌","지배층","무능","허위"],["비판","풍자"],["상업","무역","이용후생","실학"],["백성","실질","명분"]]}]}]};
const WORKS = DATA.works;
const SETS = {story:"줄거리", theory:"이론"};

let ST = {passed:{}, miss:{}, mode:"normal", edits:{}};
let cur = null, openId = null, armed = false;
const KEY = "gojeon_v3";

async function load(){
  try{const r = await window.storage.get(KEY); if(r && r.value) ST = Object.assign(ST, JSON.parse(r.value));}catch(e){}
}
function save(){ try{ window.storage.set(KEY, JSON.stringify(ST)); }catch(e){} }

const el = id=>document.getElementById(id);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key = (w,set,i)=>w.id+":"+set+":"+i;
const nDone = (w,set)=>w[set].filter((_,i)=>ST.passed[key(w,set,i)]).length;
const nAll = w=>w.story.length+w.theory.length;
const nDoneAll = w=>nDone(w,"story")+nDone(w,"theory");
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function getQ(w,set,i){
  const e = ST.edits[key(w,set,i)];
  return e ? Object.assign({}, w[set][i], e) : w[set][i];
}
function norm(s){ return String(s||"").toLowerCase().replace(/[\s,.\u00b7'"`~!?()\[\]{}<>:;\-–—…·「」『』〈〉]/g,""); }
function grade(text,q){
  const t = norm(text), hit=[], miss=[];
  q.k.forEach(g=>{ (g.some(w=>t.includes(norm(w))) ? hit : miss).push(g[0]); });
  const bad = (q.x||[]).filter(w=>w && t.includes(norm(w)));
  const allowed = ST.mode==="strict" ? 0 : (q.k.length>=4 ? 1 : 0);
  const isShort = t.length < 20;
  return {hit,miss,bad,allowed,tooShort:isShort,
          ok: !isShort && !bad.length && miss.length<=allowed};
}

/* ---------- 홈 ---------- */
function home(){
  cur = null;
  const worksDone = WORKS.filter(w=>nDoneAll(w)===nAll(w)).length;
  const qDone = WORKS.reduce((s,w)=>s+nDoneAll(w),0);
  const qAll  = WORKS.reduce((s,w)=>s+nAll(w),0);
  const nEdit = Object.keys(ST.edits||{}).length;

  const rows = WORKS.map(w=>{
    const d = nDoneAll(w), a = nAll(w), full = d===a;
    const open = openId===w.id;
    return '<div class="row'+(full?" done":"")+'">'
      + '<button class="rowhead" data-open="'+w.id+'">'
      +   '<span class="nm"><b>'+w.name+'</b><span>'+w.sub+'</span></span>'
      +   '<span class="frac">'+d+' / '+a+'</span>'
      +   (full?'<span class="mark">通</span>':'')
      + '</button>'
      + '<div class="panel'+(open?" open":"")+'" id="p-'+w.id+'"><div class="panel-in">'
      +   setBtn(w,"story") + setBtn(w,"theory")
      + '</div></div>'
      + '<span class="track"><i data-fill="'+(d/a*100)+'"></i></span>'
      + '</div>';
  }).join("");

  const missList = Object.entries(ST.miss).map(([k,v])=>{
    const [wid,set,idx]=k.split(":"); const w=WORKS.find(x=>x.id===wid);
    if(!w||!w[set]||!w[set][+idx]) return null;
    return {w:w.name,set:SETS[set],q:w[set][+idx].q,n:w[set][+idx].n,c:v};
  }).filter(Boolean).sort((a,b)=>b.c-a.c).slice(0,6);

  el("app").innerHTML =
    '<div class="top"><h1>고전소설 연습장</h1>'
    + '<div class="sub">9월 8일 수행평가 · 10작품 · '+qAll+'문항 랜덤</div>'
    + '<div class="by">만든 사람 · 안태현</div></div>'
    + '<div class="hr"></div>'
    + '<div class="tally"><span class="big">'+worksDone+'</span><span class="of">/ '+WORKS.length+' 작품 통과</span>'
    + '<span class="of" style="margin-left:auto">'+qDone+' / '+qAll+' 문항</span></div>'
    + '<div class="rows">'+rows+'</div>'
    + '<div class="nb"><h3>오답 노트</h3><p class="cap">틀린 횟수가 많은 순서예요.</p>'
    + (missList.length
        ? missList.map(m=>'<div class="miss"><span class="n">'+m.c+'회</span><div>'
            +'<em>'+m.w+' · '+m.set+' '+m.n+'번</em>'+esc(m.q)+'</div></div>').join("")
        : '<p class="none">아직 없어요. 작품을 골라 시작해 보세요.</p>')
    + '</div>'
    + '<div class="foot">'
    +   '<select id="mode"><option value="normal"'+(ST.mode==="normal"?" selected":"")+'>보통 채점</option>'
    +   '<option value="strict"'+(ST.mode==="strict"?" selected":"")+'>엄격 채점</option></select>'
    +   '<span style="font-size:12px;color:var(--ink-3)">'+(ST.mode==="strict"?"핵심어가 모두 있어야 통과":"핵심어 1개까지 빠져도 통과")+'</span>'
    +   (nEdit?'<button class="tinybtn" id="dump">고친 답안 '+nEdit+'개 내보내기</button>':'')
    +   '<button class="tinybtn'+(armed?" danger":"")+'" id="wipe" style="margin-left:auto">'
    +   (armed?"정말 지울까요? 한 번 더 누르기":"기록 지우기")+'</button>'
    +   '<div id="dumpbox" style="width:100%"></div>'
    + '</div>';

  requestAnimationFrame(()=>document.querySelectorAll("[data-fill]").forEach(b=>b.style.width=b.dataset.fill+"%"));
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
    openId = openId===b.dataset.open ? null : b.dataset.open; home();
  });
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    const [wid,set]=b.dataset.go.split(":"); start(wid,set);
  });
  el("mode").onchange = e=>{ ST.mode=e.target.value; save(); home(); };
  el("wipe").onclick = ()=>{
    if(!armed){ armed=true; home(); setTimeout(()=>{armed=false;},4000); return; }
    ST.passed={}; ST.miss={}; armed=false; save(); home();
  };
  if(el("dump")) el("dump").onclick = ()=>{
    el("dumpbox").innerHTML = '<textarea class="dump" readonly>'
      + esc(JSON.stringify(ST.edits,null,1)) + '</textarea>';
    el("dumpbox").querySelector("textarea").select();
  };
}
function setBtn(w,set){
  const d=nDone(w,set), a=w[set].length;
  return '<button class="pill'+(d===a?" full":"")+'" data-go="'+w.id+':'+set+'">'
    + '<b>'+SETS[set]+'</b><span>'+d+' / '+a+' 통과</span></button>';
}

/* ---------- 풀이 ---------- */
function start(wid,set){
  const w = WORKS.find(x=>x.id===wid);
  let todo = w[set].map((_,i)=>i).filter(i=>!ST.passed[key(w,set,i)]);
  if(!todo.length){ w[set].forEach((_,i)=>delete ST.passed[key(w,set,i)]); todo = w[set].map((_,i)=>i); }
  cur = {w,set,queue:shuffle(todo),total:todo.length,cleared:0};
  ask();
}

function shell(inner){
  const {w,set} = cur;
  const pct = cur.total ? cur.cleared/cur.total*100 : 0;
  el("app").innerHTML =
    '<div class="qtop"><button class="back" id="back">←</button>'
    + '<span class="where">'+w.name+' · '+SETS[set]+'</span>'
    + '<span class="count">'+cur.cleared+' / '+cur.total+'</span></div>'
    + '<div class="pbar"><i style="width:'+pct+'%"></i></div>'
    + '<div class="fade">'+inner+'</div>';
  el("back").onclick = ()=>{ openId=cur.w.id; home(); };
}

function ask(){
  if(!cur.queue.length) return finish();
  const {w,set} = cur, i = cur.queue[0], q = getQ(w,set,i);
  shell(
    '<p class="q">'+esc(q.q)+'</p>'
    + '<textarea id="ans" placeholder="두 문장 정도로 써 보세요."></textarea>'
    + '<div class="actions"><button class="btn" id="go">채점하기</button></div>'
    + '<p class="hint">'+SETS[set]+' '+q.n+'번 · 남은 문제 '+cur.queue.length+'개</p>'
  );
  const t = el("ans"); t.focus();
  el("go").onclick = check;
  t.onkeydown = e=>{ if(e.key==="Enter" && (e.metaKey||e.ctrlKey)) check(); };
}

function check(){
  const i = cur.queue[0];
  cur.last = {i, mine: el("ans").value};
  apply(grade(cur.last.mine, getQ(cur.w,cur.set,i)).ok, true);
}

/* ok=통과 여부, auto=자동 채점 결과인지 */
function apply(ok, auto){
  const {w,set} = cur, i = cur.last.i, q = getQ(w,set,i), k = key(w,set,i), mine = cur.last.mine;
  const r = grade(mine,q);

  // 이전 판정 되돌리기 (직접 고쳐 누른 경우)
  if(!auto){
    if(cur.last.ok && !ok){ delete ST.passed[k]; cur.cleared=Math.max(0,cur.cleared-1);
      ST.miss[k]=(ST.miss[k]||0)+1; if(!cur.queue.includes(i)) cur.queue=cur.queue.concat([i]); }
    if(!cur.last.ok && ok){ ST.passed[k]=true; cur.cleared++;
      if(ST.miss[k]){ ST.miss[k]--; if(!ST.miss[k]) delete ST.miss[k]; }
      cur.queue=cur.queue.filter(x=>x!==i); }
  }else{
    if(ok){ ST.passed[k]=true; cur.queue=cur.queue.slice(1); cur.cleared++; }
    else{ ST.miss[k]=(ST.miss[k]||0)+1; cur.queue=cur.queue.slice(1).concat([i]); }
  }
  cur.last.ok = ok;
  save();

  const chips = r.hit.map(x=>'<span class="chip">'+esc(x)+'</span>').join("")
              + r.miss.map(x=>'<span class="chip miss">'+esc(x)+'</span>').join("");
  let why;
  if(!auto) why = ok ? '직접 맞은 걸로 표시함' : '직접 틀린 걸로 표시함';
  else if(ok) why = '핵심어 '+r.hit.length+' / '+q.k.length+'개';
  else if(r.bad.length) why = '틀린 표현: ' + r.bad.join(", ");
  else if(r.tooShort) why = '답이 너무 짧아요';
  else why = '빠진 핵심어 '+r.miss.length+'개 · 뒤에서 다시 나와요';

  shell(
    '<div class="verdict'+(ok?"":" no")+'"><h2>'+(ok?"통과":"다시")+'</h2><p>'+why+'</p></div>'
    + '<p class="q" style="font-size:16.5px;margin:16px 0 0">'+esc(q.q)+'</p>'
    + '<div class="chips">'+chips+'</div>'
    + '<p class="sect">내가 쓴 답</p><div class="mine">'+esc(mine||"(빈칸)")+'</div>'
    + '<p class="sect">예시 답안</p><div class="model">'+esc(q.a)+'</div>'
    + '<div class="judge"><p class="ask">핵심어만 보고 매긴 점수예요. 예시 답안과 뜻이 같은지 직접 확인해 주세요.</p>'
    +   '<div class="set">'
    +     '<button class="flip'+(ok?" on":"")+'" data-flip="1">맞은 걸로 하기</button>'
    +     '<button class="flip warn'+(ok?"":" on")+'" data-flip="0">틀린 걸로 하기</button>'
    +     '<button class="flip small" id="edit">답안 고치기</button>'
    +   '</div></div>'
    + '<div class="actions"><button class="btn" id="next">'+(cur.queue.length?"다음 문제":"마치기")+'</button></div>'
  );
  document.querySelectorAll("[data-flip]").forEach(b=>b.onclick=()=>{
    const v = b.dataset.flip==="1";
    if(v!==cur.last.ok) apply(v,false);
  });
  el("edit").onclick = ()=>editor(i);
  el("next").onclick = ask;
  window.scrollTo(0,0);
}

/* ---------- 답안 고치기 ---------- */
function editor(i){
  const {w,set} = cur, q = getQ(w,set,i), k = key(w,set,i), edited = !!ST.edits[k];
  shell(
    '<div class="ed">'
    + '<p class="q" style="font-size:16.5px;margin:8px 0 0">'+esc(q.q)+'</p>'
    + '<label>예시 답안</label><textarea class="a" id="e-a">'+esc(q.a)+'</textarea>'
    + '<label>핵심어 — 한 줄에 한 개. 같은 뜻으로 인정할 말은 쉼표로 나열</label>'
    + '<textarea class="k" id="e-k">'+esc(q.k.map(g=>g.join(", ")).join("\n"))+'</textarea>'
    + '<label>이 말이 있으면 무조건 오답 — 쉼표로 나열 (비워도 됨)</label>'
    + '<textarea class="x" id="e-x">'+esc((q.x||[]).join(", "))+'</textarea>'
    + '<p class="note">예: 나무를 해 오는 조건인데 “숲을 베어”라고 쓰면 틀리게 하고 싶다면 여기에 <b>숲을 베어</b>를 넣으세요.</p>'
    + '<div class="actions"><button class="btn" id="e-save">저장</button>'
    +   '<button class="btn line" id="e-cancel">취소</button></div>'
    + (edited?'<div class="actions" style="margin-top:8px"><button class="btn line" id="e-undo">원래 답안으로 되돌리기</button></div>':'')
    + '</div>'
  );
  el("e-save").onclick = ()=>{
    const a = el("e-a").value.trim();
    const ks = el("e-k").value.split("\n").map(l=>l.split(",").map(s=>s.trim()).filter(Boolean)).filter(g=>g.length);
    const xs = el("e-x").value.split(",").map(s=>s.trim()).filter(Boolean);
    if(!a || !ks.length){ el("e-a").focus(); return; }
    ST.edits[k] = {a, k:ks, x:xs};
    save();
    if(cur.last && cur.last.i===i) apply(grade(cur.last.mine,getQ(w,set,i)).ok, true); else ask();
  };
  el("e-cancel").onclick = ()=>{ if(cur.last && cur.last.i===i) apply(cur.last.ok,false); else ask(); };
  if(edited) el("e-undo").onclick = ()=>{ delete ST.edits[k]; save();
    if(cur.last && cur.last.i===i) apply(grade(cur.last.mine,getQ(w,set,i)).ok, true); else ask(); };
}

function finish(){
  const {w,set} = cur;
  const whole = nDoneAll(w)===nAll(w);
  openId = w.id;
  home();
  const v = document.createElement("div");
  v.className = "veil";
  v.innerHTML = '<div class="card"><div class="seal">'+(whole?"通":"半")+'</div>'
    + '<h3>'+w.name+(whole?" 통과":" · "+SETS[set]+" 완료")+'</h3>'
    + '<p>'+(whole?"줄거리와 이론을 모두 맞혔어요.":"남은 "+SETS[set==="story"?"theory":"story"]+" 문제도 풀어 보세요.")+'</p>'
    + '<button class="btn" id="ok">목록으로</button></div>';
  document.body.appendChild(v);
  v.querySelector("#ok").onclick = ()=>v.remove();
}

load().then(home);
</script>
</body>
</html>
